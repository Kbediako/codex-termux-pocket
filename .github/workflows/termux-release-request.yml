          gh api --method PATCH "repos/$repo/issues/$ISSUE_NUMBER" \
            -F "body=@$body" -f state=closed -f state_reason=completed >/dev/null

          open_same_title="$(
            gh api --paginate "repos/$repo/issues?state=open&per_page=100" |
              jq -sr --arg title "Maintenance: update Codex Termux to $PACKAGE_VERSION" '
                [.[][] | select((.pull_request | not) and .title == $title) | .number] | length
              '
          )"
