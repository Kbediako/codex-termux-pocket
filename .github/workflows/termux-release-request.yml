name: termux-release-request
run-name: Termux release control · ${{ github.sha }}

# The only release writer. Maintenance requests use a separate permanent job;
# they cannot invoke publication, promotion, or arbitrary shell commands.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/termux/release-publication.env"
      - "scripts/termux/release-maintenance.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-release-request
  cancel-in-progress: false

jobs:
  route:
    name: Validate and separate release request types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      operation: ${{ steps.route.outputs.operation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test permanent maintenance guards
        run: python3 -m unittest discover -s .github/scripts/termux_release -p test_maintenance.py
      - id: route
        run: python3 .github/scripts/termux_release/maintenance.py route

  maintain-release:
    name: Execute bounded maintainer request
    needs: route
    if: needs.route.outputs.mode == 'maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned source toolchain when recording a reviewed merge
        if: needs.route.outputs.operation == 'record-upstream' || needs.route.outputs.operation == 'prepare-source'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Set up reviewed source preparation tools
        if: needs.route.outputs.operation == 'prepare-source'
        uses: ./.github/actions/setup-ci
      - name: Install pinned formatter dependency runner
        if: needs.route.outputs.operation == 'prepare-source'
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: uv@0.12.10
      - name: Install pinned Bazelisk
        if: needs.route.outputs.operation == 'prepare-source'
        run: bash .github/scripts/install-bazelisk.sh
      - name: Execute the immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: python3 .github/scripts/termux_release/maintenance.py run
      - name: Retain original source objects for independent merge review
        if: always() && (needs.route.outputs.operation == 'export-upstream' || needs.route.outputs.operation == 'import-upstream')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: termux-source-export
          path: ${{ runner.temp }}/termux-source-export/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Retain generated files for independent maintainer review
        if: always() && needs.route.outputs.operation == 'prepare-source'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: termux-prepared-source
          path: ${{ runner.temp }}/termux-prepared-source/
          if-no-files-found: error
          retention-days: 3

  publish-validated-runtime:
    name: Publish complete immutable release as Latest
    needs: route
    if: needs.route.outputs.mode == 'publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout immutable release controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the executable release contract
        shell: bash
        run: python3 .github/scripts/termux_release_control.py self-test

      - name: Validate all exact-source release gates
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py validate-request
          --request scripts/termux/release-publication.env

      - name: Download the retained exact production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ steps.request.outputs.artifact_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name codex-termux-aarch64-unknown-linux-musl \
            --dir dist

      - name: Verify artifact internals and prepare the fifth asset
        id: manifest
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py prepare
          --dist dist
          --source-sha "${{ steps.request.outputs.source_sha }}"
          --release-tag "${{ steps.request.outputs.release_tag }}"
          --package-version "${{ steps.request.outputs.expected_package_version }}"
          --codex-version "${{ steps.request.outputs.expected_codex_version }}"

      - name: Attest the complete publication set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
            dist/codex-termux-sbom.spdx.json
            dist/metadata.env
            dist/release-manifest.env
            dist/SHA256SUMS

      - name: Attest the SPDX SBOM for the runtime archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
          sbom-path: dist/codex-termux-sbom.spdx.json

      - name: Stage the complete draft and publish it as Latest once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py publish
          --dist dist
          --package-version "${{ steps.request.outputs.expected_package_version }}"

      - name: Verify anonymous public bytes, identity, and attestations
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py audit
          --manifest dist/release-manifest.env
          --local-dir dist
          --verify-attestations
          --receipt "${{ runner.temp }}/termux-release-audit-receipt.json"

      - name: Promote only the anonymously audited release manifest
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py promote
          --manifest dist/release-manifest.env
          --receipt "${{ runner.temp }}/termux-release-audit-receipt.json"
