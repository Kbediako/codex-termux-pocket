- Fork CI: `${{ steps.request.outputs.fork_ci_run_id }}` — success
- Control-plane: `${{ steps.request.outputs.control_run_id }}` — success
- Linux sandbox x64 and ARM64: `${{ steps.request.outputs.sandbox_run_id }}` — success
- Production ARM64 artifact: `${{ steps.request.outputs.artifact_run_id }}` — success and retained
- Native Android/Termux: `${{ steps.request.outputs.android_run_id }}` — fixture and real app success

## Atomic public release

- Publisher run: `$GITHUB_RUN_ID` — success
- Release ID: `$(jq -r '.id' <<<"$latest_json")`
- Release name: `$(jq -r '.name' <<<"$latest_json")`
- `target_commitish`: `$SOURCE_SHA`
- `/releases/latest`: verified
- Tag ref: resolves to `$SOURCE_SHA`
- Anonymous downloads, strict checksums, metadata, safe archive, runtime checksums, SPDX source identity, API digests and sizes, and publisher attestations: verified

$assets

## Permanent post-promotion verification

- Release-channel: `$RELEASE_CHANNEL_RUN_ID` — success
- Governance: `$GOVERNANCE_RUN_ID` — success
- Control-plane: `$POST_CONTROL_RUN_ID` — success
- Fork CI: `$POST_FORK_CI_RUN_ID` — success

## Cleanup

- Final workflow inventory: the documented permanent eight workflows only
- Final branch inventory: `main` only
- Temporary bootstrap scripts, startup hooks, workflows, jobs, branches, labels, and release orchestration paths: absent
- No unexpected Actions run remains in progress

