- Annotated upstream tag: `$UPSTREAM_TAG`
- Annotated tag object: `$UPSTREAM_TAG_OBJECT`
- Recursively peeled OpenAI commit: `$UPSTREAM_COMMIT`
- Two-parent integration merge and exact runtime source: `$SOURCE_SHA`
- Final cleaned main: `$FINAL_MAIN`
- Live ancestry verification: passed

