name: termux-release-request
run-name: Publish validated Termux runtime from ${{ github.sha }}

# This is the repository's only release writer. The request file identifies one
# runtime source and the five successful exact-source gates. A shared executable
# contract validates, publishes, anonymously audits, and only then promotes it.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/termux/release-publication.env"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: termux-release-request
  cancel-in-progress: false

jobs:
  publish-validated-runtime:
    name: Publish complete immutable release as Latest
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout immutable release controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the executable release contract
        shell: bash
        run: python3 .github/scripts/termux_release_control.py self-test

      - name: Validate all exact-source release gates
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py validate-request
          --request scripts/termux/release-publication.env

      - name: Download the retained exact production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ steps.request.outputs.artifact_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name codex-termux-aarch64-unknown-linux-musl \
            --dir dist

      - name: Verify artifact internals and prepare the fifth asset
        id: manifest
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py prepare
          --dist dist
          --source-sha "${{ steps.request.outputs.source_sha }}"
          --release-tag "${{ steps.request.outputs.release_tag }}"
          --package-version "${{ steps.request.outputs.expected_package_version }}"
          --codex-version "${{ steps.request.outputs.expected_codex_version }}"

      - name: Attest the complete publication set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
            dist/codex-termux-sbom.spdx.json
            dist/metadata.env
            dist/release-manifest.env
            dist/SHA256SUMS

      - name: Attest the SPDX SBOM for the runtime archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
          sbom-path: dist/codex-termux-sbom.spdx.json

      - name: Stage the complete draft and publish it as Latest once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py publish
          --dist dist
          --package-version "${{ steps.request.outputs.expected_package_version }}"

      - name: Verify anonymous public bytes, identity, and attestations
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py audit
          --manifest dist/release-manifest.env
          --local-dir dist
          --verify-attestations
          --receipt "${{ runner.temp }}/termux-release-audit-receipt.json"

      - name: Promote only the anonymously audited release manifest
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/termux_release_control.py promote
          --manifest dist/release-manifest.env
          --receipt "${{ runner.temp }}/termux-release-audit-receipt.json"
