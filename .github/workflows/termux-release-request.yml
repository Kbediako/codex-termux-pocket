name: termux-release-request
run-name: Publish Termux runtime from ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - "scripts/termux/release-request.env"
      - ".github/workflows/termux-release-request.yml"
  workflow_dispatch:

concurrency:
  group: termux-release-request-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish-validated-runtime:
    name: Publish and promote validated Termux runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request and workflow-head source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file="scripts/termux/release-request.env"

          read_value() {
            local key="$1"
            local value
            value="$(sed -n "s/^${key}=//p" "$request_file")"
            if [[ -z "$value" || "$(grep -c "^${key}=" "$request_file")" -ne 1 ]]; then
              echo "::error file=${request_file}::Expected exactly one non-empty ${key}= entry"
              exit 1
            fi
            printf '%s' "$value"
          }

          invalid_lines="$(
            grep -Env \
              '^(format_version|source_mode|release_tag_prefix|expected_package_version)=[^[:space:]].*$|^[[:space:]]*(#.*)?$' \
              "$request_file" || true
          )"
          if [[ -n "$invalid_lines" ]]; then
            printf '%s\n' "$invalid_lines" >&2
            echo "::error file=${request_file}::Release request contains an unknown, malformed, or empty field"
            exit 1
          fi

          format_version="$(read_value format_version)"
          source_mode="$(read_value source_mode)"
          release_tag_prefix="$(read_value release_tag_prefix)"
          expected_package_version="$(read_value expected_package_version)"

          [[ "$format_version" == "3" ]] || {
            echo "::error file=${request_file}::Unsupported format_version=${format_version}"
            exit 1
          }
          [[ "$source_mode" == "workflow-head" ]] || {
            echo "::error file=${request_file}::source_mode must be workflow-head"
            exit 1
          }
          [[ "$release_tag_prefix" =~ ^termux-v[0-9A-Za-z._-]+$ ]] || {
            echo "::error file=${request_file}::release_tag_prefix must match termux-v..."
            exit 1
          }
          [[ "$expected_package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || {
            echo "::error file=${request_file}::Unexpected expected_package_version format"
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Termux releases must run from refs/heads/main, not ${GITHUB_REF}"
            exit 1
          }

          source_sha="$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$source_sha" ]]
          git cat-file -e "${source_sha}^{commit}"

          package_version="$(
            awk '
              /^\[workspace\.package\]$/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' codex-rs/Cargo.toml
          )"
          [[ "$package_version" == "$expected_package_version" ]] || {
            echo "::error file=codex-rs/Cargo.toml::Workflow-head package version ${package_version:-missing} does not match ${expected_package_version}"
            exit 1
          }

          expected_codex_version="codex-cli ${source_sha:0:7}"
          release_tag="${release_tag_prefix}-${source_sha:0:10}"

          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "expected_package_version=${expected_package_version}" >> "$GITHUB_OUTPUT"
          echo "expected_codex_version=${expected_codex_version}" >> "$GITHUB_OUTPUT"
          {
            echo "### Requested Termux release"
            echo
            echo "- Runtime commit: ${source_sha}"
            echo "- Source mode: ${source_mode}"
            echo "- Package version: ${expected_package_version}"
            echo "- Binary version: ${expected_codex_version}"
            echo "- Tag: ${release_tag}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure exact workflow-head aarch64 artifact
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          workflow="termux-mobile-artifact.yml"

          latest_exact_run() {
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=100" \
              --jq ".workflow_runs
                | map(select(.head_sha == \"${SOURCE_SHA}\"))
                | first // {}
                | [(.id // \"\"), (.status // \"\"), (.conclusion // \"\")]
                | @tsv"
          }

          run_state="$(latest_exact_run)"
          IFS=$'\t' read -r run_id status conclusion <<<"$run_state"

          if [[ -z "$run_id" ]]; then
            echo "Dispatching ${workflow} for exact source ${SOURCE_SHA}"
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f source_ref="$SOURCE_SHA"
          fi

          run_id=""
          for _ in $(seq 1 480); do
            run_state="$(latest_exact_run)"
            IFS=$'\t' read -r candidate_id status conclusion <<<"$run_state"
            if [[ -n "$candidate_id" ]]; then
              run_id="$candidate_id"
              case "$status" in
                completed)
                  [[ "$conclusion" == "success" ]] || {
                    echo "::error::Exact aarch64 artifact run ${run_id} concluded ${conclusion}"
                    exit 1
                  }
                  break
                  ;;
                queued|in_progress|pending|requested|waiting)
                  ;;
                *)
                  echo "::warning::Exact aarch64 artifact run ${run_id} has status ${status:-unknown}"
                  ;;
              esac
            fi
            sleep 15
          done

          [[ -n "$run_id" && "$status" == "completed" && "$conclusion" == "success" ]] || {
            echo "::error::No successful exact aarch64 artifact run completed for ${SOURCE_SHA}"
            exit 1
          }

          resolved_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha
          )"
          [[ "$resolved_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::Artifact run ${run_id} resolved ${resolved_sha}, expected ${SOURCE_SHA}"
            exit 1
          }

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Validated aarch64 artifact run: ${run_id}" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact native Android/Termux validation
        id: android_run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          workflow="termux-android-emulator.yml"
          run_id=""

          for _ in $(seq 1 360); do
            run_state="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=push&branch=main&per_page=100" \
                --jq ".workflow_runs
                  | map(select(.head_sha == \"${SOURCE_SHA}\"))
                  | first // {}
                  | [(.id // \"\"), (.status // \"\"), (.conclusion // \"\")]
                  | @tsv"
            )"
            IFS=$'\t' read -r candidate_id status conclusion <<<"$run_state"
            if [[ -n "$candidate_id" ]]; then
              run_id="$candidate_id"
              case "$status" in
                completed)
                  [[ "$conclusion" == "success" ]] || {
                    echo "::error::Android/Termux validation run ${run_id} concluded ${conclusion}"
                    exit 1
                  }
                  break
                  ;;
                queued|in_progress|pending|requested|waiting)
                  ;;
              esac
            fi
            sleep 20
          done

          [[ -n "$run_id" && "$status" == "completed" && "$conclusion" == "success" ]] || {
            echo "::error::No successful Android/Termux validation completed for ${SOURCE_SHA}"
            exit 1
          }

          resolved_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha
          )"
          [[ "$resolved_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::Android run ${run_id} resolved ${resolved_sha}, expected ${SOURCE_SHA}"
            exit 1
          }

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Validated Android/Termux run: ${run_id}" >> "$GITHUB_STEP_SUMMARY"

      - name: Download validated aarch64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.artifact_run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name codex-termux-aarch64-unknown-linux-musl \
            --dir dist

      - name: Revalidate artifact and generate immutable release manifest
        id: manifest
        env:
          EXPECTED_CODEX_VERSION: ${{ steps.request.outputs.expected_codex_version }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          required_files=(
            codex-termux-aarch64-unknown-linux-musl.tar.gz
            metadata.env
            SHA256SUMS
            codex-termux-sbom.spdx.json
          )
          for file in "${required_files[@]}"; do
            [[ -f "$file" ]] || { echo "::error::Missing artifact file: $file"; exit 1; }
          done
          sha256sum --check --strict SHA256SUMS
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' codex-termux-sbom.spdx.json

          metadata_value() {
            local key="$1"
            local value
            value="$(sed -n "s/^${key}=//p" metadata.env)"
            if [[ -z "$value" || "$(grep -c "^${key}=" metadata.env)" -ne 1 ]]; then
              echo "::error file=dist/metadata.env::Expected exactly one non-empty ${key}= entry"
              exit 1
            fi
            printf '%s' "$value"
          }

          metadata_format="$(metadata_value format_version)"
          head_sha="$(metadata_value head_sha)"
          codex_version="$(metadata_value codex_version)"
          target="$(metadata_value target)"
          archive_size_bytes="$(metadata_value archive_size_bytes)"
          runtime_size_bytes="$(metadata_value runtime_size_bytes)"

          [[ "$metadata_format" == "2" ]]
          [[ "$head_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::Artifact commit ${head_sha} does not match requested commit ${SOURCE_SHA}"
            exit 1
          }
          [[ "$head_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::Release target ${head_sha} must equal workflow head ${GITHUB_SHA}"
            exit 1
          }
          [[ "$codex_version" == "$EXPECTED_CODEX_VERSION" ]] || {
            echo "::error::Artifact binary version ${codex_version} does not match ${EXPECTED_CODEX_VERSION}"
            exit 1
          }
          [[ "$target" == "aarch64-unknown-linux-musl" ]]
          [[ "$archive_size_bytes" =~ ^[0-9]+$ ]]
          [[ "$runtime_size_bytes" =~ ^[0-9]+$ ]]
          [[ "$archive_size_bytes" == "$(stat -c '%s' codex-termux-aarch64-unknown-linux-musl.tar.gz)" ]]

          archive_sha256="$(sha256sum codex-termux-aarch64-unknown-linux-musl.tar.gz | awk '{print $1}')"
          printf '%s\n' \
            'format_version=2' \
            "repository=${GITHUB_REPOSITORY}" \
            "release_tag=${RELEASE_TAG}" \
            "head_sha=${head_sha}" \
            "codex_version=${codex_version}" \
            "archive_sha256=${archive_sha256}" \
            "archive_size_bytes=${archive_size_bytes}" \
            "runtime_size_bytes=${runtime_size_bytes}" \
            > release-manifest.env

          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "codex_version=${codex_version}" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=${archive_sha256}" >> "$GITHUB_OUTPUT"

      - name: Attest Termux runtime build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
            dist/metadata.env
            dist/SHA256SUMS
            dist/codex-termux-sbom.spdx.json
            dist/release-manifest.env

      - name: Attest Termux runtime SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
          sbom-path: dist/codex-termux-sbom.spdx.json

      - name: Publish immutable-by-contract public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          HEAD_SHA: ${{ steps.manifest.outputs.head_sha }}
          CODEX_VERSION: ${{ steps.manifest.outputs.codex_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::Refusing to create a release for non-workflow-head commit ${HEAD_SHA}"
            exit 1
          }
          main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced to ${main_sha}; refusing to publish stale workflow head ${GITHUB_SHA}"
            exit 1
          }

          release_files=(
            codex-termux-aarch64-unknown-linux-musl.tar.gz
            metadata.env
            SHA256SUMS
            codex-termux-sbom.spdx.json
            release-manifest.env
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$existing_dir"
            for file in "${release_files[@]}"; do
              [[ -f "$existing_dir/$file" ]] || {
                echo "::error::Existing release ${RELEASE_TAG} is missing ${file}"
                exit 1
              }
              cmp --silent "dist/$file" "$existing_dir/$file" || {
                echo "::error::Existing release ${RELEASE_TAG} has mismatched immutable asset ${file}"
                exit 1
              }
            done
            echo "Release ${RELEASE_TAG} already exists with byte-identical assets." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Codex Termux ${CODEX_VERSION}" \
              --notes "Verified complete Termux runtime for ${HEAD_SHA}. Native Android/Termux emulator validation passed before publication." \
              --latest=false \
              "${release_files[@]/#/dist/}"
          fi

      - name: Verify anonymous public release downloads
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          public_dir="$(mktemp -d)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          for file in \
            codex-termux-aarch64-unknown-linux-musl.tar.gz \
            metadata.env \
            SHA256SUMS \
            codex-termux-sbom.spdx.json \
            release-manifest.env; do
            curl --fail --location --silent --show-error --retry 5 \
              "${base}/${file}" -o "${public_dir}/${file}"
            cmp --silent "dist/${file}" "${public_dir}/${file}"
          done
          (cd "$public_dir" && sha256sum --check --strict SHA256SUMS)

      - name: Promote release manifest on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_response="$(
            gh api "/repos/${GITHUB_REPOSITORY}/contents/scripts/termux/release-manifest.env?ref=main"
          )"
          manifest_sha="$(jq -r .sha <<<"$manifest_response")"
          current_manifest="$(mktemp)"
          jq -r .content <<<"$manifest_response" | tr -d '\n' | base64 --decode > "$current_manifest"
          if cmp --silent dist/release-manifest.env "$current_manifest"; then
            echo "Release manifest already promotes ${RELEASE_TAG}; no commit required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          encoded_manifest="$(base64 -w0 dist/release-manifest.env)"
          gh api --method PUT \
            "/repos/${GITHUB_REPOSITORY}/contents/scripts/termux/release-manifest.env" \
            -f message="termux: promote ${RELEASE_TAG}" \
            -f content="$encoded_manifest" \
            -f sha="$manifest_sha" \
            -f branch=main >/dev/null
          echo "Promoted ${RELEASE_TAG} to scripts/termux/release-manifest.env" >> "$GITHUB_STEP_SUMMARY"
