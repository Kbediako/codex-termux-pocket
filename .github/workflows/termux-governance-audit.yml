name: termux-governance-audit
run-name: Termux governance audit · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/termux-*.yml"
      - "scripts/termux/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: termux-governance-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-channel:
    name: Verify release identity and governance state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCED_PUSH: ${{ github.event.forced || false }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Cancel stale queued governance runs
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          cancel_cutoff_epoch="$(( now_epoch - 6 * 60 * 60 ))"
          delete_cutoff_epoch="$(( now_epoch - 7 * 24 * 60 * 60 ))"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .created_at] | @tsv' \
            | while IFS=$'\t' read -r run_id workflow_path created_at; do
                [[ "$run_id" != "$GITHUB_RUN_ID" ]] || continue
                [[ "$workflow_path" == ".github/workflows/termux-governance-audit.yml" ]] || continue
                created_epoch="$(date -u -d "$created_at" +%s)"
                (( created_epoch < cancel_cutoff_epoch )) || continue

                cancellation_accepted=false
                if gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                  >/dev/null 2>&1; then
                  cancellation_accepted=true
                elif gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
                  >/dev/null 2>&1; then
                  cancellation_accepted=true
                else
                  (( created_epoch < delete_cutoff_epoch )) || {
                    echo "::error::Queued governance run ${run_id} rejected cancel and force-cancel"
                    exit 1
                  }
                  gh api --method DELETE \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                    >/dev/null
                  echo "- Deleted irrecoverable stale queued governance run \`${run_id}\` after both cancellation endpoints failed." \
                    >>"$GITHUB_STEP_SUMMARY"
                  continue
                fi

                [[ "$cancellation_accepted" == "true" ]]
                cancelled=false
                for _ in {1..20}; do
                  run_state="$(
                    gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                      --jq '[.status, (.conclusion // "")] | @tsv'
                  )"
                  if [[ "$run_state" == $'completed\tcancelled' ]]; then
                    cancelled=true
                    break
                  fi
                  sleep 3
                done
                [[ "$cancelled" == "true" ]] || {
                  echo "::error::Stale governance run ${run_id} did not become cancelled"
                  exit 1
                }
                echo "- Cancelled stale queued governance run \`${run_id}\`." \
                  >>"$GITHUB_STEP_SUMMARY"
              done

      - name: Checkout audited main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject observed force pushes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCED_PUSH" == "true" ]]; then
            echo "::error::A force push to main was observed. Audit the rewritten history immediately."
            exit 1
          fi

      - name: Verify the promoted public release
        shell: bash
        run: python3 .github/scripts/audit-termux-public-channel.py

      - name: Audit main branch protection visibility
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/main-protection.json"
          status="$(
            curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main/protection"
          )"
          case "$status" in
            200)
              force="$(jq -r '.allow_force_pushes.enabled // false' "$response")"
              deletion="$(jq -r '.allow_deletions.enabled // false' "$response")"
              if [[ "$force" != "false" || "$deletion" != "false" ]]; then
                echo "::error::main protection permits force pushes or deletion."
                exit 1
              fi
              echo '- Main force pushes/deletion: `blocked`' >>"$GITHUB_STEP_SUMMARY"
              ;;
            403|404)
              echo "::warning::The Actions token cannot inspect branch protection. Force-push events are still detected, but prevention requires repository Administration permission."
              echo '- Main branch protection visibility: `unavailable to Actions token`' >>"$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat "$response" >&2
              echo "::error::Unexpected branch protection API status: $status"
              exit 1
              ;;
          esac
