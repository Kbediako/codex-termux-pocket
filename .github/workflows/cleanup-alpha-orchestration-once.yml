name: cleanup-alpha-orchestration-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-alpha-orchestration-once.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-alpha-orchestration-once
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/close-44-and-sync-latest-alpha-once.yml \
            .github/workflows/close-44-and-sync-latest-alpha-once-v2.yml \
            .github/workflows/post-alpha-governance-once.yml \
            .github/workflows/cleanup-alpha-orchestration-once.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: remove temporary alpha orchestration"
          git push origin HEAD:main
