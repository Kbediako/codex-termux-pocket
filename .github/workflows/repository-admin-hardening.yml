name: repository-admin-hardening

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-admin-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Attempt minimal non-PR main protection
        id: protection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/protection-response.json"
          payload="$RUNNER_TEMP/protection-request.json"
          cat >"$payload" <<'JSON'
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": false,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON
          status="$(
            curl --silent --show-error \
              --request PUT \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main/protection"
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "200" ]]; then
            jq -e '
              (.allow_force_pushes.enabled // false) == false and
              (.allow_deletions.enabled // false) == false
            ' "$response" >/dev/null
            echo 'Main protection was applied: direct pushes remain allowed; force pushes and deletion are disabled.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub rejected automated branch protection with HTTP $status."
            jq -r '.message // .' "$response" >&2 || cat "$response" >&2
            echo "GitHub rejected automated branch protection with HTTP $status." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record result and remove one-shot workflow
        env:
          PROTECTION_STATUS: ${{ steps.protection.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          if [[ "$PROTECTION_STATUS" == "200" ]]; then
            state=applied
          else
            state=administration_permission_unavailable
          fi
          cat >.github/repository-governance-status.json <<JSON
          {
            "format_version": 1,
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$GITHUB_SHA",
            "main_protection": "$state",
            "api_status": $PROTECTION_STATUS,
            "direct_pushes_required_by_project": true,
            "force_pushes_requested": false,
            "branch_deletion_requested": false
          }
          JSON
          rm -f .github/workflows/repository-admin-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: record repository governance capability'
          git push origin HEAD:main
