name: termux-release-channel
run-name: Verify promoted Termux release channel

# This read-only verifier executes the same machine-readable public-release
# contract used immediately before manifest promotion. It cannot publish or edit
# a release, so publication and independent verification share semantics without
# sharing write authority.
# A maintainer push that changes this verifier or the promoted manifest
# deliberately re-audits the live public channel at that exact main revision.
on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/audit-termux-public-channel.py"
      - ".github/scripts/termux_release_control.py"
      - ".github/workflows/termux-release-channel.yml"
      - "scripts/termux/release-manifest.env"
  workflow_dispatch:

# Temporary exact-run cleanup authority. This permission and the guarded cleanup
# step are removed immediately after orphan run 32212182486 is proven absent.
permissions:
  actions: write
  contents: read
  attestations: read

concurrency:
  group: termux-release-channel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-latest-release:
    name: Verify promoted release is complete and Latest
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout promoted manifest and verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Remove exact orphaned temporary workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          ORPHAN_RUN_ID: "32212182486"
          ORPHAN_RUN_PATH: ".github/workflows/termux-governance-audit.yml"
          ORPHAN_HEAD_SHA: "4cbbb06b331affb71fd6bf41bff3ea365d489b8a"
          ORPHAN_EVENT: "workflow_dispatch"
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$ORPHAN_RUN_ID"
          response="$RUNNER_TEMP/orphan-run.json"
          mutation_response="$RUNNER_TEMP/orphan-run-mutation.json"
          common=(
            --silent
            --show-error
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          get_run() {
            curl "${common[@]}" \
              --output "$response" \
              --write-out '%{http_code}' \
              "$api"
          }

          code="$(get_run)"
          if [[ "$code" == "404" ]]; then
            echo "Orphaned temporary workflow run $ORPHAN_RUN_ID is already absent."
            exit 0
          fi
          if [[ "$code" != "200" ]]; then
            cat "$response" >&2 || true
            echo "::error::Unexpected lookup status for orphan run $ORPHAN_RUN_ID: $code"
            exit 1
          fi

          actual_id="$(jq -r '.id' "$response")"
          actual_path="$(jq -r '.path' "$response")"
          actual_head="$(jq -r '.head_sha' "$response")"
          actual_event="$(jq -r '.event' "$response")"
          if [[ "$actual_id" != "$ORPHAN_RUN_ID" || \
                "$actual_path" != "$ORPHAN_RUN_PATH" || \
                "$actual_head" != "$ORPHAN_HEAD_SHA" || \
                "$actual_event" != "$ORPHAN_EVENT" ]]; then
            cat "$response" >&2
            echo "::error::Refusing to mutate a workflow run whose identity differs from the audited orphan."
            exit 1
          fi

          status="$(jq -r '.status' "$response")"
          if [[ "$status" != "completed" ]]; then
            cancel_code="$(
              curl "${common[@]}" \
                --request POST \
                --output "$mutation_response" \
                --write-out '%{http_code}' \
                "$api/cancel"
            )"
            if [[ "$cancel_code" != "202" && "$cancel_code" != "409" ]]; then
              cat "$mutation_response" >&2 || true
              echo "::error::Unexpected cancellation status for orphan run $ORPHAN_RUN_ID: $cancel_code"
              exit 1
            fi

            for attempt in $(seq 1 20); do
              sleep 2
              code="$(get_run)"
              if [[ "$code" == "404" ]]; then
                echo "Orphaned temporary workflow run $ORPHAN_RUN_ID disappeared during cancellation."
                exit 0
              fi
              if [[ "$code" != "200" ]]; then
                cat "$response" >&2 || true
                echo "::error::Unexpected poll status for orphan run $ORPHAN_RUN_ID: $code"
                exit 1
              fi
              status="$(jq -r '.status' "$response")"
              if [[ "$status" == "completed" ]]; then
                break
              fi
              if [[ "$attempt" == "10" ]]; then
                force_code="$(
                  curl "${common[@]}" \
                    --request POST \
                    --output "$mutation_response" \
                    --write-out '%{http_code}' \
                    "$api/force-cancel"
                )"
                if [[ "$force_code" != "202" && "$force_code" != "409" ]]; then
                  cat "$mutation_response" >&2 || true
                  echo "::error::Unexpected force-cancel status for orphan run $ORPHAN_RUN_ID: $force_code"
                  exit 1
                fi
              fi
            done
          fi

          if [[ "$status" != "completed" ]]; then
            cat "$response" >&2 || true
            echo "::error::Orphan run $ORPHAN_RUN_ID did not reach completed state before deletion."
            exit 1
          fi

          delete_code="$(
            curl "${common[@]}" \
              --request DELETE \
              --output "$mutation_response" \
              --write-out '%{http_code}' \
              "$api"
          )"
          if [[ "$delete_code" != "204" ]]; then
            cat "$mutation_response" >&2 || true
            echo "::error::Unexpected deletion status for orphan run $ORPHAN_RUN_ID: $delete_code"
            exit 1
          fi

          code="$(get_run)"
          if [[ "$code" != "404" ]]; then
            cat "$response" >&2 || true
            echo "::error::Deleted orphan run $ORPHAN_RUN_ID is still visible: $code"
            exit 1
          fi
          echo "Deleted orphaned temporary workflow run $ORPHAN_RUN_ID after exact identity verification."

      - name: Verify anonymous public bytes, identity, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 .github/scripts/audit-termux-public-channel.py
