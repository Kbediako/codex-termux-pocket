name: termux-release-channel
run-name: Verify promoted Termux release channel

# This read-only verifier executes the same machine-readable public-release
# contract used immediately before manifest promotion. It cannot publish or edit
# a release, so publication and independent verification share semantics without
# sharing write authority.
# A maintainer push that changes this verifier or the promoted manifest
# deliberately re-audits the live public channel at that exact main revision.
on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/audit-termux-public-channel.py"
      - ".github/scripts/termux_release_control.py"
      - ".github/workflows/termux-release-channel.yml"
      - "scripts/termux/release-manifest.env"
  workflow_dispatch:

# Temporary exact-run cleanup authority. This permission and guarded step are
# removed immediately after orphan run 32212182486 is proven absent.
permissions:
  actions: write
  contents: read
  attestations: read

concurrency:
  group: termux-release-channel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-latest-release:
    name: Verify promoted release is complete and Latest
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout promoted manifest and verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Delete exact orphaned temporary workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          ORPHAN_RUN_ID: "32212182486"
          ORPHAN_RUN_PATH: ".github/workflows/termux-governance-audit.yml"
          ORPHAN_HEAD_SHA: "4cbbb06b331affb71fd6bf41bff3ea365d489b8a"
          ORPHAN_EVENT: "workflow_dispatch"
          ORPHAN_WORKFLOW_ID: "335426411"
          ORPHAN_CREATED_AT: "2026-08-19T03:27:02Z"
          ORPHAN_ACTOR: "github-actions[bot]"
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$ORPHAN_RUN_ID"
          response="$RUNNER_TEMP/orphan-run.json"
          mutation_response="$RUNNER_TEMP/orphan-run-mutation.json"
          common=(
            --silent
            --show-error
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2026-03-10"
          )

          get_run() {
            curl "${common[@]}" \
              --output "$response" \
              --write-out '%{http_code}' \
              "$api"
          }

          code="$(get_run)"
          if [[ "$code" == "404" ]]; then
            echo "Orphaned temporary workflow run $ORPHAN_RUN_ID is already absent."
            exit 0
          fi
          if [[ "$code" != "200" ]]; then
            cat "$response" >&2 || true
            echo "::error::Unexpected lookup status for orphan run $ORPHAN_RUN_ID: $code"
            exit 1
          fi

          actual_id="$(jq -r '.id' "$response")"
          actual_path="$(jq -r '.path' "$response")"
          actual_head="$(jq -r '.head_sha' "$response")"
          actual_event="$(jq -r '.event' "$response")"
          actual_workflow_id="$(jq -r '.workflow_id' "$response")"
          actual_created_at="$(jq -r '.created_at' "$response")"
          actual_actor="$(jq -r '.actor.login' "$response")"
          if [[ "$actual_id" != "$ORPHAN_RUN_ID" || \
                "$actual_path" != "$ORPHAN_RUN_PATH" || \
                "$actual_head" != "$ORPHAN_HEAD_SHA" || \
                "$actual_event" != "$ORPHAN_EVENT" || \
                "$actual_workflow_id" != "$ORPHAN_WORKFLOW_ID" || \
                "$actual_created_at" != "$ORPHAN_CREATED_AT" || \
                "$actual_actor" != "$ORPHAN_ACTOR" ]]; then
            cat "$response" >&2
            echo "::error::Refusing to delete a workflow run whose identity differs from the audited orphan."
            exit 1
          fi

          delete_code="$(
            curl "${common[@]}" \
              --request DELETE \
              --output "$mutation_response" \
              --write-out '%{http_code}' \
              "$api"
          )"
          if [[ "$delete_code" != "204" ]]; then
            cat "$mutation_response" >&2 || true
            echo "::error::Unexpected deletion status for orphan run $ORPHAN_RUN_ID: $delete_code"
            exit 1
          fi

          code="$(get_run)"
          if [[ "$code" != "404" ]]; then
            cat "$response" >&2 || true
            echo "::error::Deleted orphan run $ORPHAN_RUN_ID is still visible: $code"
            exit 1
          fi
          echo "Deleted orphaned temporary workflow run $ORPHAN_RUN_ID after exact identity verification."

      - name: Verify anonymous public bytes, identity, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 .github/scripts/audit-termux-public-channel.py
