name: termux-apply-optimizations

on:
  push:
    branches:
      - agent/termux-hardening-alpha-20
    paths:
      - ".github/workflows/termux-apply-optimizations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termux-apply-optimizations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PREFIX: /data/data/com.termux/files/usr
      TERMUX_APK_RELEASE: F_DROID
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Simulate the Termux bash path
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$PREFIX/bin"
          sudo ln -sfn /usr/bin/bash "$PREFIX/bin/bash"

      - name: Apply exact optimisation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          updater = Path("scripts/termux/codex-update-alpha")
          lines = updater.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [
              index
              for index, line in enumerate(lines)
              if 'termux_validate_key_value_file "$MANIFEST_FILE"' in line
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one release-manifest validation line, found {len(matches)}")
          index = matches[0]
          if not lines[index].endswith("\n"):
              raise SystemExit("release-manifest validation line has no newline")
          lines[index] = lines[index][:-1] + " \\n"
          updater.write_text("".join(lines), encoding="utf-8")

          patcher = Path("scripts/termux/apply-optimization-patch.py")
          patch_lines = patcher.read_text(encoding="utf-8").splitlines(keepends=True)
          continuation_lines = [
              index
              for index, line in enumerate(patch_lines)
              if "'''            dist/SHA256SUMS" in line
          ]
          if len(continuation_lines) != 2:
              raise SystemExit(
                  f"expected two release-asset template literals, found {len(continuation_lines)}"
              )
          for index in continuation_lines:
              if "r'''" in patch_lines[index]:
                  raise SystemExit("release-asset template was already converted to a raw literal")
              patch_lines[index] = patch_lines[index].replace("'''", "r'''", 1)
          patcher.write_text("".join(patch_lines), encoding="utf-8")
          PY
          python3 -m py_compile \
            scripts/termux/apply-optimization-patch.py \
            scripts/termux/generate-sbom.py
          python3 scripts/termux/apply-optimization-patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/termux/termux-mobile-lib.sh")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"rollback-history patch expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''termux_current_release_sha() {
  local prefix="${1:-$PREFIX}"
  local runtime_root target
  runtime_root="$(termux_runtime_root "$prefix")"
  target="$(readlink "$runtime_root/current" 2>/dev/null || true)"
  if [[ "$target" =~ ^releases/([0-9a-f]{40})$ ]]; then
    printf '%s\\n' "${BASH_REMATCH[1]}"
    return 0
  fi
  return 1
}

''',
              '''termux_current_release_sha() {
  local prefix="${1:-$PREFIX}"
  local runtime_root target
  runtime_root="$(termux_runtime_root "$prefix")"
  target="$(readlink "$runtime_root/current" 2>/dev/null || true)"
  if [[ "$target" =~ ^releases/([0-9a-f]{40})$ ]]; then
    printf '%s\\n' "${BASH_REMATCH[1]}"
    return 0
  fi
  return 1
}

termux_previous_release_sha() {
  local prefix="${1:-$PREFIX}"
  local runtime_root target
  runtime_root="$(termux_runtime_root "$prefix")"
  target="$(readlink "$runtime_root/previous" 2>/dev/null || true)"
  if [[ "$target" =~ ^releases/([0-9a-f]{40})$ ]]; then
    printf '%s\\n' "${BASH_REMATCH[1]}"
    return 0
  fi
  return 1
}

''',
          )

          replace_once(
              '''  local runtime_root release link_tmp version
''',
              '''  local runtime_root release link_tmp previous_tmp version old_current
''',
          )
          replace_once(
              '''  version="$(termux_metadata_value "$release/$CODEX_TERMUX_METADATA" codex_version)"
  mkdir -p "$runtime_root"
  link_tmp="$runtime_root/.current-$$"
''',
              '''  version="$(termux_metadata_value "$release/$CODEX_TERMUX_METADATA" codex_version)"
  old_current="$(termux_current_release_sha "$prefix" || true)"
  mkdir -p "$runtime_root"
  if [[ -n "$old_current" && "$old_current" != "$sha" ]] \
    && termux_installed_release_is_valid \
      "$runtime_root/releases/$old_current" "$old_current"; then
    previous_tmp="$runtime_root/.previous-$$"
    rm -f "$previous_tmp"
    ln -s "releases/$old_current" "$previous_tmp"
    mv -Tf "$previous_tmp" "$runtime_root/previous"
  fi
  link_tmp="$runtime_root/.current-$$"
''',
          )

          replace_once(
              '''  local runtime_root releases current record sha dir remaining=0
''',
              '''  local runtime_root releases current previous record sha dir remaining=0
''',
          )
          replace_once(
              '''  current="$(termux_current_release_sha "$prefix" || true)"
  if [[ -n "$current" ]]; then
    protected["$current"]=1
    remaining=$(( 10#$keep_count - 1 ))
  else
    remaining=$(( 10#$keep_count ))
  fi
  mapfile -t records < <(termux_release_records "$prefix")
  for record in "${records[@]}"; do
    sha="${record#*|}"
    [[ "$sha" == "$current" ]] && continue
''',
              '''  current="$(termux_current_release_sha "$prefix" || true)"
  previous="$(termux_previous_release_sha "$prefix" || true)"
  remaining=$(( 10#$keep_count ))
  if [[ -n "$current" ]]; then
    protected["$current"]=1
    remaining=$(( remaining - 1 ))
  fi
  if (( remaining > 0 )) && [[ -n "$previous" && "$previous" != "$current" ]] \
    && termux_installed_release_is_valid \
      "$releases/$previous" "$previous" >/dev/null 2>&1; then
    protected["$previous"]=1
    remaining=$(( remaining - 1 ))
  fi
  mapfile -t records < <(termux_release_records "$prefix")
  for record in "${records[@]}"; do
    sha="${record#*|}"
    [[ "$sha" == "$current" || "$sha" == "$previous" ]] && continue
''',
          )
          replace_once(
              '''  for dir in "$releases"/*.invalid.*; do
''',
              '''  if [[ -n "$previous" && -z "${protected[$previous]:-}" ]]; then
    rm -f "$runtime_root/previous"
  fi

  for dir in "$releases"/*.invalid.*; do
''',
          )

          replace_once(
              '''  local current record sha
  current="$(termux_current_release_sha "$prefix" || true)"
''',
              '''  local current previous record sha
  current="$(termux_current_release_sha "$prefix" || true)"
''',
          )
          replace_once(
              '''  [[ -n "$current" ]] || {
    termux_die 'cannot roll back because no active Termux release was found.'
    return 1
  }
  while IFS= read -r record; do
''',
              '''  [[ -n "$current" ]] || {
    termux_die 'cannot roll back because no active Termux release was found.'
    return 1
  }
  previous="$(termux_previous_release_sha "$prefix" || true)"
  if [[ -n "$previous" && "$previous" != "$current" ]] \
    && termux_installed_release_is_valid \
      "$(termux_runtime_root "$prefix")/releases/$previous" "$previous"; then
    termux_activate_installed_release "$prefix" "$previous"
    return 0
  fi
  while IFS= read -r record; do
''',
          )

          path.write_text(text, encoding="utf-8")
          PY
          subject='termux: align alpha.20 and harden mobile releases'
          if ! awk -F '\t' -v subject="$subject" \
              '$1 == "subject" && $2 == subject { found=1 } END { exit !found }' \
              scripts/termux/patch_audit.tsv; then
            printf 'subject\t%s\tsecurity-critical\tAligns the Android runtime with alpha.20 and hardens verified archives, pinned build inputs, installed-tree repair, storage checks, rollback, retention, SBOM, and provenance.\n' \
              "$subject" >> scripts/termux/patch_audit.tsv
          fi

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck

      - name: Validate optimised control plane
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/termux/codex-cargo-check
            scripts/termux/codex-update-alpha
            scripts/termux/install-codex-termux
            scripts/termux/maintainer-update-alpha
            scripts/termux/smoke-test-artifact
            scripts/termux/termux-mobile-lib.sh
            scripts/termux/tests/run-tests
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --external-sources --severity=error "${scripts[@]}"
          bash scripts/termux/tests/run-tests
          python3 -m py_compile scripts/termux/generate-sbom.py
          python3 scripts/termux/generate-sbom.py \
            --workspace "$GITHUB_WORKSPACE/codex-rs" \
            --output "$RUNNER_TEMP/codex-termux-test.spdx.json" \
            --artifact-version 'codex-cli test' \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["spdxVersion"] == "SPDX-2.3"' \
            "$RUNNER_TEMP/codex-termux-test.spdx.json"
          (cd codex-rs && cargo metadata --locked --format-version=1 >/dev/null)
          ruby -e 'require "yaml"; Dir[".github/workflows/termux-*.yml"].sort.each { |path| YAML.load_file(path, aliases: true) }'
          git diff --check

      - name: Publish validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp .github/workflows/termux-mobile-artifact.yml \
            scripts/termux/generated-termux-mobile-artifact.yml
          cp .github/workflows/termux-control-plane.yml \
            scripts/termux/generated-termux-control-plane.yml
          git add \
            scripts/termux/codex-update-alpha \
            scripts/termux/generated-termux-control-plane.yml \
            scripts/termux/generated-termux-mobile-artifact.yml \
            scripts/termux/install-codex-termux \
            scripts/termux/patch_audit.tsv \
            scripts/termux/termux-mobile-lib.sh \
            scripts/termux/tests/run-tests
          git diff --cached --quiet && { echo 'No optimisation changes were produced.' >&2; exit 1; }
          git commit -m 'termux: add deterministic releases and rollback controls'
          git push origin HEAD:agent/termux-hardening-alpha-20
