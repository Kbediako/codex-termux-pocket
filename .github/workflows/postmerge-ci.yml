name: postmerge-ci

# This fork uses GitHub-hosted runners. Keep the postmerge entrypoint useful
# without invoking upstream-only runner groups or large internal CI matrices.
on:
  push:
    branches:
      - main

concurrency:
  group: postmerge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-sanity:
    name: Fork repository sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate Bash entrypoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate repository Python helpers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo workspace metadata
        working-directory: codex-rs
        shell: bash
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null
