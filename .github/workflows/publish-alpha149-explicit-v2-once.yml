name: publish-alpha149-explicit-v2-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/publish-alpha149-explicit-v2.trigger"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-alpha149-explicit-v2-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_VERSION: 0.149.0-alpha.1
      SELF_PATH: .github/workflows/publish-alpha149-explicit-v2-once.yml
      TRIGGER_PATH: .github/publish-alpha149-explicit-v2.trigger
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Cancel superseded orchestration runs
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100")"
          mapfile -t stale < <(
            jq -r --arg current "$GITHUB_RUN_ID" '
              .workflow_runs[]
              | select((.status == "queued") or (.status == "in_progress") or (.status == "waiting") or (.status == "pending") or (.status == "requested"))
              | select((.id | tostring) != $current)
              | select(
                  .name == "finalize-alpha149-release-once" or
                  .name == "dispatch-finalize-alpha149-once" or
                  .name == "publish-alpha149-explicit-once" or
                  .name == "finish-repository-cleanup-and-alpha-release-once" or
                  .name == "trigger-finish-repository-cleanup-once"
                )
              | .id
            ' <<<"$runs"
          )
          for run_id in "${stale[@]}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
          done

      - name: Harden exact-source release workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/termux-release-request.yml')
          text = path.read_text(encoding='utf-8')
          old_guard = '''          main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced to ${main_sha}; refusing to publish stale workflow head ${GITHUB_SHA}"
            exit 1
          }
'''
          new_guard = '''          main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            compare_json="$(
              gh api "/repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${main_sha}"
            )"
            compare_status="$(jq -r .status <<<"$compare_json")"
            merge_base="$(jq -r .merge_base_commit.sha <<<"$compare_json")"
            [[ "$compare_status" == "ahead" && "$merge_base" == "$GITHUB_SHA" ]] || {
              echo "::error::main ${main_sha} is not a descendant of validated source ${GITHUB_SHA}"
              exit 1
            }
            current_request="$(mktemp)"
            gh api "/repos/${GITHUB_REPOSITORY}/contents/scripts/termux/release-request.env?ref=main" \
              --jq .content | tr -d '\\n' | base64 --decode >"$current_request"
            cmp --silent scripts/termux/release-request.env "$current_request" || {
              echo "::error::release request changed after validation; refusing stale publication"
              exit 1
            }
          fi
'''
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif 'main ${main_sha} is not a descendant of validated source ${GITHUB_SHA}' not in text:
              raise SystemExit('unknown release publication guard')
          text = text.replace('--latest=false', '--latest')
          if '--latest' not in text:
              raise SystemExit('release creation is not configured to set Latest')
          text = text.replace(
              '/actions/workflows/${workflow}/runs?event=push&branch=main&per_page=100',
              '/actions/workflows/${workflow}/runs?branch=main&per_page=100',
          )
          path.write_text(text, encoding='utf-8')

          channel = '''name: termux-release-channel

on:
  workflow_run:
    workflows:
      - termux-release-request
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: termux-release-channel
  cancel-in-progress: false

jobs:
  verify-latest:
    if: __WORKFLOW_IF__
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: __GITHUB_TOKEN__
    steps:
      - name: Checkout promoted main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable Latest release identity
        shell: bash
        run: |
          set -euo pipefail
          manifest=scripts/termux/release-manifest.env
          tag="$(sed -n 's/^release_tag=//p' "$manifest")"
          source_sha="$(sed -n 's/^head_sha=//p' "$manifest")"
          test -n "$tag"
          test -n "$source_sha"
          latest="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest")"
          test "$(jq -r .tag_name <<<"$latest")" = "$tag"
          test "$(jq -r .draft <<<"$latest")" = false
          tag_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"
          test "$tag_sha" = "$source_sha"

      - name: Dispatch independent governance audit
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run termux-governance-audit.yml --repo "$GITHUB_REPOSITORY" --ref main
'''
          dollar = chr(36)
          channel = channel.replace(
              '__WORKFLOW_IF__',
              dollar + "{{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}",
          ).replace('__GITHUB_TOKEN__', dollar + '{{ github.token }}')
          Path('.github/workflows/termux-release-channel.yml').write_text(channel, encoding='utf-8')
          PY

      - name: Disable routine fork-local Dependabot version PRs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/dependabot.yaml')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          in_update = False
          inserted = False
          for line in lines:
              if line.startswith('  - package-ecosystem:'):
                  if in_update and not inserted:
                      out.append('    open-pull-requests-limit: 0')
                  in_update = True
                  inserted = False
              if in_update and line.strip().startswith('open-pull-requests-limit:'):
                  line = '    open-pull-requests-limit: 0'
                  inserted = True
              out.append(line)
          if in_update and not inserted:
              out.append('    open-pull-requests-limit: 0')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Refresh release controls and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]$/{f=1;next} /^\[/{if(f)exit} f&&/^version[[:space:]]*=/{gsub(/^[^\"]*\"|\".*$/,"");print;exit}' codex-rs/Cargo.toml)"
          test "$version" = "$EXPECTED_VERSION"
          cat > scripts/termux/release-request.env <<EOF
          # Exact-source release request for the protected alpha merge.
          # publication_retry=explicit-dispatch-v4
          format_version=3
          source_mode=workflow-head
          release_tag_prefix=termux-v2026.08.19-alpha.1
          expected_package_version=${EXPECTED_VERSION}
          EOF
          sed -i 's/^          //' scripts/termux/release-request.env

          audit=scripts/termux/patch_audit.tsv
          add_audit() {
            local subject="$1" classification="$2" reason="$3"
            grep -Fqx $'subject\t'"${subject}"$'\t'"${classification}"$'\t'"${reason}" "$audit" ||
              printf 'subject\t%s\t%s\t%s\n' "$subject" "$classification" "$reason" >>"$audit"
          }
          add_audit 'ci: stage final alpha publication repair' tooling 'One-time protected-branch workflow used to repair the immutable Latest release channel and remove stale automation.'
          add_audit 'ci: stage repository cleanup and alpha release' tooling 'Temporary protected-branch orchestration used during repository cleanup and release recovery.'
          add_audit 'chore: remove temporary alpha orchestration' tooling 'Removes temporary alpha orchestration after the maintained source update.'
          add_audit 'chore: clean temporary alpha orchestration' tooling 'Removes temporary observer and release orchestration files.'
          add_audit 'chore: remove post-alpha governance workflow' tooling 'Removes a one-time governance verification workflow after use.'
          add_audit 'ci: independently recheck promoted alpha governance' tooling 'One-time independent release-governance verification workflow.'
          add_audit 'ci: harden one-time latest-alpha orchestration' tooling 'Hardens temporary release orchestration without changing the shipped runtime.'
          add_audit 'chore: close release follow-up and sync latest alpha' tooling 'Issue and release-control maintenance only.'
          add_audit 'termux: request validated 0.149.0-alpha.1 release' tooling 'Refreshes exact-source release controls for the maintained alpha runtime.'
          add_audit 'termux: publish 0.149.0-alpha.1 and harden release channel' security-critical 'Publishes only an exact validated source, creates immutable releases as Latest, accepts exact workflow-dispatch Android evidence, and rejects stale non-descendant publication.'

          rm -f \
            .github/workflows/finalize-alpha149-release-once.yml \
            .github/workflows/dispatch-finalize-alpha149-once.yml \
            .github/finalize-alpha149.trigger \
            .github/workflows/publish-alpha149-explicit-once.yml \
            .github/publish-alpha149-explicit.trigger \
            .github/workflows/finish-repository-cleanup-and-alpha-release-once.yml \
            .github/workflows/trigger-finish-repository-cleanup-once.yml \
            .github/workflows/observe-alpha-149-ci.yml \
            .github/workflows/observe-alpha-149-status.yml \
            .github/workflows/cancel-stale-alpha-release-runs.yml \
            "$SELF_PATH" "$TRIGGER_PATH"

      - name: Commit final exact source to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m 'termux: publish 0.149.0-alpha.1 and harden release channel'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "source_sha=${source_sha}" >>"$GITHUB_OUTPUT"

      - name: Dispatch exact Android and release workflows
        id: dispatch
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run termux-android-emulator.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run termux-release-request.yml --repo "$GITHUB_REPOSITORY" --ref main
          find_run() {
            local workflow="$1"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=100" --jq ".workflow_runs | map(select(.head_sha == \"${SOURCE_SHA}\")) | first | .id // empty"
          }
          android_id=""; release_id=""
          for _ in $(seq 1 60); do
            [[ -n "$android_id" ]] || android_id="$(find_run termux-android-emulator.yml)"
            [[ -n "$release_id" ]] || release_id="$(find_run termux-release-request.yml)"
            [[ -n "$android_id" && -n "$release_id" ]] && break
            sleep 5
          done
          [[ "$android_id" =~ ^[0-9]+$ ]]
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "android_id=${android_id}" >>"$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >>"$GITHUB_OUTPUT"

      - name: Wait for successful immutable publication
        env:
          RELEASE_ID: ${{ steps.dispatch.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=""; conclusion=""
          for _ in $(seq 1 1200); do
            run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_ID}")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          test "$status" = completed
          test "$conclusion" = success

      - name: Reconcile repository and verify public channel
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ANDROID_ID: ${{ steps.dispatch.outputs.android_id }}
          RELEASE_ID: ${{ steps.dispatch.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.user.login == "dependabot[bot]") | [.number, .head.ref] | @tsv')
          for row in "${prs[@]}"; do
            IFS=$'\t' read -r number branch <<<"$row"
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body 'Closing this stale fork-local version-update PR. Verified upstream alpha integration is authoritative for this maintained Termux fork, and routine Dependabot version PRs are disabled.'
            gh pr close "$number" --repo "$GITHUB_REPOSITORY"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done
          mapfile -t stale_branches < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep -E '^(observer/|dependabot/)' || true)
          for branch in "${stale_branches[@]}"; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null; done

          git fetch origin main
          git checkout --detach origin/main
          manifest=scripts/termux/release-manifest.env
          tag="$(sed -n 's/^release_tag=//p' "$manifest")"
          manifest_sha="$(sed -n 's/^head_sha=//p' "$manifest")"
          binary="$(sed -n 's/^codex_version=//p' "$manifest")"
          test "$manifest_sha" = "$SOURCE_SHA"
          test "$binary" = "codex-cli ${SOURCE_SHA:0:7}"
          latest="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest")"
          test "$(jq -r .tag_name <<<"$latest")" = "$tag"
          test "$(jq -r .draft <<<"$latest")" = false
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '[.[] | select(.user.login == "dependabot[bot]")] | length')" = 0
          mapfile -t branches < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main

          gh workflow run termux-governance-audit.yml --repo "$GITHUB_REPOSITORY" --ref main
          audit_id=""; status=""; conclusion=""
          for _ in $(seq 1 120); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/termux-governance-audit.yml/runs?event=workflow_dispatch&branch=main&per_page=20" --jq '[.workflow_runs[]] | first // {} | [(.id // ""), (.status // ""), (.conclusion // "")] | @tsv')"
            IFS=$'\t' read -r candidate status conclusion <<<"$state"
            if [[ -n "$candidate" ]]; then audit_id="$candidate"; [[ "$status" == completed ]] && break; fi
            sleep 10
          done
          test -n "$audit_id"
          test "$status" = completed
          test "$conclusion" = success

          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body "Publication repair complete. GitHub Latest and the promoted manifest now point to \`${tag}\` at exact source \`${SOURCE_SHA}\` (\`${binary}\`). The explicitly dispatched official Termux Android gate, ARM64 artifact build, checksums, SBOM, attestations, anonymous-download verification, release-channel verification, and independent governance audit passed. Zero open Dependabot PRs remain and \`main\` is the only branch."
          {
            echo '### Publication repair complete'
            echo "- Latest release: ${tag}"
            echo "- Exact source: ${SOURCE_SHA}"
            echo "- Binary: ${binary}"
            echo "- Android run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${ANDROID_ID}"
            echo "- Release run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_ID}"
            echo "- Governance run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${audit_id}"
          } >>"$GITHUB_STEP_SUMMARY"
