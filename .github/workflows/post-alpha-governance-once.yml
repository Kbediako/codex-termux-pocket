name: post-alpha-governance-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-alpha-governance-once.yml"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: post-alpha-governance-once
  cancel-in-progress: true

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELF: .github/workflows/post-alpha-governance-once.yml
    steps:
      - name: Checkout promoted main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Latest agrees with the maintained manifest
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(sed -n 's/^release_tag=//p' scripts/termux/release-manifest.env)"
          release_sha="$(sed -n 's/^head_sha=//p' scripts/termux/release-manifest.env)"
          codex_version="$(sed -n 's/^codex_version=//p' scripts/termux/release-manifest.env)"
          [[ "$release_tag" =~ ^termux-v[0-9A-Za-z._-]+$ ]]
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          latest_tag="$(gh api "/repos/${REPO}/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" == "$release_tag" ]]
          target="$(gh api "/repos/${REPO}/git/ref/tags/${release_tag}" --jq .object.sha)"
          [[ "$target" == "$release_sha" ]]
          {
            echo "release_tag=${release_tag}"
            echo "release_sha=${release_sha}"
            echo "codex_version=${codex_version}"
          } >>"$GITHUB_OUTPUT"

      - name: Dispatch a fresh governance audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          before="$(
            gh api "/repos/${REPO}/actions/workflows/termux-governance-audit.yml/runs?branch=main&per_page=1" \
              --jq '.workflow_runs[0].id // ""'
          )"
          gh workflow run termux-governance-audit.yml --repo "$REPO" --ref main >/dev/null
          run_id=""
          for _ in $(seq 1 90); do
            run_id="$(
              gh api "/repos/${REPO}/actions/workflows/termux-governance-audit.yml/runs?branch=main&per_page=10" \
                --jq ".workflow_runs | map(select(.id != ${before:-0})) | sort_by(.created_at) | last | .id // \"\""
            )"
            [[ -n "$run_id" ]] && break
            sleep 4
          done
          [[ -n "$run_id" ]]

          for attempt in 1 2 3; do
            for _ in $(seq 1 120); do
              IFS=$'\t' read -r status conclusion < <(
                gh api "/repos/${REPO}/actions/runs/${run_id}" \
                  --jq '[.status, (.conclusion // "")] | @tsv'
              )
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] && {
                  echo "run_id=${run_id}" >>"$GITHUB_OUTPUT"
                  exit 0
                }
                break
              fi
              sleep 5
            done
            if (( attempt < 3 )); then
              gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null
              sleep 10
            fi
          done
          echo "::error::Fresh governance audit failed: https://github.com/${REPO}/actions/runs/${run_id}"
          exit 1

      - name: Record final closure evidence
        env:
          RELEASE_TAG: ${{ steps.channel.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.channel.outputs.release_sha }}
          CODEX_VERSION: ${{ steps.channel.outputs.codex_version }}
          AUDIT_RUN: ${{ steps.audit.outputs.run_id }}
        shell: bash
        run: |
          gh issue comment 44 --repo "$REPO" --body-file - <<EOF_COMMENT
          Final independent post-update verification passed:

          - Promoted release: `${RELEASE_TAG}`
          - Runtime source: `${RELEASE_SHA}`
          - Runtime identity: `${CODEX_VERSION}`
          - Fresh governance audit: https://github.com/${REPO}/actions/runs/${AUDIT_RUN}

          The maintained updater manifest, protected release tag, and GitHub Latest channel agree.
          EOF_COMMENT

      - name: Remove the one-time workflow
        if: always() && steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$SELF"
          git add -A
          git commit -m "chore: remove post-alpha governance workflow"
          git push origin HEAD:main
