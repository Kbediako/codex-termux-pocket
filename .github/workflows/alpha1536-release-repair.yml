name: alpha1536-release-repair
run-name: Repair and publish Codex Termux 0.153.0-alpha.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpha1536-release-repair.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: alpha1536-release-repair
  cancel-in-progress: false

jobs:
  repair-release:
    name: Repair, validate, publish, audit, and clean alpha.6
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Execute fail-closed release repair transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/alpha1536-release-repair.py
