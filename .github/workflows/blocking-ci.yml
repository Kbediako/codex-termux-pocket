name: fork-ci

# One bounded observer bridges to the immediately following permanent cleanup
# commit. The next commit restores the normal one-job workflow definition.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-ci-bridge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe-final-cleanup:
    if: "${{ github.event.head_commit.message == 'ci: make fork workflows lightweight' }}"
    name: Verify final permanent fork CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: "63"
    steps:
      - name: Wait for the next main commit and its fork CI result
        shell: bash
        run: |
          set -euo pipefail
          bridge_sha="$GITHUB_SHA"
          target_sha=""
          for _ in $(seq 1 120); do
            candidate="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "$candidate" != "$bridge_sha" ]]; then
              target_sha="$candidate"
              break
            fi
            sleep 2
          done
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]

          run='{}'
          for _ in $(seq 1 240); do
            runs="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow blocking-ci.yml \
                --event push --commit "$target_sha" --limit 20 \
                --json databaseId,workflowName,headSha,event,status,conclusion,url,createdAt
            )"
            run="$(
              jq -c --arg sha "$target_sha" \
                '[.[] | select(.workflowName == "fork-ci" and .headSha == $sha and .event == "push")]
                 | sort_by(.createdAt) | last // {}' <<<"$runs"
            )"
            status="$(jq -r '.status // "missing"' <<<"$run")"
            [[ "$status" == "completed" ]] && break
            sleep 3
          done

          run_id="$(jq -r '.databaseId // "missing"' <<<"$run")"
          status="$(jq -r '.status // "missing"' <<<"$run")"
          conclusion="$(jq -r '.conclusion // "missing"' <<<"$run")"
          url="$(jq -r '.url // "missing"' <<<"$run")"
          body="$(cat <<EOF
          state=final-cleanup-verified
          final_main_sha=${target_sha}
          fork_ci_run_id=${run_id}
          fork_ci_status=${status}
          fork_ci_conclusion=${conclusion}
          fork_ci_url=${url}
          policy_commit=8724d43a8158be2bf4868d249ee4b2dc04583bee
          policy_control_run_id=32533454291
          policy_release_channel_run_id=32533454206
          policy_governance_run_id=32533454325
          bridge_run_id=${GITHUB_RUN_ID}
          bridge_run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$body" >/dev/null

          [[ "$status" == "completed" ]]
          [[ "$conclusion" == "success" ]]
