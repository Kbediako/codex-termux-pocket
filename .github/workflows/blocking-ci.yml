name: fork-ci
run-name: Fork CI · ${{ github.event_name }} · ${{ github.ref_name }}

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# alpha1534-final-governance: temporary, self-obsoleting release finalizer.
# The staging run is isolated by SHA so the connector-authored cleanup commit
# cannot cancel it before it dispatches the permanent post-promotion checks.
concurrency:
  group: fork-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      ${{ github.event.head_commit.message != 'ci: stage protected alpha update'
          && github.event.head_commit.message != 'termux: audit final hardening and alpha update commits' }}
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' '.github/scripts/**/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Self-test the executable release contract
        run: python3 .github/scripts/termux_release_control.py self-test

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  alpha1534-finalize:
    if: >-
      ${{ github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.event.head_commit.message == 'ci: stage protected alpha update' }}
    name: Classify retained commits and run final post-promotion checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 223220fd66f600b8bf3291ed84960b7d76b7774a
      RELEASE_TAG: termux-v0.153.0-alpha.4-223220fd66
      MARKER: alpha1534-final-governance
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Classify every retained fork maintenance subject
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kbediako"
          git config user.email "70529246+Kbediako@users.noreply.github.com"
          audit="scripts/termux/patch_audit.tsv"

          append_subject() {
            local subject="$1"
            local classification="$2"
            local reason="$3"
            if awk -F '\t' -v subject="$subject" '
              $1 == "subject" && $2 == subject { found = 1 }
              END { exit(found ? 0 : 1) }
            ' "$audit"; then
              return 0
            fi
            printf 'subject\t%s\t%s\t%s\n' "$subject" "$classification" "$reason" >>"$audit"
          }

          while IFS='|' read -r subject classification reason; do
            [[ -n "$subject" ]] || continue
            append_subject "$subject" "$classification" "$reason"
          done <<'ENTRIES'
          chore: select clean 0.153.0-alpha.2 source|tooling|Selects the clean exact alpha.2 runtime source after disposable integration controls were removed.
          release: publish validated 0.153.0-alpha.2 runtime|tooling|Records the exact successful gate set used by the permanent release publisher.
          fix: identify bundled bwrap package in Termux SBOM|security-critical|Repairs release provenance so the shipped bubblewrap binary is related to its Cargo package in SPDX output.
          fix: validate the bundled codex-bwrap SBOM package|security-critical|Makes the release contract fail closed when the shipped bubblewrap package identity is absent or mismatched.
          release: harden exact-source Termux gate contract|security-critical|Strengthens exact-source artifact, SBOM, publication, anonymous audit, and promotion invariants.
          release: request validated Termux 0.153.0-alpha.2 publication|tooling|Records the five successful exact-source alpha.2 release gates.
          fix(release): import publisher workflow identity for audit receipt|security-critical|Repairs the anonymous audit receipt signer identity without weakening release verification.
          release: retry exact public audit and manifest promotion|tooling|Retries the immutable public alpha.2 release audit and promotion after the verified audit-code repair.
          termux: promote termux-v0.153.0-alpha.2-5a76b55d9a|tooling|Promotes the anonymously verified alpha.2 updater manifest.
          docs(ci): clarify exact-head release-channel re-audit|docs|Documents that post-promotion release-channel verification must run against the exact final main head.
          ci: remove orphaned temporary governance run|tooling|Attempts cleanup of a historical temporary Actions run without changing shipped runtime behavior.
          ci: directly delete exact orphaned Actions run|tooling|Attempts exact historical Actions-run cleanup without changing shipped runtime behavior.
          ci: recreate exact concurrency key to retire orphaned run|tooling|Attempts isolated historical Actions-run reconciliation without changing shipped runtime behavior.
          ci: reconcile exact orphaned Actions check run|tooling|Attempts exact historical check-run reconciliation without changing shipped runtime behavior.
          ci: disable exact temporary workflow before orphan cleanup|tooling|Disables the obsolete temporary workflow identity before historical-run cleanup.
          ci: retry exact orphaned governance-run reconciliation|tooling|Retries isolated historical-run reconciliation without changing shipped runtime behavior.
          ci: add exact alpha.4 integration transaction|tooling|Adds the disposable exact-tag merge transaction used only for the alpha.4 maintenance update.
          ci: stage exact alpha.4 integration|tooling|Stages the disposable exact alpha.4 integration job and its reviewed conflict resolution.
          release: remove obsolete governance recovery workflow|tooling|Removes obsolete temporary governance recovery orchestration before source selection.
          release: remove completed alpha.4 integration helper|tooling|Removes the disposable alpha.4 merge helper before exact-source validation.
          release: restore permanent release-channel auditor|security-critical|Restores the permanent independent public-byte and attestation auditor before source selection.
          release: restore permanent Fork CI topology|tooling|Restores the permanent Fork CI inventory before selecting the alpha.4 runtime source.
          release: request validated Termux 0.153.0-alpha.4 publication|tooling|Records the five successful exact-source alpha.4 release gates.
          termux: promote termux-v0.153.0-alpha.4-223220fd66|tooling|Promotes the anonymously verified alpha.4 updater manifest.
          ENTRIES

          git diff --check
          if git diff --quiet -- "$audit"; then
            audit_commit="$(git rev-parse HEAD)"
          else
            git add "$audit"
            git commit -m "termux: audit final hardening and alpha update commits"
            audit_commit="$(git rev-parse HEAD)"
            git push origin HEAD:main
          fi
          printf 'audit_commit=%s\n' "$audit_commit" >>"$GITHUB_OUTPUT"

      - name: Wait for connector-authored workflow cleanup and validate final main
        id: final
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          audit_commit="${{ steps.classify.outputs.audit_commit }}"
          final_main=""

          for attempt in $(seq 1 180); do
            main_sha="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
            blocking_text="$(
              gh api "repos/$repo/contents/.github/workflows/blocking-ci.yml?ref=main" --jq '.content' |
                tr -d '\n' | base64 --decode
            )"
            if [[ "$main_sha" != "$audit_commit" ]] && ! grep -Fq "$MARKER" <<<"$blocking_text"; then
              final_main="$main_sha"
              break
            fi
            sleep 2
          done
          [[ -n "$final_main" ]]

          git fetch --force origin main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$final_main" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$final_main"

          worktree="$RUNNER_TEMP/final-main"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "$final_main"
          (
            cd "$worktree"
            python3 .github/scripts/validate-termux-workflow-topology.py
            python3 .github/scripts/termux_release_control.py self-test
            grep -Fqx "release_tag=$RELEASE_TAG" scripts/termux/release-manifest.env
            grep -Fqx "head_sha=$SOURCE_SHA" scripts/termux/release-manifest.env
          )
          git worktree remove --force "$worktree"
          printf 'final_main=%s\n' "$final_main" >>"$GITHUB_OUTPUT"

      - name: Dispatch all permanent post-promotion workflows
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          final_main="${{ steps.final.outputs.final_main }}"
          evidence="$RUNNER_TEMP/alpha1534-postchecks.env"
          : >"$evidence"
          printf 'format_version=1\nsource_sha=%s\nrelease_tag=%s\nfinal_main_sha=%s\n' \
            "$SOURCE_SHA" "$RELEASE_TAG" "$final_main" >>"$evidence"

          workflows=(
            termux-release-channel.yml
            termux-governance.yml
            termux-control-plane.yml
            blocking-ci.yml
          )
          keys=(
            release_channel_run_id
            governance_run_id
            post_control_run_id
            post_fork_ci_run_id
          )
          declare -a before_ids run_ids

          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            path=".github/workflows/$workflow"
            [[ "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" == "$final_main" ]]
            before_ids[$index]="$(
              gh api "repos/$repo/actions/runs?branch=main&event=workflow_dispatch&per_page=100" \
                --jq "[.workflow_runs[] | select(.path == \"$path\")] | map(.id) | max // 0"
            )"
            gh workflow run "$workflow" --repo "$repo" --ref main
          done

          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            path=".github/workflows/$workflow"
            before="${before_ids[$index]}"
            run_id=""
            for attempt in $(seq 1 60); do
              runs_json="$(gh api "repos/$repo/actions/runs?branch=main&event=workflow_dispatch&per_page=100")"
              run_id="$(
                jq -r --arg path "$path" --arg sha "$final_main" --argjson before "$before" '
                  [.workflow_runs[]
                    | select(.path == $path and .event == "workflow_dispatch" and .head_sha == $sha and .id > $before)]
                  | sort_by(.id)
                  | last
                  | .id // empty
                ' <<<"$runs_json"
              )"
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            [[ -n "$run_id" ]]
            run_ids[$index]="$run_id"
            printf '%s=%s\n' "${keys[$index]}" "$run_id" >>"$evidence"
            printf '%s=%s\n' "${keys[$index]}" "$run_id" >>"$GITHUB_OUTPUT"
          done

          printf 'evidence=%s\n' "$evidence" >>"$GITHUB_OUTPUT"

      - name: Wait for every permanent post-promotion check
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          final_main="${{ steps.final.outputs.final_main }}"
          run_ids=(
            "${{ steps.dispatch.outputs.release_channel_run_id }}"
            "${{ steps.dispatch.outputs.governance_run_id }}"
            "${{ steps.dispatch.outputs.post_control_run_id }}"
            "${{ steps.dispatch.outputs.post_fork_ci_run_id }}"
          )

          for attempt in $(seq 1 360); do
            all_complete=true
            for run_id in "${run_ids[@]}"; do
              run_json="$(gh api "repos/$repo/actions/runs/$run_id")"
              [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$final_main" ]]
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
              else
                all_complete=false
              fi
            done
            if [[ "$all_complete" == "true" ]]; then
              break
            fi
            sleep 10
          done

          for run_id in "${run_ids[@]}"; do
            run_json="$(gh api "repos/$repo/actions/runs/$run_id")"
            [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$final_main" ]]
            [[ "$(jq -r '.status' <<<"$run_json")" == "completed" ]]
            [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]]
          done
          [[ "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" == "$final_main" ]]
          cat "${{ steps.dispatch.outputs.evidence }}" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload final post-promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alpha1534-final-governance-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.evidence }}
          if-no-files-found: warn
          retention-days: 30
