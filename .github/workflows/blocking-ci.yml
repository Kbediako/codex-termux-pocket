name: fork-ci

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'issues' }}
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  update-latest-alpha:
    if: "${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.title == 'Maintenance: update Codex Termux to 0.150.0-alpha.6' }}"
    name: Merge, validate, publish, and verify 0.150.0-alpha.6
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      attestations: read
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      STAGING_BRANCH: alpha-0.150.0-alpha.6-staging
      UPSTREAM_TAG: rust-v0.150.0-alpha.6
      UPSTREAM_COMMIT: bcb6f90f7f886f70a4812a0c05b865b9f6595e90
      PACKAGE_VERSION: 0.150.0-alpha.6
    steps:
      - name: Checkout dedicated staging branch with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: alpha-0.150.0-alpha.6-staging
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Run exact-source alpha update and release transaction
        id: update
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/maintainer-sync-alpha-0.150.0-alpha.6.sh \
            2>&1 | tee "$RUNNER_TEMP/alpha-update.log"

      - name: Publish exact failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/alpha-update.log"
          if [[ -s "$log" ]]; then
            diagnostics="$(
              {
                grep -Ei '(^|[^a-z])(not ok|fail(ed|ure)?|error|expected|assert|mismatch|missing|refusing|unknown)([^a-z]|$)' "$log" || true
                tail -n 120 "$log"
              } | awk '!seen[$0]++' | tail -n 160 | tr -d '\r' | head -c 18000
            )"
          else
            diagnostics='No captured update log was available.'
          fi
          body="$(cat <<EOF
          state=failed
          detail=exact-regression-diagnostics
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          upstream_tag=${UPSTREAM_TAG}
          upstream_commit=${UPSTREAM_COMMIT}

          \`\`\`text
          ${diagnostics}
          \`\`\`
          EOF
          )"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$body" >/dev/null

      - name: Summarize completed update
        if: success()
        shell: bash
        run: |
          {
            echo '### Codex Termux alpha update'
            echo
            echo "- Package: \`0.150.0-alpha.6\`"
            echo "- Runtime source: \`${{ steps.update.outputs.source_sha }}\`"
            echo "- Release: \`${{ steps.update.outputs.release_tag }}\`"
            echo "- Publication run: \`${{ steps.update.outputs.release_run_id }}\`"
            echo "- Promoted main: \`${{ steps.update.outputs.promoted_main_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
