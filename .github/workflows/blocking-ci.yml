name: fork-ci

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'issues' }}
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-policy-alignment:
    if: "${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.title == 'Maintenance: verify mutable release workflow alignment' }}"
    name: Verify mutable-release workflow alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Dispatch, wait for, and record maintained workflow checks
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          initial_body="$(cat <<EOF_BODY
          state=running
          main_sha=${main_sha}
          observer_run_id=${GITHUB_RUN_ID}
          observer_run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF_BODY
          )"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$initial_body" >/dev/null

          dispatch_and_find() {
            local workflow="$1"
            shift
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main "$@"
            local run_id=""
            for _ in $(seq 1 90); do
              runs="$(
                gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                  --event workflow_dispatch --limit 100 \
                  --json databaseId,headSha,createdAt,status,conclusion,url,workflowName
              )"
              run_id="$(
                jq -r --arg sha "$main_sha" --arg started "$started_at" \
                  '[.[] | select(.headSha == $sha and .createdAt >= $started)]
                   | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs"
              )"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 2
            done
            echo "::error::workflow ${workflow} did not expose a matching run"
            return 1
          }

          fork_ci_run_id="$(dispatch_and_find blocking-ci.yml)"
          control_run_id="$(dispatch_and_find termux-control-plane.yml)"
          channel_run_id="$(dispatch_and_find termux-release-channel.yml)"
          governance_run_id="$(dispatch_and_find termux-governance-audit.yml)"

          wait_for_run() {
            local run_id="$1"
            for _ in $(seq 1 360); do
              document="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,workflowName,headSha,event)"
              status="$(jq -r .status <<<"$document")"
              if [[ "$status" == "completed" ]]; then
                printf '%s\n' "$document"
                return 0
              fi
              sleep 5
            done
            echo "::error::run ${run_id} did not complete before the observer timeout"
            return 1
          }

          fork_ci="$(wait_for_run "$fork_ci_run_id")"
          control="$(wait_for_run "$control_run_id")"
          channel="$(wait_for_run "$channel_run_id")"
          governance="$(wait_for_run "$governance_run_id")"

          report="$(mktemp)"
          {
            echo 'state=completed'
            echo "main_sha=${main_sha}"
            overall=success

            emit_result() {
              local label="$1"
              local run_id="$2"
              local document="$3"
              local status conclusion url
              status="$(jq -r .status <<<"$document")"
              conclusion="$(jq -r '.conclusion // "missing"' <<<"$document")"
              url="$(jq -r .url <<<"$document")"
              echo "${label}_run_id=${run_id}"
              echo "${label}_status=${status}"
              echo "${label}_conclusion=${conclusion}"
              echo "${label}_url=${url}"
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                overall=failure
              fi
            }

            emit_result fork_ci "$fork_ci_run_id" "$fork_ci"
            emit_result control_plane "$control_run_id" "$control"
            emit_result release_channel "$channel_run_id" "$channel"
            emit_result governance_audit "$governance_run_id" "$governance"

            echo "overall=${overall}"
            echo "observer_run_id=${GITHUB_RUN_ID}"
            echo "observer_run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >"$report"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$(cat "$report")" >/dev/null

          grep -Fx 'overall=success' "$report"
