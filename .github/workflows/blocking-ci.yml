name: fork-ci

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: "${{ github.event_name != 'issues' && github.event.head_commit.message != 'ci: execute alpha 0.150.0-alpha.6' }}"
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        if: "${{ github.event_name != 'workflow_dispatch' && github.event.head_commit.message != 'termux: update to 0.150.0-alpha.6' }}"
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  update-latest-alpha:
    if: "${{ (github.event_name == 'push' && github.event.head_commit.message == 'ci: execute alpha 0.150.0-alpha.6') || (github.event_name == 'issues' && github.event.action == 'reopened' && github.event.issue.number == 73) }}"
    name: Merge, validate, publish, and verify 0.150.0-alpha.6
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      actions: write
      attestations: read
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: "73"
      STAGING_BRANCH: alpha-0.150.0-alpha.6-staging
      UPSTREAM_TAG: rust-v0.150.0-alpha.6
      UPSTREAM_COMMIT: bcb6f90f7f886f70a4812a0c05b865b9f6595e90
      PACKAGE_VERSION: 0.150.0-alpha.6
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Run exact-source alpha update and release transaction
        id: update
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$STAGING_BRANCH"
          source_script=.github/scripts/maintainer-sync-alpha-0.150.0-alpha.6.sh
          runtime_script="$RUNNER_TEMP/maintainer-sync-alpha.sh"
          python3 - "$source_script" "$runtime_script" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          preflight_needle = 'done\n\nCURRENT_STEP="updating-alpha-controls"'
          preflight_replacement = (
              'done\n\n'
              'CURRENT_STEP="using-permanent-topology-for-preflight"\n'
              'git checkout 5f9a3de8fd0bd968a1dcd90d5b8901d33b945827 -- .github/workflows/blocking-ci.yml\n\n'
              'CURRENT_STEP="updating-alpha-controls"'
          )
          commit_needle = 'CURRENT_STEP="committing-upstream-merge"\ngit add --'
          commit_replacement = (
              'CURRENT_STEP="restoring-temporary-orchestrator-for-push"\n'
              'git checkout "$BASE_SHA" -- .github/workflows/blocking-ci.yml\n\n'
              'CURRENT_STEP="committing-upstream-merge"\n'
              'git add --'
          )
          if source.count(preflight_needle) != 1 or source.count(commit_needle) != 1:
              raise SystemExit("maintenance script insertion point changed")
          source = source.replace(preflight_needle, preflight_replacement)
          source = source.replace(commit_needle, commit_replacement)
          Path(sys.argv[2]).write_text(source, encoding="utf-8")
          PY
          chmod +x "$runtime_script"
          "$runtime_script" 2>&1 | tee "$RUNNER_TEMP/alpha-update.log"

      - name: Publish exact failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/alpha-update.log"
          if [[ -s "$log" ]]; then
            diagnostics="$(
              tail -n 220 "$log" \
                | perl -pe 's/\e\[[0-9;]*[mK]//g' \
                | tr -d '\r' \
                | tail -c 18000
            )"
          else
            diagnostics='No captured update log was available.'
          fi
          body="$(cat <<EOF
          state=failed
          detail=exact-regression-diagnostics
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          upstream_tag=${UPSTREAM_TAG}
          upstream_commit=${UPSTREAM_COMMIT}

          \`\`\`text
          ${diagnostics}
          \`\`\`
          EOF
          )"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$body" >/dev/null

      - name: Summarize completed update
        if: success()
        shell: bash
        run: |
          {
            echo '### Codex Termux alpha update'
            echo
            echo "- Package: \`0.150.0-alpha.6\`"
            echo "- Runtime source: \`${{ steps.update.outputs.source_sha }}\`"
            echo "- Release: \`${{ steps.update.outputs.release_tag }}\`"
            echo "- Publication run: \`${{ steps.update.outputs.release_run_id }}\`"
            echo "- Promoted main: \`${{ steps.update.outputs.promoted_main_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
