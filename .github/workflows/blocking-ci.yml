name: fork-ci

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  observe-policy-alignment:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: make fork workflows lightweight' }}"
    name: Verify policy-alignment push checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 476bda4f7c55910365b95245e467b661df20b7b6
    steps:
      - name: Wait for all expected push workflows and record results
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            fork-ci
            termux-control-plane
            termux-release-channel
            termux-governance-audit
          )

          completed=false
          runs='[]'
          for _ in $(seq 1 180); do
            runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --commit "$TARGET_SHA" \
                --limit 100 \
                --json databaseId,workflowName,headSha,event,status,conclusion,url,createdAt
            )"
            all_found=true
            all_completed=true
            for workflow in "${expected[@]}"; do
              count="$(
                jq -r --arg workflow "$workflow" --arg sha "$TARGET_SHA" \
                  '[.[] | select(.workflowName == $workflow and .headSha == $sha and .event == "push")] | length' \
                  <<<"$runs"
              )"
              if [[ "$count" -lt 1 ]]; then
                all_found=false
                all_completed=false
                continue
              fi
              status="$(
                jq -r --arg workflow "$workflow" --arg sha "$TARGET_SHA" \
                  '[.[] | select(.workflowName == $workflow and .headSha == $sha and .event == "push")]
                   | sort_by(.createdAt) | last | .status' <<<"$runs"
              )"
              [[ "$status" == "completed" ]] || all_completed=false
            done
            if [[ "$all_found" == "true" && "$all_completed" == "true" ]]; then
              completed=true
              break
            fi
            sleep 5
          done

          report="$(mktemp)"
          {
            echo 'state=completed'
            echo "target_sha=${TARGET_SHA}"
            overall=success
            for workflow in "${expected[@]}"; do
              row="$(
                jq -c --arg workflow "$workflow" --arg sha "$TARGET_SHA" \
                  '[.[] | select(.workflowName == $workflow and .headSha == $sha and .event == "push")]
                   | sort_by(.createdAt) | last // {}' <<<"$runs"
              )"
              run_id="$(jq -r '.databaseId // "missing"' <<<"$row")"
              status="$(jq -r '.status // "missing"' <<<"$row")"
              conclusion="$(jq -r '.conclusion // "missing"' <<<"$row")"
              url="$(jq -r '.url // "missing"' <<<"$row")"
              echo "${workflow}_run_id=${run_id}"
              echo "${workflow}_status=${status}"
              echo "${workflow}_conclusion=${conclusion}"
              echo "${workflow}_url=${url}"
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                overall=failure
              fi
            done
            echo "overall=${overall}"
            echo "observer_run_id=${GITHUB_RUN_ID}"
            echo "observer_run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >"$report"

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/60" \
            -f body="$(cat "$report")" >/dev/null

          [[ "$completed" == "true" ]]
          grep -Fx 'overall=success' "$report"
