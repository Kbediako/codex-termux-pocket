name: fork-ci

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'issues' }}
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  audit-policy-alignment-runs:
    if: "${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.title == 'Maintenance: audit mutable release push checks' }}"
    name: Audit mutable-release policy push checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_SHA: 476bda4f7c55910365b95245e467b661df20b7b6
      OBSOLETE_RUN_ID: "32531459416"
    steps:
      - name: Cancel obsolete observer and record actual push runs
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel "$OBSOLETE_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

          initial_body="$(cat <<EOF_BODY
          state=running
          target_sha=${TARGET_SHA}
          audit_run_id=${GITHUB_RUN_ID}
          audit_run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          obsolete_observer_run_id=${OBSOLETE_RUN_ID}
          EOF_BODY
          )"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$initial_body" >/dev/null

          expected=(
            fork-ci
            termux-control-plane
            termux-release-channel
            termux-governance-audit
          )

          runs='[]'
          all_complete=false
          for _ in $(seq 1 60); do
            runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --commit "$TARGET_SHA" \
                --limit 100 \
                --json databaseId,workflowName,headSha,event,status,conclusion,url,createdAt
            )"
            all_complete=true
            for workflow in "${expected[@]}"; do
              row="$(
                jq -c --arg workflow "$workflow" --arg sha "$TARGET_SHA" \
                  '[.[] | select(.workflowName == $workflow and .headSha == $sha and .event == "push")]
                   | sort_by(.createdAt) | last // {}' <<<"$runs"
              )"
              status="$(jq -r '.status // "missing"' <<<"$row")"
              [[ "$status" == "completed" ]] || all_complete=false
            done
            [[ "$all_complete" == "true" ]] && break
            sleep 5
          done

          report="$(mktemp)"
          {
            echo 'state=completed'
            echo "target_sha=${TARGET_SHA}"
            overall=success
            for workflow in "${expected[@]}"; do
              label="${workflow//-/_}"
              row="$(
                jq -c --arg workflow "$workflow" --arg sha "$TARGET_SHA" \
                  '[.[] | select(.workflowName == $workflow and .headSha == $sha and .event == "push")]
                   | sort_by(.createdAt) | last // {}' <<<"$runs"
              )"
              run_id="$(jq -r '.databaseId // "missing"' <<<"$row")"
              status="$(jq -r '.status // "missing"' <<<"$row")"
              conclusion="$(jq -r '.conclusion // "missing"' <<<"$row")"
              url="$(jq -r '.url // "missing"' <<<"$row")"
              echo "${label}_run_id=${run_id}"
              echo "${label}_status=${status}"
              echo "${label}_conclusion=${conclusion}"
              echo "${label}_url=${url}"
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                overall=failure
              fi
            done
            echo "overall=${overall}"
            echo "audit_run_id=${GITHUB_RUN_ID}"
            echo "audit_run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "obsolete_observer_cancelled=${OBSOLETE_RUN_ID}"
          } >"$report"

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$(cat "$report")" >/dev/null

          [[ "$all_complete" == "true" ]]
          grep -Fx 'overall=success' "$report"
