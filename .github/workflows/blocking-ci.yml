name: fork-ci
run-name: ${{ github.event_name == 'issues' && 'Codex Termux 0.150.0-alpha.8 update' || format('Fork CI · {0} · {1}', github.event_name, github.ref_name) }}

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: "${{ github.event_name != 'issues' && (github.event_name != 'push' || github.event.head_commit.message != 'ci: stage protected alpha update') }}"
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  update-alpha-0-150-0-alpha-8:
    if: "${{ github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened') && github.event.issue.title == 'Maintenance: update Codex Termux to 0.150.0-alpha.8' }}"
    name: Merge, validate, publish, and verify 0.150.0-alpha.8
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      actions: write
      attestations: read
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      UPSTREAM_TAG: rust-v0.150.0-alpha.8
      UPSTREAM_COMMIT: f292c342dbc124d3a7461f8d8d24e9ed549f8109
      PACKAGE_VERSION: 0.150.0-alpha.8
      RELEASE_TAG: termux-v0.150.0-alpha.8
      STAGING_BRANCH: alpha-0.150.0-alpha.8-staging
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Run exact alpha update transaction
        id: update
        shell: bash
        run: bash .github/scripts/update-alpha-0.150.0-alpha.8.sh

      - name: Summarize completed update
        if: success()
        shell: bash
        run: |
          {
            echo '### Codex Termux alpha update'
            echo
            echo '- Package: `0.150.0-alpha.8`'
            echo "- Runtime source: `${{ steps.update.outputs.source_sha }}`"
            echo "- Release: `${{ steps.update.outputs.release_tag }}`"
            echo "- Publication run: `${{ steps.update.outputs.release_run_id }}`"
            echo "- Promoted main: `${{ steps.update.outputs.promoted_main_sha }}`"
          } >> "$GITHUB_STEP_SUMMARY"
