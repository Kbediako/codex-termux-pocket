name: fork-ci

# Temporary protected-main maintenance hook. This file is restored to the
# permanent fork CI definition immediately after the exact upstream merge.
on:
  issues:
    types: [reopened]

permissions:
  contents: read

concurrency:
  group: alpha-sync-149-7-1
  cancel-in-progress: true

jobs:
  sync-upstream-alpha:
    if: ${{ github.event_name == 'issues' && github.event.action == 'reopened' && github.event.issue.number == 55 }}
    name: Merge official 0.149.0-alpha.7.1 and refresh lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_BRANCH: alpha-sync-status
      STATUS_PATH: .github/alpha-sync-status.env
      UPSTREAM_TAG: rust-v0.149.0-alpha.7.1
      UPSTREAM_COMMIT: 0e015a7a0eef52047fea8ded24f8b32afbafd527
      PACKAGE_VERSION: 0.149.0-alpha.7.1
    steps:
      - name: Checkout protected main with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Publish observable start status
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          file_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}?ref=${STATUS_BRANCH}" --jq .sha
          )"
          status_file="$(mktemp)"
          cat >"$status_file" <<EOF
          format_version=1
          state=running
          source_commit=${GITHUB_SHA}
          upstream_tag=${UPSTREAM_TAG}
          upstream_commit=${UPSTREAM_COMMIT}
          detail=checkout-complete
          merge_commit=
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh api --method PUT \
            "/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
            -f message="ci: alpha sync running checkout-complete" \
            -f content="$(base64 -w0 "$status_file")" \
            -f sha="$file_sha" \
            -f branch="$STATUS_BRANCH" >/dev/null

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Merge, refresh lockfile, validate and push
        id: merge
        shell: bash
        run: bash .github/scripts/sync-upstream-alpha-temp.sh

      - name: Publish observable final status
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          file_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}?ref=${STATUS_BRANCH}" --jq .sha
          )"
          status_file="$(mktemp)"
          cat >"$status_file" <<EOF
          format_version=1
          state=${JOB_STATUS}
          source_commit=${GITHUB_SHA}
          upstream_tag=${UPSTREAM_TAG}
          upstream_commit=${UPSTREAM_COMMIT}
          detail=job-${JOB_STATUS}
          merge_commit=${MERGE_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh api --method PUT \
            "/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
            -f message="ci: alpha sync ${JOB_STATUS}" \
            -f content="$(base64 -w0 "$status_file")" \
            -f sha="$file_sha" \
            -f branch="$STATUS_BRANCH" >/dev/null
