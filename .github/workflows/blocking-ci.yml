name: fork-ci
run-name: Fork CI · ${{ github.event_name }} · ${{ github.ref_name }}

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' '.github/scripts/**/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Self-test the executable release contract
        run: |
          python3 .github/scripts/termux_release_control.py self-test
          python3 -m unittest discover -s .github/scripts/termux_release -p test_maintenance.py
          python3 -m unittest discover -s .github/scripts -p test_termux_workflow_registry.py

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Install pinned Python formatter runner
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: uv@0.12.10

      - name: Check release helper formatting
        id: helper_format
        run: uv run --frozen --project scripts ruff format --diff .github/scripts/termux_release

      - name: Capture exact release helper formatter evidence
        if: ${{ !cancelled() && steps.helper_format.outcome == 'failure' }}
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          root = Path.cwd().resolve()
          out = Path(os.environ["RUNNER_TEMP"]).resolve() / "termux-format-evidence"
          if out.is_relative_to(root):
              raise RuntimeError("formatter evidence must be outside the checkout")
          out.mkdir(exist_ok=False)
          receipt = {"format_version": 1, "diagnostic_only": True, "completed": False,
                     "files": [], "configuration": [], "commands": []}

          def identity(data):
              return {"git_blob": hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest(),
                      "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}

          def run(*args, input_data=None):
              number = len(receipt["commands"])
              record = {"argv": list(args), "returncode": None}
              receipt["commands"].append(record)
              result = subprocess.run(args, input=input_data, capture_output=True, timeout=120)
              record["returncode"] = result.returncode
              for stream in ("stdout", "stderr"):
                  name = f"command-{number:03d}.{stream}"
                  data = getattr(result, stream)
                  (out / name).write_bytes(data)
                  record[stream] = {"artifact_path": name, **identity(data)}
              result.check_returncode()
              return result.stdout

          try:
              source = run("git", "rev-parse", "HEAD").decode().strip()
              if not re.fullmatch(r"[0-9a-f]{40}", source):
                  raise RuntimeError("invalid checkout identity")
              receipt.update(source_sha=source,
                             source_tree=run("git", "rev-parse", "HEAD^{tree}").decode().strip(),
                             run_id=os.environ.get("GITHUB_RUN_ID"),
                             run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"),
                             event_sha=os.environ.get("GITHUB_SHA"))
              unchanged = []
              for number, name in enumerate(("ruff.toml", "scripts/pyproject.toml", "scripts/uv.lock")):
                  data = run("git", "show", f"{source}:{name}")
                  path = root / name
                  if path.is_symlink() or not path.resolve().is_relative_to(root) or path.read_bytes() != data:
                      raise RuntimeError("formatter configuration differs from committed input")
                  artifact_path = f"configuration-{number:02d}.txt"
                  (out / artifact_path).write_bytes(data)
                  receipt["configuration"].append({"path": name, "artifact_path": artifact_path, **identity(data)})
                  unchanged.append((path, data))
              lock = tomllib.loads(unchanged[-1][1].decode())
              versions = [p["version"] for p in lock["package"] if p["name"] == "ruff"]
              prefix = ("uv", "run", "--frozen", "--project", "scripts", "ruff")
              receipt["uv_version"] = run("uv", "--version").decode().strip()
              receipt["ruff_version"] = run(*prefix, "--version").decode().strip()
              if len(versions) != 1 or receipt["ruff_version"] != f"ruff {versions[0]}":
                  raise RuntimeError("formatter version differs from the frozen lock")
              records = run("git", "ls-tree", "-rz", source, "--", ".github/scripts/termux_release")
              entries = [record for record in records.split(b"\0") if record.endswith(b".py")]
              if not 1 <= len(entries) <= 64:
                  raise RuntimeError("unexpected formatter input inventory size")
              for number, entry in enumerate(entries):
                  metadata, raw_path = entry.split(b"\t", 1)
                  mode, kind, expected = metadata.decode().split()
                  name = raw_path.decode()
                  path = root / name
                  if (mode not in ("100644", "100755") or kind != "blob"
                          or not re.fullmatch(r"[A-Za-z0-9_./-]+", name)
                          or ".." in Path(name).parts or path.is_symlink()
                          or not path.resolve().is_relative_to(root) or not path.is_file()):
                      raise RuntimeError("unsafe formatter input")
                  before = path.read_bytes()
                  if len(before) > 2 * 1024 * 1024 or identity(before)["git_blob"] != expected:
                      raise RuntimeError("formatter preimage differs from committed blob")
                  before_name, after_name = f"before-{number:02d}.py", f"after-{number:02d}.py"
                  (out / before_name).write_bytes(before)
                  after = run(*prefix, "format", "--stdin-filename", name, "-", input_data=before)
                  if len(after) > 2 * 1024 * 1024:
                      raise RuntimeError("oversized formatter output")
                  (out / after_name).write_bytes(after)
                  receipt["files"].append({"path": name, "mode": mode,
                                           "before": {"artifact_path": before_name, **identity(before)},
                                           "after": {"artifact_path": after_name, **identity(after)}})
                  unchanged.append((path, before))
              if any(path.is_symlink() or path.read_bytes() != data for path, data in unchanged):
                  raise RuntimeError("formatter changed committed inputs")
              run("git", "diff", "--exit-code", "HEAD", "--", ".github/scripts/termux_release",
                  "ruff.toml", "scripts/pyproject.toml", "scripts/uv.lock")
              receipt["completed"] = True
          finally:
              (out / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYTHON

      - name: Retain release helper formatter evidence
        if: ${{ !cancelled() && steps.helper_format.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: termux-format-evidence
          path: ${{ runner.temp }}/termux-format-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
