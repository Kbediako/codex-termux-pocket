name: fork-ci
run-name: Fork CI · ${{ github.event_name }} · ${{ github.ref_name }}

# Routine CI for this Android/Termux-focused fork. Expensive artifact, device,
# sandbox, and release gates live in dedicated path-filtered or manual workflows.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The one staging revision uses an isolated group so its short dispatch job can
# finish before the permanent file is restored.
concurrency:
  group: fork-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.head_commit.message != 'ci: run final repository cleanup and release repair'
    name: Termux fork checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            YAML.safe_load(File.read(path), aliases: true)
          end
          RUBY

      - name: Validate permanent workflow topology
        run: python3 .github/scripts/validate-termux-workflow-topology.py

      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -Il '^#!.*bash' --)

      - name: Validate Python helpers
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(
            git ls-files -z '.github/scripts/*.py' '.github/scripts/**/*.py' 'scripts/termux/*.py'
          )
          if (( ${#python_files[@]} > 0 )); then
            python3 -m py_compile "${python_files[@]}"
          fi

      - name: Self-test the executable release contract
        run: python3 .github/scripts/termux_release_control.py self-test

      - name: Validate locked Cargo metadata
        working-directory: codex-rs
        run: cargo metadata --locked --format-version=1 --no-deps >/dev/null

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  alpha1534-dispatch-android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'ci: run final repository cleanup and release repair'
    name: Dispatch exact alpha.4 Android gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 223220fd66f600b8bf3291ed84960b7d76b7774a
      SOURCE_BRANCH: automation/alpha1534-integration
    steps:
      - name: Dispatch immutable source and delete staging branch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow_path=".github/workflows/termux-android-emulator.yml"

          branch_sha="$(
            gh api "repos/$repo/git/ref/heads/automation%2Falpha1534-integration" \
              --jq '.object.sha'
          )"
          [[ "$branch_sha" == "$SOURCE_SHA" ]]

          before="$(
            gh api "repos/$repo/actions/runs?head_sha=$SOURCE_SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/termux-android-emulator.yml" and .event == "workflow_dispatch")] | map(.id) | max // 0'
          )"
          gh api --method POST \
            "repos/$repo/actions/workflows/termux-android-emulator.yml/dispatches" \
            -f ref="$SOURCE_BRANCH"

          android_run_id=""
          for attempt in $(seq 1 60); do
            runs_json="$(gh api "repos/$repo/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
            android_run_id="$(
              jq -r --arg path "$workflow_path" --arg sha "$SOURCE_SHA" --argjson before "$before" '
                [.workflow_runs[]
                  | select(.path == $path and .event == "workflow_dispatch" and .head_sha == $sha and .id > $before)]
                | sort_by(.id)
                | last
                | .id // empty
              ' <<<"$runs_json"
            )"
            [[ -n "$android_run_id" ]] && break
            sleep 2
          done
          [[ -n "$android_run_id" ]]

          run_json="$(gh api "repos/$repo/actions/runs/$android_run_id")"
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r '.path' <<<"$run_json")" == "$workflow_path" ]]
          [[ "$(jq -r '.event' <<<"$run_json")" == "workflow_dispatch" ]]

          gh api --method DELETE \
            "repos/$repo/git/refs/heads/automation%2Falpha1534-integration"
          if gh api "repos/$repo/git/ref/heads/automation%2Falpha1534-integration" >/dev/null 2>&1; then
            echo "::error::Temporary source branch still exists."
            exit 1
          fi

          {
            echo "### Exact alpha.4 Android gate dispatched"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Android run: \`$android_run_id\`"
            echo "- Temporary source branch: \`deleted\`"
          } >>"$GITHUB_STEP_SUMMARY"
