name: termux-linux-sandbox
run-name: Linux sandbox tests ${{ inputs.source_ref || github.sha }}

on:
  pull_request:
    paths:
      - ".github/actions/setup-ci/**"
      - ".github/workflows/termux-linux-sandbox.yml"
      - "codex-rs/.config/nextest.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/linux-sandbox/**"
      - "codex-rs/sandboxing/**"
      - "codex-rs/utils/image/**"
      - "codex-rs/utils/cache/**"
      - "codex-rs/utils/rustls-provider/**"
      - "codex-rs/utils/cargo-bin/**"
      - "codex-rs/http-client/**"
      - "codex-rs/aws-auth/**"
      - ".cargo/**"
      - "codex-rs/.cargo/**"
      - "justfile"
      - "scripts/just-shell.py"
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-ci/**"
      - ".github/workflows/termux-linux-sandbox.yml"
      - "codex-rs/.config/nextest.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/linux-sandbox/**"
      - "codex-rs/sandboxing/**"
      - "codex-rs/utils/image/**"
      - "codex-rs/utils/cache/**"
      - "codex-rs/utils/rustls-provider/**"
      - "codex-rs/utils/cargo-bin/**"
      - "codex-rs/http-client/**"
      - "codex-rs/aws-auth/**"
      - ".cargo/**"
      - "codex-rs/.cargo/**"
      - "justfile"
      - "scripts/just-shell.py"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to test (branch, tag, or commit SHA)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.repository != 'openai/codex' }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608"
      NEXTEST_STATUS_LEVEL: leak
      CONSUMER_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Checkout triggering commit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_ref == '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Linux sandbox dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev libssl-dev bubblewrap

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: nextest@0.9.103

      - name: Verify nextest version
        shell: bash
        run: cargo nextest --version | grep -E '^cargo-nextest 0\.9\.103([[:space:]]|$)'

      - name: Enable unprivileged user namespaces
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Validate locked dependency graph
        shell: bash
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Test codex-linux-sandbox
        shell: bash
        run: cargo nextest run --locked --no-fail-fast --cargo-profile ci-test --target ${{ matrix.target }} -p codex-linux-sandbox

      - name: Record dependency consumer source identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/termux-dependency-consumers-$CONSUMER_TARGET"
          mkdir -p "$evidence"
          {
            printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\ntarget=%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CONSUMER_TARGET"
            printf 'event_source_sha=%s\n' "$GITHUB_SHA"
            printf 'checkout_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'checkout_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'workflow_blob=%s\n' "$(git rev-parse HEAD:.github/workflows/termux-linux-sandbox.yml)"
            sha256sum Cargo.lock ../MODULE.bazel.lock
          } | tee "$evidence/source-identity.txt"

      - name: Record scoped reqwest backend evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/termux-dependency-consumers-$CONSUMER_TARGET"
          test -s "$evidence/source-identity.txt"
          rustc -Vv > "$evidence/consumer-rustc.txt"
          cargo tree --locked --target "$CONSUMER_TARGET" -p codex-utils-image -p codex-http-client -p codex-aws-auth -e features -i reqwest@0.12.28 --format '{p} features=[{f}]' | tee "$evidence/reqwest-feature-tree.txt"
          # Metadata locates dependency source and target paths; it is not scoped feature proof.
          cargo metadata --locked --format-version=1 --filter-platform "$CONSUMER_TARGET" > "$RUNNER_TEMP/termux-consumer-metadata-$CONSUMER_TARGET.json"
          # Rebuild only this dependency in the existing consumer profile and target.
          # This avoids attributing a stale sandbox-build fingerprint to the consumer build.
          cargo clean --package reqwest@0.12.28 --profile ci-test --target "$CONSUMER_TARGET"

      - name: Test image and HTTP dependency consumers
        shell: bash
        env:
          NEXTEST_STATUS_LEVEL: all
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/termux-dependency-consumers-$CONSUMER_TARGET"
          test -s "$evidence/source-identity.txt"
          # Ambient custom CAs select rustls; native-TLS fixtures need a system-root baseline.
          # Record presence only, never certificate paths or contents. Custom-CA tests set fixtures.
          # This shell baseline is not proof of the later test-process environment.
          {
            for variable in CODEX_CA_CERTIFICATE SSL_CERT_FILE; do
              if [ -n "${!variable:-}" ]; then
                printf 'inherited_%s=nonempty\n' "$variable"
              else
                printf 'inherited_%s=unset-or-empty\n' "$variable"
              fi
            done
            printf 'consumer_ca_baseline=system-roots\n'
          } | tee "$evidence/consumer-ca-environment.txt"
          # Observe the test-launch boundary; Cargo/nextest can alter the shell environment.
          # Do not change CA values, TLS selection, test arguments, or existing runner behavior.
          runner_variable="CARGO_TARGET_${CONSUMER_TARGET^^}_RUNNER"
          runner_variable="${runner_variable//-/_}"
          if [[ -v "$runner_variable" ]]; then
            echo "Refusing to replace an environment-configured Cargo target runner" >&2
            exit 1
          fi
          [[ "$evidence" != *[[:space:]]* ]] || { echo "Runner path contains whitespace" >&2; exit 1; }
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import tomllib

          # A diagnostic runner must never silently replace an existing runner.
          roots = [parent / ".cargo" for parent in (Path.cwd(), *Path.cwd().parents)]
          roots.append(Path(os.environ.get("CARGO_HOME", str(Path.home() / ".cargo"))))
          for root in set(roots):
              for name in ("config", "config.toml"):
                  path = root / name
                  if path.is_file():
                      config = tomllib.loads(path.read_text())
                      if any("runner" in value for value in config.get("target", {}).values()
                             if isinstance(value, dict)):
                          raise SystemExit("Refusing to replace a configured Cargo target runner")
          PYTHON
          export CONSUMER_LAUNCH_EVIDENCE_DIR="$evidence/consumer-launch-environment"
          mkdir -p "$CONSUMER_LAUNCH_EVIDENCE_DIR"
          cat > "$evidence/consumer-env-runner.py" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys
          import uuid

          if len(sys.argv) < 2:
              raise SystemExit("Expected a test executable")
          directory = Path(os.environ["CONSUMER_LAUNCH_EVIDENCE_DIR"])
          record = {
              "schema_version": 1,
              "binary": Path(sys.argv[1]).name,
              "phase": "list" if "--list" in sys.argv[2:] else "run",
              "ca_environment": {
                  name: ("unset" if name not in os.environ else
                         "nonempty" if os.environ[name] else "empty")
                  for name in ("CODEX_CA_CERTIFICATE", "SSL_CERT_FILE", "SSL_CERT_DIR")
              },
          }
          # Fail closed if the receipt cannot be retained. Do not record values or arguments.
          with (directory / f"{uuid.uuid4().hex}.json").open("x") as output:
              json.dump(record, output, sort_keys=True)
              output.write("\n")
          # Preserve argv, environment, cwd, standard streams, PID and exit/signal behavior.
          os.execvp(sys.argv[1], sys.argv[1:])
          PYTHON
          export "$runner_variable=python3 $evidence/consumer-env-runner.py"
          unset CODEX_CA_CERTIFICATE SSL_CERT_FILE
          set +e
          just test --locked --cargo-profile ci-test --target "$CONSUMER_TARGET" -p codex-utils-image -p codex-http-client -p codex-aws-auth 2>&1 | tee "$evidence/consumer-tests.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'consumer_exit_code=%s\nlog_exit_code=%s\n' "${statuses[0]}" "${statuses[1]}" | tee "$evidence/consumer-tests.exit"
          if [ "${statuses[0]}" -ne 0 ]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"

      - name: Retain dependency consumer launch receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import collections
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / (
              "termux-dependency-consumers-" + os.environ["CONSUMER_TARGET"])
          records = [json.loads(path.read_text())
                     for path in sorted((evidence / "consumer-launch-environment").glob("*.json"))]
          runs = [record for record in records if record["phase"] == "run"]
          http_runs = [record for record in runs
                       if record["binary"].split("-", 1)[0] == "codex_http_client"]
          report = {
              "schema_version": 1,
              "list_receipts": len(records) - len(runs),
              "run_receipts": len(runs),
              "http_client_run_receipts": len(http_runs),
              "ca_environment_counts": {
                  name: dict(collections.Counter(record["ca_environment"][name] for record in runs))
                  for name in ("CODEX_CA_CERTIFICATE", "SSL_CERT_FILE", "SSL_CERT_DIR")
              },
              "interpretation": "Test-process entry environment only; tests may subsequently change it.",
          }
          (evidence / "consumer-launch-environment-summary.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, sort_keys=True))
          if not http_runs:
              raise SystemExit("No HTTP-client test-launch receipt; runtime environment evidence is incomplete")
          PYTHON

      - name: Retain compiled reqwest backend evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          target = os.environ["CONSUMER_TARGET"]
          temporary = Path(os.environ["RUNNER_TEMP"])
          evidence = temporary / f"termux-dependency-consumers-{target}"
          evidence.mkdir(parents=True, exist_ok=True)
          metadata_path = temporary / f"termux-consumer-metadata-{target}.json"
          metadata = json.loads(metadata_path.read_text())
          packages = [
              package for package in metadata["packages"]
              if package["name"] == "reqwest" and package["version"] == "0.12.28"
          ]
          if len(packages) != 1:
              raise SystemExit("Expected exactly one locked reqwest 0.12.28 source")
          package = packages[0]
          source = Path(package["manifest_path"]).parent
          profile = Path(metadata["target_directory"]) / target / "ci-test"
          report = {
              "target": target,
              "cargo_profile": "ci-test",
              "package_id": package["id"],
              "metadata_use": "source and target paths only; not consumer feature resolution",
              "fingerprint_attribution": "fresh scoped rebuild; match dep-info to the locked source",
              "candidates": [],
              "source_files": [],
          }
          for relative, name in [
              ("Cargo.toml", "reqwest-source-Cargo.toml"),
              ("src/tls.rs", "reqwest-source-tls.rs"),
              ("src/async_impl/client.rs", "reqwest-source-client.rs"),
          ]:
              data = (source / relative).read_bytes()
              (evidence / name).write_bytes(data)
              report["source_files"].append({"path": relative, "artifact": name, "sha256": digest(data)})
          matched = 0
          for fingerprint in sorted((profile / ".fingerprint").glob("reqwest-*/lib-reqwest.json")):
              data = fingerprint.read_bytes()
              dep_info = profile / "deps" / f"{fingerprint.parent.name}.d"
              dep_data = dep_info.read_bytes() if dep_info.is_file() else b""
              source_match = (str(source) + "/").encode() in dep_data
              item = {
                  "unit": fingerprint.parent.name,
                  "fingerprint_sha256": digest(data),
                  "fingerprint": json.loads(data),
                  "dep_info_present": bool(dep_data),
                  "locked_source_match": source_match,
              }
              if source_match:
                  matched += 1
                  fingerprint_name = f"{fingerprint.parent.name}-fingerprint.json"
                  dep_name = f"{fingerprint.parent.name}.d"
                  (evidence / fingerprint_name).write_bytes(data)
                  (evidence / dep_name).write_bytes(dep_data)
                  item.update({
                      "fingerprint_artifact": fingerprint_name,
                      "dep_info_artifact": dep_name,
                      "dep_info_sha256": digest(dep_data),
                  })
              report["candidates"].append(item)
          report["matched_compiled_units"] = matched
          report["interpretation"] = (
              "Use source-matched units and the scoped feature tree together. "
              "Multiple units must be distinguished; TransportDefault is not backend proof."
          )
          (evidence / "reqwest-compiler-evidence.json").write_text(json.dumps(report, indent=2) + "\n")
          if not matched:
              raise SystemExit("No source-matched reqwest compiler fingerprint; backend evidence is incomplete")
          print(f"Retained {matched} source-matched reqwest compiler unit(s) for {target}")
          PYTHON

      - name: Verify dependency consumer worktree
        if: always()
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git diff --exit-code -- codex-rs/Cargo.lock MODULE.bazel.lock
          test -z "$(git status --porcelain)"

      - name: Retain dependency consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: termux-dependency-consumers-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/termux-dependency-consumers-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
