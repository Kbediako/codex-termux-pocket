name: alpha1516-post-verify
run-name: Verify final 0.151.0-alpha.6 repository state

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpha1516-resume.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: alpha1516-post-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify final cleaned main and promoted release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: "89"
      SOURCE_SHA: 2b9e7bdf3c6cf06ab0ff1669455e71b2f078c02f
      RELEASE_TAG: termux-v0.151.0-alpha.6-2b9e7bdf3c
      UPSTREAM_TAG: rust-v0.151.0-alpha.6
      UPSTREAM_COMMIT: 42cd2e3425834ee77c0b76c121cd43541d69810b
      PACKAGE_VERSION: 0.151.0-alpha.6
      MERGE_COMMIT: 6bdb902a00306a953c0dcea357f6c48326fa874f
      FORK_CI_RUN_ID: "33080549841"
      CONTROL_RUN_ID: "33080562306"
      SANDBOX_RUN_ID: "33080570681"
      ARTIFACT_RUN_ID: "33084605679"
      ANDROID_RUN_ID: "33084607507"
      RELEASE_RUN_ID: "33088801371"
      FAILED_RESUME_RUN_ID: "33084570150"
    steps:
      - name: Verify cleaned main and dispatch permanent post-promotion checks
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          release_channel_run_id=""
          governance_run_id=""
          post_control_run_id=""
          post_fork_ci_run_id=""

          update_issue() {
            local state="$1"
            local detail="$2"
            local close="${3:-false}"
            local body payload
            body="$(cat <<EOF
          state=${state}
          detail=${detail}
          orchestrator_run_id=33080108793
          resume_run_id=${FAILED_RESUME_RUN_ID}
          post_verify_run_id=${GITHUB_RUN_ID}
          upstream_tag=${UPSTREAM_TAG}
          upstream_commit=${UPSTREAM_COMMIT}
          package_version=${PACKAGE_VERSION}
          merge_commit=${MERGE_COMMIT}
          source_sha=${SOURCE_SHA}
          release_tag=${RELEASE_TAG}
          fork_ci_run_id=${FORK_CI_RUN_ID}
          control_run_id=${CONTROL_RUN_ID}
          sandbox_run_id=${SANDBOX_RUN_ID}
          artifact_run_id=${ARTIFACT_RUN_ID}
          android_run_id=${ANDROID_RUN_ID}
          release_run_id=${RELEASE_RUN_ID}
          post_fork_ci_run_id=${post_fork_ci_run_id}
          post_control_run_id=${post_control_run_id}
          release_channel_run_id=${release_channel_run_id}
          governance_run_id=${governance_run_id}
          EOF
          )"
            payload="$RUNNER_TEMP/issue-state.json"
            if [[ "$close" == "true" ]]; then
              jq -n --arg body "$body" \
                '{body:$body,state:"closed",state_reason:"completed"}' > "$payload"
            else
              jq -n --arg body "$body" '{body:$body,state:"open"}' > "$payload"
            fi
            gh api --method PATCH "/repos/${repo}/issues/${ISSUE_NUMBER}" \
              --input "$payload" >/dev/null
          }

          on_error() {
            local rc=$?
            set +e
            update_issue failed "post-verification-line-${BASH_LINENO[0]:-unknown}-exit-${rc}"
            exit "$rc"
          }
          trap on_error ERR

          verify_run() {
            local run_id="$1"
            local expected_path="$2"
            local expected_head="$3"
            local json
            json="$(gh api "/repos/${repo}/actions/runs/${run_id}")"
            [[ "$(jq -r .path <<<"$json")" == "$expected_path" ]]
            [[ "$(jq -r .head_sha <<<"$json")" == "$expected_head" ]]
            [[ "$(jq -r .status <<<"$json")" == "completed" ]]
            [[ "$(jq -r .conclusion <<<"$json")" == "success" ]]
          }

          dispatch() {
            local workflow="$1"
            local payload="$RUNNER_TEMP/dispatch-${workflow}.json"
            jq -n '{ref:"main"}' > "$payload"
            gh api --method POST "/repos/${repo}/actions/workflows/${workflow}/dispatches" \
              --input "$payload" >/dev/null
          }

          find_run() {
            local workflow="$1"
            local head_sha="$2"
            local json run_id
            for _ in $(seq 1 90); do
              json="$(gh api "/repos/${repo}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=100")"
              run_id="$(
                jq -r --arg sha "$head_sha" '
                  [.workflow_runs[]
                    | select(.event == "workflow_dispatch")
                    | select(.head_branch == "main")
                    | select(.head_sha == $sha)]
                  | sort_by(.created_at) | last | .id // empty
                ' <<<"$json"
              )"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 4
            done
            return 1
          }

          wait_run() {
            local run_id="$1"
            local label="$2"
            local deadline=$(( $(date +%s) + 3600 ))
            local json status conclusion
            while (( $(date +%s) < deadline )); do
              json="$(gh api "/repos/${repo}/actions/runs/${run_id}")"
              status="$(jq -r .status <<<"$json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$json")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "::error::${label} run ${run_id} concluded ${conclusion:-unknown}"
                  return 1
                }
                echo "${label} run ${run_id} succeeded."
                return 0
              fi
              sleep 15
            done
            echo "::error::${label} run ${run_id} exceeded the verification deadline"
            return 1
          }

          verify_run "$FORK_CI_RUN_ID" ".github/workflows/blocking-ci.yml" "$SOURCE_SHA"
          verify_run "$CONTROL_RUN_ID" ".github/workflows/termux-control-plane.yml" "$SOURCE_SHA"
          verify_run "$SANDBOX_RUN_ID" ".github/workflows/termux-linux-sandbox.yml" "$SOURCE_SHA"
          verify_run "$ARTIFACT_RUN_ID" ".github/workflows/termux-mobile-artifact.yml" "$SOURCE_SHA"
          verify_run "$ANDROID_RUN_ID" ".github/workflows/termux-android-emulator.yml" "$SOURCE_SHA"

          publisher="$(gh api "/repos/${repo}/actions/runs/${RELEASE_RUN_ID}")"
          [[ "$(jq -r .path <<<"$publisher")" == ".github/workflows/termux-release-request.yml" ]]
          [[ "$(jq -r .status <<<"$publisher")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$publisher")" == "success" ]]

          latest="$(gh api "/repos/${repo}/releases/latest")"
          [[ "$(jq -r .tag_name <<<"$latest")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r .target_commitish <<<"$latest")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .draft <<<"$latest")" == "false" ]]
          [[ "$(jq -r .prerelease <<<"$latest")" == "false" ]]
          [[ "$(jq '.assets | length' <<<"$latest")" == "5" ]]

          update_issue running waiting-for-connector-cleanup-before-final-checks
          cleaned=false
          for _ in $(seq 1 180); do
            if ! gh api "/repos/${repo}/contents/.github/workflows/alpha1516-resume.yml?ref=main" \
              >/dev/null 2>&1; then
              cleaned=true
              break
            fi
            sleep 3
          done
          [[ "$cleaned" == "true" ]]

          final_main_sha="$(gh api "/repos/${repo}/branches/main" --jq .commit.sha)"
          [[ "$final_main_sha" =~ ^[0-9a-f]{40}$ ]]

          dispatch termux-release-channel.yml
          dispatch termux-governance.yml
          dispatch termux-control-plane.yml
          dispatch blocking-ci.yml

          release_channel_run_id="$(find_run termux-release-channel.yml "$final_main_sha")"
          governance_run_id="$(find_run termux-governance.yml "$final_main_sha")"
          post_control_run_id="$(find_run termux-control-plane.yml "$final_main_sha")"
          post_fork_ci_run_id="$(find_run blocking-ci.yml "$final_main_sha")"
          update_issue running independently-verifying-final-clean-main

          wait_run "$release_channel_run_id" "Release channel"
          wait_run "$governance_run_id" "Governance"
          wait_run "$post_control_run_id" "Post-promotion control plane"
          wait_run "$post_fork_ci_run_id" "Post-promotion fork CI"

          manifest_response="$(gh api "/repos/${repo}/contents/scripts/termux/release-manifest.env?ref=main")"
          manifest="$RUNNER_TEMP/release-manifest.env"
          jq -r .content <<<"$manifest_response" | tr -d '\n' | base64 --decode > "$manifest"
          grep -Fx "release_tag=${RELEASE_TAG}" "$manifest"
          grep -Fx "head_sha=${SOURCE_SHA}" "$manifest"
          grep -Fx "codex_version=codex-cli ${SOURCE_SHA:0:7}" "$manifest"
          latest_tag="$(gh api "/repos/${repo}/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" == "$RELEASE_TAG" ]]

          trap - ERR
          update_issue completed published-and-independently-verified true

          {
            echo "### Final alpha.6 verification completed"
            echo
            echo "- Final main: \`${final_main_sha}\`"
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- Release channel: \`${release_channel_run_id}\`"
            echo "- Governance: \`${governance_run_id}\`"
            echo "- Control plane: \`${post_control_run_id}\`"
            echo "- Fork CI: \`${post_fork_ci_run_id}\`"
          } >> "$GITHUB_STEP_SUMMARY"
