name: apply-repository-hardening

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-repository-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply immutable releases and main protection
        id: hardening
        shell: bash
        run: |
          set -u
          api_version=2026-03-10

          set +e
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "/repos/${GITHUB_REPOSITORY}/immutable-releases" \
            >immutable.out 2>immutable.err
          immutable_status=$?

          cat >protection.json <<'JSON'
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": false,
            "lock_branch": false,
            "allow_fork_syncing": true
          }
          JSON
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "/repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            --input protection.json \
            >protection.out 2>protection.err
          protection_status=$?
          set -e

          {
            echo "### Repository hardening probe"
            echo
            echo "- Immutable releases endpoint: exit ${immutable_status}"
            echo "- Main branch protection endpoint: exit ${protection_status}"
            if [[ -s immutable.err ]]; then
              echo
              echo '<details><summary>Immutable release response</summary>'
              echo
              echo '```text'
              cat immutable.err
              echo '```'
              echo '</details>'
            fi
            if [[ -s protection.err ]]; then
              echo
              echo '<details><summary>Branch protection response</summary>'
              echo
              echo '```text'
              cat protection.err
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( immutable_status != 0 || protection_status != 0 )); then
            exit 1
          fi

      - name: Verify applied settings
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          api_version=2026-03-10
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "/repos/${GITHUB_REPOSITORY}/immutable-releases" |
            tee immutable-releases.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "/repos/${GITHUB_REPOSITORY}/branches/main/protection" |
            tee main-protection.json
          jq -e '.enabled == true or .immutable_releases == true or .enforced == true' immutable-releases.json >/dev/null
          jq -e '.allow_force_pushes.enabled == false and .allow_deletions.enabled == false' main-protection.json >/dev/null
