name: force-publish-validated-alpha149-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/force-publish-validated-alpha149.trigger"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: force-publish-validated-alpha149-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 329147e2fab2ddf5f9e8e607efc2a3ba1f5f712c
      EXPECTED_VERSION: 0.149.0-alpha.1
      EXPECTED_BINARY: codex-cli 329147e
      BASE_TAG: termux-v2026.08.19-alpha.1-329147e2fa
      FORK_CI_RUN: "32209449042"
      CONTROL_RUN: "32209449072"
      ARTIFACT_RUN: "32209918341"
      ANDROID_RUN: "32209449113"
      SELF_PATH: .github/workflows/force-publish-validated-alpha149-once.yml
      TRIGGER_PATH: .github/force-publish-validated-alpha149.trigger
    steps:
      - name: Checkout protected main with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Cancel superseded repair orchestration
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100")"
          mapfile -t stale < <(
            jq -r --arg current "$GITHUB_RUN_ID" '
              .workflow_runs[]
              | select((.status == "queued") or (.status == "in_progress") or (.status == "waiting") or (.status == "pending") or (.status == "requested"))
              | select((.id | tostring) != $current)
              | select(
                  .name == "finalize-alpha149-release-once" or
                  .name == "dispatch-finalize-alpha149-once" or
                  .name == "publish-alpha149-explicit-once" or
                  .name == "publish-alpha149-explicit-v2-once" or
                  .name == "publish-latest-validated-alpha-once" or
                  .name == "record-alpha149-publication-result-once" or
                  .name == "finish-repository-cleanup-and-alpha-release-once" or
                  .name == "trigger-finish-repository-cleanup-once"
                )
              | .id
            ' <<<"$runs"
          )
          for run_id in "${stale[@]}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
            echo "Cancelled superseded repair run ${run_id}."
          done

      - name: Reverify the exact successful release gates
        shell: bash
        run: |
          set -euo pipefail
          verify_run() {
            local label="$1" run_id="$2"
            local run
            run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r .head_sha <<<"$run")" = "$SOURCE_SHA"
            test "$(jq -r .status <<<"$run")" = completed
            test "$(jq -r .conclusion <<<"$run")" = success
            echo "${label}: ${run_id} verified."
          }
          verify_run fork-ci "$FORK_CI_RUN"
          verify_run termux-control-plane "$CONTROL_RUN"
          verify_run termux-mobile-artifact "$ARTIFACT_RUN"
          verify_run termux-android-emulator "$ANDROID_RUN"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          version="$(git show "${SOURCE_SHA}:codex-rs/Cargo.toml" | awk '/^\[workspace\.package\]$/{f=1;next} /^\[/{if(f)exit} f&&/^version[[:space:]]*=/{gsub(/^[^\"]*\"|\".*$/,"");print;exit}')"
          test "$version" = "$EXPECTED_VERSION"

      - name: Download and revalidate the exact ARM64 artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$ARTIFACT_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name codex-termux-aarch64-unknown-linux-musl \
            --dir dist
          cd dist
          for file in \
            codex-termux-aarch64-unknown-linux-musl.tar.gz \
            metadata.env \
            SHA256SUMS \
            codex-termux-sbom.spdx.json; do
            test -f "$file"
          done
          sha256sum --check --strict SHA256SUMS
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' codex-termux-sbom.spdx.json
          metadata_value() {
            local key="$1" value
            value="$(sed -n "s/^${key}=//p" metadata.env)"
            test -n "$value"
            test "$(grep -c "^${key}=" metadata.env)" -eq 1
            printf '%s' "$value"
          }
          test "$(metadata_value format_version)" = 2
          test "$(metadata_value head_sha)" = "$SOURCE_SHA"
          test "$(metadata_value codex_version)" = "$EXPECTED_BINARY"
          test "$(metadata_value target)" = aarch64-unknown-linux-musl
          archive_size="$(metadata_value archive_size_bytes)"
          runtime_size="$(metadata_value runtime_size_bytes)"
          test "$archive_size" = "$(stat -c '%s' codex-termux-aarch64-unknown-linux-musl.tar.gz)"
          archive_sha="$(sha256sum codex-termux-aarch64-unknown-linux-musl.tar.gz | awk '{print $1}')"
          echo "archive_sha=${archive_sha}" >>"$GITHUB_OUTPUT"
          echo "archive_size=${archive_size}" >>"$GITHUB_OUTPUT"
          echo "runtime_size=${runtime_size}" >>"$GITHUB_OUTPUT"

      - name: Resolve an immutable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$BASE_TAG"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            if gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --dir "$existing" >/dev/null 2>&1 &&
               test -f "$existing/codex-termux-aarch64-unknown-linux-musl.tar.gz" &&
               cmp --silent dist/codex-termux-aarch64-unknown-linux-musl.tar.gz "$existing/codex-termux-aarch64-unknown-linux-musl.tar.gz"; then
              latest_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
              if [[ "$latest_tag" != "$release_tag" ]]; then
                n=1
                while gh release view "${BASE_TAG}-r${n}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do n=$((n + 1)); done
                release_tag="${BASE_TAG}-r${n}"
              fi
            else
              n=1
              while gh release view "${BASE_TAG}-r${n}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do n=$((n + 1)); done
              release_tag="${BASE_TAG}-r${n}"
            fi
          fi
          echo "release_tag=${release_tag}" >>"$GITHUB_OUTPUT"

      - name: Generate the immutable release manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          ARCHIVE_SHA: ${{ steps.artifact.outputs.archive_sha }}
          ARCHIVE_SIZE: ${{ steps.artifact.outputs.archive_size }}
          RUNTIME_SIZE: ${{ steps.artifact.outputs.runtime_size }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-manifest.env <<EOF
          format_version=2
          repository=${GITHUB_REPOSITORY}
          release_tag=${RELEASE_TAG}
          head_sha=${SOURCE_SHA}
          codex_version=${EXPECTED_BINARY}
          archive_sha256=${ARCHIVE_SHA}
          archive_size_bytes=${ARCHIVE_SIZE}
          runtime_size_bytes=${RUNTIME_SIZE}
          EOF
          sed -i 's/^          //' dist/release-manifest.env

      - name: Attest exact runtime build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
            dist/metadata.env
            dist/SHA256SUMS
            dist/codex-termux-sbom.spdx.json
            dist/release-manifest.env

      - name: Attest exact runtime SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/codex-termux-aarch64-unknown-linux-musl.tar.gz
          sbom-path: dist/codex-termux-sbom.spdx.json

      - name: Publish immutable release as GitHub Latest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            codex-termux-aarch64-unknown-linux-musl.tar.gz
            metadata.env
            SHA256SUMS
            codex-termux-sbom.spdx.json
            release-manifest.env
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for file in "${files[@]}"; do cmp --silent "dist/$file" "$existing/$file"; done
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Codex Termux ${EXPECTED_BINARY}" \
              --notes "Verified complete Termux runtime for Codex ${EXPECTED_VERSION} at exact source ${SOURCE_SHA}. Fork CI, control-plane, production ARM64 artifact, and official Termux Android validation all passed before publication." \
              --latest \
              "${files[@]/#/dist/}"
          fi

      - name: Verify anonymous public bytes and Latest identity
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          public="$(mktemp -d)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          for file in \
            codex-termux-aarch64-unknown-linux-musl.tar.gz \
            metadata.env \
            SHA256SUMS \
            codex-termux-sbom.spdx.json \
            release-manifest.env; do
            curl -fsSL --retry 12 --retry-all-errors "$base/$file" -o "$public/$file"
            cmp --silent "dist/$file" "$public/$file"
          done
          (cd "$public" && sha256sum --check --strict SHA256SUMS)
          latest="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest")"
          test "$(jq -r .tag_name <<<"$latest")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$latest")" = false
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)" = "$SOURCE_SHA"

      - name: Promote manifest and permanently repair the release channel
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          ARCHIVE_SHA: ${{ steps.artifact.outputs.archive_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp dist/release-manifest.env scripts/termux/release-manifest.env

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/termux-release-request.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced to ${main_sha}; refusing to publish stale workflow head ${GITHUB_SHA}"
            exit 1
          }
'''
          new = '''          main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            compare_json="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${main_sha}")"
            compare_status="$(jq -r .status <<<"$compare_json")"
            merge_base="$(jq -r .merge_base_commit.sha <<<"$compare_json")"
            [[ "$compare_status" == "ahead" && "$merge_base" == "$GITHUB_SHA" ]] || {
              echo "::error::main ${main_sha} is not a descendant of validated source ${GITHUB_SHA}"
              exit 1
            }
            current_request="$(mktemp)"
            gh api "/repos/${GITHUB_REPOSITORY}/contents/scripts/termux/release-request.env?ref=main" --jq .content | tr -d '\\n' | base64 --decode >"$current_request"
            cmp --silent scripts/termux/release-request.env "$current_request" || {
              echo "::error::release request changed after validation; refusing stale publication"
              exit 1
            }
          fi
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'not a descendant of validated source' not in text:
              raise SystemExit('unknown release publication guard')
          text = text.replace('--latest=false', '--latest')
          text = text.replace('/actions/workflows/${workflow}/runs?event=push&branch=main&per_page=100','/actions/workflows/${workflow}/runs?branch=main&per_page=100')
          path.write_text(text, encoding='utf-8')

          channel = '''name: termux-release-channel

on:
  workflow_run:
    workflows:
      - termux-release-request
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  verify-latest:
    if: __IF__
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: __TOKEN__
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Verify immutable Latest release identity
        shell: bash
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^release_tag=//p' scripts/termux/release-manifest.env)"
          source_sha="$(sed -n 's/^head_sha=//p' scripts/termux/release-manifest.env)"
          latest="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest")"
          test "$(jq -r .tag_name <<<"$latest")" = "$tag"
          test "$(jq -r .draft <<<"$latest")" = false
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)" = "$source_sha"
      - name: Dispatch independent governance audit
        shell: bash
        run: gh workflow run termux-governance-audit.yml --repo "$GITHUB_REPOSITORY" --ref main
'''
          d=chr(36)
          channel=channel.replace('__IF__',d+"{{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}").replace('__TOKEN__',d+'{{ github.token }}')
          Path('.github/workflows/termux-release-channel.yml').write_text(channel,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/dependabot.yaml'); lines=path.read_text().splitlines(); out=[]; active=False; seen=False
          for line in lines:
              if line.startswith('  - package-ecosystem:'):
                  if active and not seen: out.append('    open-pull-requests-limit: 0')
                  active=True; seen=False
              if active and line.strip().startswith('open-pull-requests-limit:'):
                  line='    open-pull-requests-limit: 0'; seen=True
              out.append(line)
          if active and not seen: out.append('    open-pull-requests-limit: 0')
          path.write_text('\n'.join(out)+'\n')
          PY

          audit=scripts/termux/patch_audit.tsv
          add_audit(){ grep -Fqx $'subject\t'"$1"$'\t'"$2"$'\t'"$3" "$audit" || printf 'subject\t%s\t%s\t%s\n' "$1" "$2" "$3" >>"$audit"; }
          add_audit 'ci: stage final alpha publication repair' tooling 'One-time protected-branch workflow used to repair the immutable Latest release channel and remove stale automation.'
          add_audit 'ci: stage deterministic alpha publication repair' tooling 'One-time exact-source publisher used to recover a fully validated alpha after cleanup commits advanced main.'
          add_audit 'ci: stage repository cleanup and alpha release' tooling 'Temporary protected-branch orchestration used during repository cleanup and release recovery.'
          add_audit 'chore: remove temporary alpha orchestration' tooling 'Removes temporary alpha orchestration after the maintained source update.'
          add_audit 'chore: clean temporary alpha orchestration' tooling 'Removes temporary observer and release orchestration files.'
          add_audit 'chore: remove post-alpha governance workflow' tooling 'Removes a one-time governance verification workflow after use.'
          add_audit 'ci: independently recheck promoted alpha governance' tooling 'One-time independent release-governance verification workflow.'
          add_audit 'ci: harden one-time latest-alpha orchestration' tooling 'Hardens temporary release orchestration without changing the shipped runtime.'
          add_audit 'chore: close release follow-up and sync latest alpha' tooling 'Issue and release-control maintenance only.'
          add_audit 'termux: request validated 0.149.0-alpha.1 release' tooling 'Refreshes exact-source release controls for the maintained alpha runtime.'
          add_audit 'termux: publish 0.149.0-alpha.1 and harden release channel' security-critical 'Publishes an exact source accepted by every release gate, creates immutable releases as Latest, and rejects stale non-descendant publication.'
          add_audit 'ci: record successful alpha publication' tooling 'Records the final public release identity and exact validation run evidence.'

          rm -f \
            .github/workflows/*alpha149* \
            .github/*alpha149*.trigger \
            .github/workflows/publish-latest-validated-alpha-once.yml \
            .github/publish-latest-validated-alpha.trigger \
            .github/workflows/finish-repository-cleanup-and-alpha-release-once.yml \
            .github/workflows/trigger-finish-repository-cleanup-once.yml \
            .github/workflows/observe-alpha-149-ci.yml \
            .github/workflows/observe-alpha-149-status.yml \
            .github/workflows/cancel-stale-alpha-release-runs.yml \
            .github/alpha149-publication-SUCCESS.env \
            .github/alpha149-publication-FAILURE.env

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'termux: publish 0.149.0-alpha.1 and harden release channel'
          git push origin HEAD:main

      - name: Close stale PRs and prune temporary branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.user.login == "dependabot[bot]") | [.number,.head.ref] | @tsv')
          for row in "${prs[@]}"; do
            IFS=$'\t' read -r number branch <<<"$row"
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment 'Closed as stale: verified upstream alpha integration is authoritative for this maintained Termux fork.'
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done
          mapfile -t stale < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep -E '^(observer/|dependabot/)' || true)
          for branch in "${stale[@]}"; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null; done
          test "$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '[.[]|select(.user.login=="dependabot[bot]")]|length')" = 0
          mapfile -t branches < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main

      - name: Run and verify independent governance audit
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run termux-governance-audit.yml --repo "$GITHUB_REPOSITORY" --ref main
          audit_id=""; status=""; conclusion=""
          for _ in $(seq 1 180); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/termux-governance-audit.yml/runs?event=workflow_dispatch&branch=main&per_page=30" --jq --arg before "$before" '[.workflow_runs[]|select(.created_at >= $before)]|first//{}|[(.id//""),(.status//""),(.conclusion//"")]|@tsv')"
            IFS=$'\t' read -r candidate status conclusion <<<"$state"
            if [[ -n "$candidate" ]]; then audit_id="$candidate"; [[ "$status" == completed ]] && break; fi
            sleep 10
          done
          test -n "$audit_id"
          test "$status" = completed
          test "$conclusion" = success
          echo "audit_id=${audit_id}" >>"$GITHUB_OUTPUT"

      - name: Record final verified public state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          ARCHIVE_SHA: ${{ steps.artifact.outputs.archive_sha }}
          GOVERNANCE_RUN: ${{ steps.governance.outputs.audit_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test "$(sed -n 's/^release_tag=//p' scripts/termux/release-manifest.env)" = "$RELEASE_TAG"
          test "$(sed -n 's/^head_sha=//p' scripts/termux/release-manifest.env)" = "$SOURCE_SHA"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          cat > .github/alpha149-publication-SUCCESS.env <<EOF
          status=success
          release_tag=${RELEASE_TAG}
          source_sha=${SOURCE_SHA}
          codex_version=${EXPECTED_BINARY}
          archive_sha256=${ARCHIVE_SHA}
          fork_ci_run=${FORK_CI_RUN}
          control_plane_run=${CONTROL_RUN}
          artifact_run=${ARTIFACT_RUN}
          android_run=${ANDROID_RUN}
          governance_run=${GOVERNANCE_RUN}
          open_dependabot_prs=0
          branches=main
          EOF
          sed -i 's/^          //' .github/alpha149-publication-SUCCESS.env
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/alpha149-publication-SUCCESS.env
          git commit -m 'ci: record successful alpha publication'
          git push origin HEAD:main
          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body "Verified publication repair complete: GitHub Latest and the promoted manifest now point to \`${RELEASE_TAG}\` at exact validated source \`${SOURCE_SHA}\` (\`${EXPECTED_BINARY}\`). Fork CI \`${FORK_CI_RUN}\`, control-plane \`${CONTROL_RUN}\`, ARM64 artifact \`${ARTIFACT_RUN}\`, official Termux Android \`${ANDROID_RUN}\`, anonymous downloads, attestations, and governance \`${GOVERNANCE_RUN}\` passed. Only \`main\` remains and there are zero open Dependabot PRs."
