name: finish-repository-cleanup-and-alpha-release-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finish-repository-cleanup-and-alpha-release-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finish-repository-cleanup-and-alpha-release-once
  cancel-in-progress: false

jobs:
  finish:
    name: Clean repository and publish validated alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_PATH: .github/workflows/finish-repository-cleanup-and-alpha-release-once.yml
      RELEASE_WORKFLOW: termux-release-request.yml
      RELEASE_CHANNEL_WORKFLOW: termux-release-channel.yml
      GOVERNANCE_WORKFLOW: termux-governance-audit.yml
      CONTROL_WORKFLOW: termux-control-plane.yml
      ARTIFACT_WORKFLOW: termux-mobile-artifact.yml
      ANDROID_WORKFLOW: termux-android-emulator.yml

    steps:
      - name: Checkout protected main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Prepare final release source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          lock = Path("codex-rs/Cargo.lock")
          lock_text = lock.read_text(encoding="utf-8")
          replacements = [
              (
                  '''name = "crossbeam-channel"
          version = "0.5.15"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "82b8f8f868b36967f9606790d1903570de9ceaf870a7bf9fbbd3016d636a2cb2"''',
                  '''name = "crossbeam-channel"
          version = "0.5.16"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "d85363c37faeca707aef026efa9f3b34d077bce547e48f770770625c6013679e"''',
              ),
              (
                  '''name = "regex-lite"
          version = "0.1.8"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "8d942b98df5e658f56f20d592c7f868833fe38115e65c33003d8cd224b0155da"''',
                  '''name = "regex-lite"
          version = "0.1.9"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "cab834c73d247e67f4fae452806d17d3c7501756d98c8808d7c9c7aa7d18f973"''',
              ),
          ]
          for old, new in replacements:
              count = lock_text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one lockfile match, found {count}: {old.splitlines()[0]}")
              lock_text = lock_text.replace(old, new)
          lock.write_text(lock_text, encoding="utf-8")

          dependabot = Path(".github/dependabot.yaml")
          dependabot.write_text(
              '''# Fork policy: keep routine updates reviewable and avoid flooding the
          # Android/Termux maintenance queue with unrelated upstream major upgrades.
          version: 2
          updates:
            - package-ecosystem: bun
              directory: .github/actions/codex
              schedule:
                interval: weekly
              cooldown:
                default-days: 7
            - package-ecosystem: cargo
              directories:
                - codex-rs
                - codex-rs/*
              schedule:
                interval: weekly
              cooldown:
                default-days: 7
              open-pull-requests-limit: 2
              groups:
                cargo-patches:
                  patterns:
                    - "*"
                  update-types:
                    - patch
              ignore:
                - dependency-name: "*"
                  update-types:
                    - version-update:semver-major
                    - version-update:semver-minor
            - package-ecosystem: devcontainers
              directory: /
              schedule:
                interval: weekly
              cooldown:
                default-days: 7
            - package-ecosystem: docker
              directory: codex-cli
              schedule:
                interval: weekly
              cooldown:
                default-days: 7
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
              cooldown:
                default-days: 7
              open-pull-requests-limit: 1
              groups:
                github-actions:
                  patterns:
                    - "*"
              ignore:
                - dependency-name: "*"
                  update-types:
                    - version-update:semver-major
            - package-ecosystem: rust-toolchain
              directory: codex-rs
              schedule:
                interval: weekly
              cooldown:
                default-days: 7
          ''',
              encoding="utf-8",
          )

          release = Path(".github/workflows/termux-release-request.yml")
          release_text = release.read_text(encoding="utf-8")
          start_marker = "      - name: Wait for exact native Android/Termux validation\n"
          end_marker = "      - name: Download validated aarch64 artifact\n"
          if release_text.count(start_marker) != 1 or release_text.count(end_marker) != 1:
              raise SystemExit("could not locate the Android release-gate block")
          start = release_text.index(start_marker)
          end = release_text.index(end_marker, start)
          android_gate = r'''      - name: Ensure exact native Android/Termux validation
            id: android_run
            env:
              GH_TOKEN: __GITHUB_TOKEN_EXPR__
              SOURCE_SHA: __SOURCE_SHA_EXPR__
            shell: bash
            run: |
              set -euo pipefail
              workflow="termux-android-emulator.yml"

              latest_exact_run() {
                gh api \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=100" \
                  --jq ".workflow_runs
                    | map(select(
                        .head_sha == \"${SOURCE_SHA}\"
                        and (.event == \"push\" or .event == \"workflow_dispatch\")
                      ))
                    | first // {}
                    | [(.id // \"\"), (.status // \"\"), (.conclusion // \"\")]
                    | @tsv"
              }

              run_state="$(latest_exact_run)"
              IFS=$'\t' read -r run_id status conclusion <<<"$run_state"
              if [[ -z "$run_id" ]]; then
                echo "Dispatching ${workflow} for exact source ${SOURCE_SHA}"
                gh workflow run "$workflow" \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main
              fi

              run_id=""
              for _ in $(seq 1 480); do
                run_state="$(latest_exact_run)"
                IFS=$'\t' read -r candidate_id status conclusion <<<"$run_state"
                if [[ -n "$candidate_id" ]]; then
                  run_id="$candidate_id"
                  case "$status" in
                    completed)
                      [[ "$conclusion" == "success" ]] || {
                        echo "::error::Android/Termux validation run ${run_id} concluded ${conclusion}"
                        exit 1
                      }
                      break
                      ;;
                    queued|in_progress|pending|requested|waiting)
                      ;;
                    *)
                      echo "::warning::Android/Termux run ${run_id} has status ${status:-unknown}"
                      ;;
                  esac
                fi
                sleep 15
              done

              [[ -n "$run_id" && "$status" == "completed" && "$conclusion" == "success" ]] || {
                echo "::error::No successful exact Android/Termux validation completed for ${SOURCE_SHA}"
                exit 1
              }

              resolved_sha="$(
                gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha
              )"
              [[ "$resolved_sha" == "$SOURCE_SHA" ]] || {
                echo "::error::Android run ${run_id} resolved ${resolved_sha}, expected ${SOURCE_SHA}"
                exit 1
              }

              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "Validated Android/Termux run: ${run_id}" >> "$GITHUB_STEP_SUMMARY"

          '''
          android_gate = android_gate.replace(
              "__GITHUB_TOKEN_EXPR__", "$" + "{{ github.token }}"
          ).replace(
              "__SOURCE_SHA_EXPR__", "$" + "{{ steps.request.outputs.source_sha }}"
          )
          release_text = release_text[:start] + android_gate + release_text[end:]
          if release_text.count("--latest=false") != 1:
              raise SystemExit("expected exactly one non-latest release flag")
          release_text = release_text.replace("--latest=false", "--latest")
          release.write_text(release_text, encoding="utf-8")

          channel = Path(".github/workflows/termux-release-channel.yml")
          channel_text = channel.read_text(encoding="utf-8")
          channel_start_marker = "      - name: Mark the promoted release as Latest\n"
          channel_end_marker = "      - name: Run post-promotion governance audit\n"
          if channel_text.count(channel_start_marker) != 1 or channel_text.count(channel_end_marker) != 1:
              raise SystemExit("could not locate the release-channel mutation step")
          channel_start = channel_text.index(channel_start_marker)
          channel_end = channel_text.index(channel_end_marker, channel_start)
          verify_latest = r'''      - name: Verify the promoted release is already Latest
            env:
              GH_TOKEN: __GITHUB_TOKEN_EXPR__
            shell: bash
            run: |
              set -euo pipefail
              manifest="scripts/termux/release-manifest.env"

              read_value() {
                local key="$1"
                local value
                value="$(sed -n "s/^${key}=//p" "$manifest")"
                if [[ -z "$value" || "$(grep -c "^${key}=" "$manifest")" -ne 1 ]]; then
                  echo "::error file=${manifest}::Expected exactly one non-empty ${key}= entry"
                  exit 1
                fi
                printf '%s' "$value"
              }

              repository="$(read_value repository)"
              release_tag="$(read_value release_tag)"
              head_sha="$(read_value head_sha)"
              [[ "$repository" == "$GITHUB_REPOSITORY" ]]
              [[ "$release_tag" =~ ^termux-v[0-9A-Za-z._-]+$ ]]
              [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

              release_json="$(
                gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}"
              )"
              release_target="$(jq -r .target_commitish <<<"$release_json")"
              draft="$(jq -r .draft <<<"$release_json")"
              [[ "$release_target" == "$head_sha" ]]
              [[ "$draft" == "false" ]]

              latest_tag="$(
                gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
              )"
              [[ "$latest_tag" == "$release_tag" ]] || {
                echo "::error::GitHub Latest resolved to ${latest_tag}, expected immutable release ${release_tag}"
                exit 1
              }

              {
                echo "### Termux release channel"
                echo
                echo "- Latest release: \`${release_tag}\`"
                echo "- Runtime commit: \`${head_sha}\`"
              } >> "$GITHUB_STEP_SUMMARY"

          '''
          verify_latest = verify_latest.replace(
              "__GITHUB_TOKEN_EXPR__", "$" + "{{ github.token }}"
          )
          channel_text = channel_text[:channel_start] + verify_latest + channel_text[channel_end:]
          channel.write_text(channel_text, encoding="utf-8")

          audit = Path("scripts/termux/patch_audit.tsv")
          audit_text = audit.read_text(encoding="utf-8")
          entries = [
              "subject\tci: set merged workspace alpha version explicitly\ttooling\tOne-time protected-branch merge helper maintenance; shipped runtime behavior is unchanged.\n",
              "subject\tci: resolve expected upstream workflow deletions\ttooling\tOne-time protected-branch merge conflict handling for workflows intentionally absent from this fork.\n",
              "subject\ttermux: request validated 0.149.0-alpha.1 release\ttooling\tRelease-control request only; shipped runtime source was already aligned to alpha.1.\n",
              "subject\tchore: close release follow-up and sync latest alpha\ttooling\tTemporary orchestration staging only; shipped runtime behavior is unchanged.\n",
              "subject\tci: harden one-time latest-alpha orchestration\ttooling\tTemporary orchestration hardening only; shipped runtime behavior is unchanged.\n",
              "subject\tci: independently recheck promoted alpha governance\ttooling\tOne-time governance verification only; shipped runtime behavior is unchanged.\n",
              "subject\tchore: remove post-alpha governance workflow\ttooling\tRemoves a temporary governance workflow after its check completed.\n",
              "subject\tchore: clean temporary alpha orchestration\ttooling\tRemoves temporary release orchestration after use.\n",
              "subject\tchore: remove temporary alpha orchestration\ttooling\tRemoves the remaining temporary release workflow after use.\n",
              "subject\tci: stage repository cleanup and alpha release\ttooling\tStages the one-time repository cleanup and correctly sequenced release orchestration.\n",
              "subject\tchore: consolidate dependency maintenance before alpha release\tsecurity-critical\tShips two narrow patch-level lock updates, groups future Dependabot work, and makes immutable releases Latest at creation while preserving exact-source gates.\n",
              "subject\tchore: remove one-time repository cleanup workflow\ttooling\tRemoves the temporary repository cleanup workflow after release and governance verification.\n",
          ]
          for entry in entries:
              if entry not in audit_text:
                  audit_text += entry
          audit.write_text(audit_text, encoding="utf-8")
          PY

          ruby -e 'require "yaml"; %w[.github/dependabot.yaml .github/workflows/termux-release-request.yml .github/workflows/termux-release-channel.yml].each { |path| YAML.load_file(path, aliases: true) }'
          git diff --check
          bash scripts/termux/tests/run-tests
          (
            cd codex-rs
            cargo metadata --locked --format-version=1 >/dev/null
          )

          git add \
            .github/dependabot.yaml \
            .github/workflows/termux-release-request.yml \
            .github/workflows/termux-release-channel.yml \
            codex-rs/Cargo.lock \
            scripts/termux/patch_audit.tsv
          git commit -m "chore: consolidate dependency maintenance before alpha release"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main

          release_prefix="$(sed -n 's/^release_tag_prefix=//p' scripts/termux/release-request.env)"
          release_tag="${release_prefix}-${source_sha:0:10}"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "### Final release source prepared"
            echo
            echo "- Source: \`${source_sha}\`"
            echo "- Expected release: \`${release_tag}\`"
            echo "- Included patches: crossbeam-channel 0.5.16, regex-lite 0.1.9"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve PRs, branches, release, and governance
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          wait_run() {
            local run_id="$1"
            local attempts="${2:-1200}"
            local run_json status conclusion
            for _ in $(seq 1 "$attempts"); do
              run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              status="$(jq -r .status <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              if [[ "$status" == "completed" ]]; then
                printf '%s' "$conclusion"
                return 0
              fi
              sleep 15
            done
            echo "workflow run ${run_id} did not complete" >&2
            return 1
          }

          dispatch_workflow() {
            local workflow="$1"
            shift
            local output run_id
            for _ in $(seq 1 20); do
              if output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main "$@" 2>&1)"; then
                printf '%s\n' "$output" >&2
                run_id="${output##*/}"
                if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                  printf '%s' "$run_id"
                  return 0
                fi
              else
                printf '%s\n' "$output" >&2
              fi
              sleep 3
            done
            echo "failed to dispatch ${workflow}" >&2
            return 1
          }

          close_pr() {
            local pr="$1"
            local reason="$2"
            local state
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .state)"
            if [[ "$state" == "open" ]]; then
              gh api --method POST \
                "/repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
                -f body="$reason" >/dev/null
              gh api --method PATCH \
                "/repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
                -f state=closed >/dev/null
            fi
          }

          close_pr 45 "Closing the stale pre-alpha action update. GitHub Actions updates are now grouped and major upgrades require an intentional compatibility pass against the current Termux release workflows."
          close_pr 46 "Closing the stale pre-alpha cache-action major update. Actions updates are now grouped and major upgrades require an intentional compatibility pass against the current Termux release workflows."
          close_pr 47 "Closing this stale checkout v7 major update. The current pinned checkout remains validated; major action upgrades are now excluded from routine Dependabot noise and must be tested deliberately."
          close_pr 48 "Closing this stale download-artifact v8 major update. The current pinned action remains validated; major action upgrades must be tested deliberately across the immutable release path."
          close_pr 49 "Closing the stale pre-alpha cache-action major update. Actions updates are now grouped and major upgrades require an intentional compatibility pass against the current Termux release workflows."
          close_pr 50 "Closing this uncoordinated OpenTelemetry upgrade. It introduces parallel 0.31/0.32 telemetry stacks and a new reqwest line; telemetry family upgrades must be performed together through an upstream alpha or a dedicated compatibility change."
          close_pr 51 "Superseded: the narrow crossbeam-channel 0.5.16 lock update has been incorporated into validated release source ${SOURCE_SHA}."
          close_pr 52 "Superseded: the narrow regex-lite 0.1.9 lock update has been incorporated into validated release source ${SOURCE_SHA}."
          close_pr 53 "Closing this stale pre-alpha lock update because it rewrites unrelated socket and Windows dependency resolution. A fresh grouped patch update can be evaluated against current main."
          close_pr 54 "Closing this stale pre-alpha lock update because it rewrites unrelated base64, itertools, socket and Windows dependency resolution. A fresh grouped patch update can be evaluated against current main."

          runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f per_page=100)"
          mapfile -t observer_runs < <(
            jq -r '.workflow_runs[]
              | select(.head_branch == "observer/alpha-149-ci" or .head_branch == "observer/alpha-149-status")
              | select(.status != "completed")
              | .id' <<<"$runs_json"
          )
          for run_id in "${observer_runs[@]}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
          done
          for _ in $(seq 1 60); do
            active=0
            runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f per_page=100)"
            active="$(jq '[.workflow_runs[]
              | select(.head_branch == "observer/alpha-149-ci" or .head_branch == "observer/alpha-149-status")
              | select(.status != "completed")] | length' <<<"$runs_json")"
            [[ "$active" == "0" ]] && break
            sleep 5
          done
          [[ "$active" == "0" ]] || {
            echo "observer workflows remained active after cancellation" >&2
            exit 1
          }

          delete_non_main_branches() {
            local branch
            mapfile -t branches < <(
              gh api --method GET "/repos/${GITHUB_REPOSITORY}/branches" -f per_page=100 --jq '.[].name'
            )
            for branch in "${branches[@]}"; do
              [[ "$branch" == "main" ]] && continue
              echo "Deleting branch ${branch}"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
            done
          }

          delete_non_main_branches
          sleep 10
          delete_non_main_branches
          mapfile -t remaining_branches < <(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/branches" -f per_page=100 --jq '.[].name | select(. != "main")'
          )
          (( ${#remaining_branches[@]} == 0 )) || {
            printf 'undeleted branch: %s\n' "${remaining_branches[@]}" >&2
            exit 1
          }

          stale_runs="$(
            gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${RELEASE_WORKFLOW}/runs" \
              -f branch=main -f per_page=100
          )"
          mapfile -t stale_ids < <(
            jq -r --arg sha "$SOURCE_SHA" '.workflow_runs[]
              | select(.head_sha != $sha)
              | select(.status != "completed")
              | .id' <<<"$stale_runs"
          )
          for run_id in "${stale_ids[@]}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
          done

          control_run="$(dispatch_workflow "$CONTROL_WORKFLOW")"
          artifact_run="$(dispatch_workflow "$ARTIFACT_WORKFLOW" -f source_ref="$SOURCE_SHA")"
          android_run="$(dispatch_workflow "$ANDROID_WORKFLOW")"
          release_run="$(dispatch_workflow "$RELEASE_WORKFLOW")"

          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body "## Repository cleanup and alpha publication started

Final exact source: \`${SOURCE_SHA}\`
Expected immutable release: \`${RELEASE_TAG}\`

- Control plane: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${control_run}
- ARM64 artifact: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${artifact_run}
- Android/Termux: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${android_run}
- Release publication: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${release_run}

All stale Dependabot PRs have been resolved and non-main branches have been removed before publication." >/dev/null

          release_conclusion="$(wait_run "$release_run" 1200)"
          if [[ "$release_conclusion" != "success" ]]; then
            failed_log="$(mktemp)"
            gh run view "$release_run" --repo "$GITHUB_REPOSITORY" --log-failed >"$failed_log" 2>&1 || true
            tail -n 120 "$failed_log" >"${failed_log}.tail"
            gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body-file "${failed_log}.tail" >/dev/null 2>&1 || true
            echo "release workflow ${release_run} concluded ${release_conclusion}" >&2
            exit 1
          fi

          for run_id in "$control_run" "$artifact_run" "$android_run"; do
            child_conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
            [[ "$child_conclusion" == "success" ]] || {
              echo "material workflow ${run_id} concluded ${child_conclusion}" >&2
              exit 1
            }
          done

          manifest="$(
            gh api "/repos/${GITHUB_REPOSITORY}/contents/scripts/termux/release-manifest.env?ref=main" \
              --jq .content | tr -d '\n' | base64 --decode
          )"
          manifest_value() {
            local key="$1"
            sed -n "s/^${key}=//p" <<<"$manifest"
          }
          [[ "$(manifest_value head_sha)" == "$SOURCE_SHA" ]]
          [[ "$(manifest_value release_tag)" == "$RELEASE_TAG" ]]
          [[ "$(manifest_value codex_version)" == "codex-cli ${SOURCE_SHA:0:7}" ]]
          archive_sha256="$(manifest_value archive_sha256)"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]

          latest_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" == "$RELEASE_TAG" ]] || {
            echo "Latest is ${latest_tag}, expected ${RELEASE_TAG}" >&2
            exit 1
          }

          channel_run="$(dispatch_workflow "$RELEASE_CHANNEL_WORKFLOW")"
          channel_conclusion="$(wait_run "$channel_run" 120)"
          [[ "$channel_conclusion" == "success" ]] || {
            echo "release-channel workflow ${channel_run} concluded ${channel_conclusion}" >&2
            exit 1
          }

          governance_run="$(dispatch_workflow "$GOVERNANCE_WORKFLOW")"
          governance_conclusion="$(wait_run "$governance_run" 120)"
          [[ "$governance_conclusion" == "success" ]] || {
            echo "governance workflow ${governance_run} concluded ${governance_conclusion}" >&2
            exit 1
          }

          open_prs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f per_page=100)"
          mapfile -t new_dependabot_prs < <(
            jq -r '.[] | select(.user.login == "dependabot[bot]") | .number' <<<"$open_prs"
          )
          for pr in "${new_dependabot_prs[@]}"; do
            close_pr "$pr" "Closing the immediate post-config refresh so the repository finishes this maintenance cycle cleanly. Future routine updates will return through the new grouped, bounded policy."
          done
          delete_non_main_branches
          sleep 10
          delete_non_main_branches

          open_count="$(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f per_page=100 --jq 'length'
          )"
          [[ "$open_count" == "0" ]] || {
            echo "${open_count} pull requests remain open" >&2
            exit 1
          }
          branch_count="$(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/branches" -f per_page=100 --jq '[.[].name | select(. != "main")] | length'
          )"
          [[ "$branch_count" == "0" ]] || {
            echo "${branch_count} non-main branches remain" >&2
            exit 1
          }

          workflow_meta="$(
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=main"
          )"
          workflow_sha="$(jq -r .sha <<<"$workflow_meta")"
          deletion="$(
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" \
              -f message="chore: remove one-time repository cleanup workflow" \
              -f sha="$workflow_sha" \
              -f branch=main
          )"
          cleanup_sha="$(jq -r .commit.sha <<<"$deletion")"

          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body "## Repository maintenance completed

- Latest immutable release: \`${RELEASE_TAG}\`
- Runtime source: \`${SOURCE_SHA}\`
- Binary identity: \`codex-cli ${SOURCE_SHA:0:7}\`
- Archive SHA-256: \`${archive_sha256}\`
- Release run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${release_run}
- Android validation: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${android_run}
- ARM64 artifact: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${artifact_run}
- Governance audit: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${governance_run}
- Cleanup commit: \`${cleanup_sha}\`

All Dependabot PRs from the obsolete base are closed, the two narrow lock updates were retained, future updates are grouped and bounded, and only \`main\` remains." >/dev/null

          {
            echo "### Repository maintenance complete"
            echo
            echo "- Latest release: \`${RELEASE_TAG}\`"
            echo "- Runtime source: \`${SOURCE_SHA}\`"
            echo "- Archive SHA-256: \`${archive_sha256}\`"
            echo "- Open PRs: 0"
            echo "- Non-main branches: 0"
            echo "- Cleanup commit: \`${cleanup_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report orchestration failure
        if: failure()
        shell: bash
        run: |
          set +e
          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body "## Repository cleanup or alpha publication failed

The one-time maintenance run failed before all acceptance checks completed:
${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

The workflow file has intentionally been retained on \`main\` unless the final cleanup step had already succeeded, so the failure can be inspected and repaired without recreating observer branches." >/dev/null
