name: update-latest-alpha-once
# This follow-up commit triggers the workflow after it exists on protected main.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-latest-alpha-once.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-latest-alpha-once
  cancel-in-progress: false

jobs:
  update:
    name: Merge OpenAI 0.149.0-alpha.1 into protected main
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_TAG: rust-v0.149.0-alpha.1
      TARGET_SHA: c767040aebb84b0ecdb1f8dbae092f12bf2d55af
      TARGET_VERSION: 0.149.0-alpha.1
      RELEASE_TAG_PREFIX: termux-v2026.08.19-alpha.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge verified upstream alpha and refresh release controls
        id: merge
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee "$RUNNER_TEMP/alpha-update.log") 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/openai/codex.git
          git fetch --no-tags upstream \
            "+refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}"

          resolved_target="$(git rev-list -n1 "$TARGET_TAG")"
          [[ "$resolved_target" == "$TARGET_SHA" ]] || {
            echo "Expected ${TARGET_TAG} to resolve to ${TARGET_SHA}, got ${resolved_target}" >&2
            exit 1
          }
          git merge-base --is-ancestor "$resolved_target" HEAD && {
            echo "${TARGET_TAG} is already contained in main; refusing a duplicate update." >&2
            exit 1
          }

          # Preserve the maintained Termux side when the same lines changed in
          # both histories, while accepting every non-conflicting upstream
          # change. This creates a normal two-parent merge commit, so protected
          # main advances without rewriting history or requiring a force push.
          set +e
          git merge --no-ff --no-commit -X ours "$resolved_target"
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            test -f .git/MERGE_HEAD || {
              echo "git merge failed before creating a merge state" >&2
              exit "$merge_status"
            }

            # These upstream release workflows were intentionally removed from
            # the Android/Termux fork. Upstream edited them after the fork
            # deletion, which produces modify/delete conflicts. Retain the fork
            # deletion rather than reintroducing irrelevant release machinery.
            expected_deleted_conflicts=(
              .github/workflows/python-runtime-release.yml
              .github/workflows/python-sdk-release.yml
              .github/workflows/rust-release.yml
            )
            for path in "${expected_deleted_conflicts[@]}"; do
              if git ls-files -u -- "$path" | grep -q .; then
                git rm -f -- "$path"
              fi
            done
          fi

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          if (( ${#unresolved[@]} > 0 )); then
            echo "Unresolved merge paths:" >&2
            printf '  %s\n' "${unresolved[@]}" >&2
            exit 1
          fi

          # Cargo.toml differs across the two release lines only at the
          # workspace version in the conflicted hunk. Keep the fork's other
          # manifest settings and set the verified upstream alpha explicitly.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("codex-rs/Cargo.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?ms)(^\[workspace\.package\]\n(?:.*?\n)*?^version\s*=\s*\")[^\"]+(\"\s*$)"
          )
          updated, count = pattern.subn(
              lambda match: match.group(1) + os.environ["TARGET_VERSION"] + match.group(2),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("workspace package version was not found exactly once")
          path.write_text(updated, encoding="utf-8")
          PY

          package_version="$(
            awk '
              /^\[workspace\.package\]$/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' codex-rs/Cargo.toml
          )"
          [[ "$package_version" == "$TARGET_VERSION" ]] || {
            echo "Merged workspace version is ${package_version:-missing}, expected ${TARGET_VERSION}" >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import os

          request = Path("scripts/termux/release-request.env")
          request.write_text(
              "format_version=3\n"
              "source_mode=workflow-head\n"
              f"release_tag_prefix={os.environ['RELEASE_TAG_PREFIX']}\n"
              f"expected_package_version={os.environ['TARGET_VERSION']}\n",
              encoding="utf-8",
          )
          PY

          # Refresh the complete dependency graph for the new workspace
          # version, then prove that the resulting lockfile is self-consistent.
          (
            cd codex-rs
            cargo metadata --format-version=1 >/dev/null
            cargo metadata --locked --format-version=1 >/dev/null
          )

          git rm .github/workflows/update-latest-alpha-once.yml
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo "The alpha update produced no tree changes." >&2
            exit 1
          }

          git commit -m "termux: update to ${TARGET_VERSION}"
          new_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"
          echo "Updated protected main to ${new_sha} from ${TARGET_TAG}." >> "$GITHUB_STEP_SUMMARY"

      - name: Report update failure to issue 44
        if: failure()
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/alpha-update-failure.md"
          {
            echo "## Automated alpha update failed"
            echo
            echo "Target: \`${TARGET_TAG}\` (\`${TARGET_SHA}\`)"
            echo "Workflow source: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            git status --short 2>&1
            git diff --name-only --diff-filter=U 2>&1
            tail -n 180 "$RUNNER_TEMP/alpha-update.log" 2>&1
            echo '```'
          } > "$report"
          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body-file "$report"
