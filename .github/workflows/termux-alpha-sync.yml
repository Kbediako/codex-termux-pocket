name: termux-alpha-sync
run-name: Merge upstream ${{ inputs.alpha_tag || 'rust-v0.148.0-alpha.20' }} into the Termux candidate

on:
  push:
    branches:
      - agent/termux-hardening-alpha-20
    paths:
      - ".github/workflows/termux-alpha-sync.yml"
  workflow_dispatch:
    inputs:
      alpha_tag:
        description: Exact upstream alpha tag
        required: false
        default: rust-v0.148.0-alpha.20

permissions:
  contents: write
  actions: write

concurrency:
  group: termux-alpha-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_TAG: ${{ inputs.alpha_tag || 'rust-v0.148.0-alpha.20' }}
      TARGET_BRANCH: agent/termux-hardening-alpha-20
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the candidate branch with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the exact upstream alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/openai/codex.git
          git fetch --no-tags upstream "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}"

          set +e
          git merge --no-ff --no-commit "$TARGET_TAG"
          merge_status=$?
          set -e
          if (( merge_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
            expected=(codex-rs/Cargo.toml codex-rs/cli/src/main.rs)
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              echo "::error::Unexpected alpha merge conflicts; refusing an automatic resolution."
              printf 'Conflicted files (%d):\n' "${#conflicts[@]}"
              printf '  %s\n' "${conflicts[@]}"
              for path in "${conflicts[@]}"; do
                echo "::group::Conflict: $path"
                git diff --cc -- "$path" | sed -n '1,500p'
                echo "::endgroup::"
              done
              git merge --abort
              exit 2
            fi

            # The workspace version must come from the exact upstream alpha.
            git checkout --theirs -- codex-rs/Cargo.toml

            # Preserve the fork's compile-time version command while adopting
            # alpha.20's newer MultitoolCli shape, which removed the root PSP field.
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("codex-rs/cli/src/main.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace("        psp,\n", "", 1)
          pattern = re.compile(
              r"<<<<<<< HEAD\n"
              r"    \} = MultitoolCli::from_arg_matches\(&matches\)\.unwrap_or_else\(\|err\| err\.exit\(\)\);\n"
              r"    interactive\.psp = psp;\n\n"
              r"=======\n"
              r"    \} = MultitoolCli::parse\(\);\n"
              r">>>>>>> [^\n]+\n"
          )
          text, replacements = pattern.subn(
              "    } = MultitoolCli::from_arg_matches(&matches).unwrap_or_else(|err| err.exit());\n",
              text,
              count=1,
          )
          if replacements != 1 or "<<<<<<<" in text or ">>>>>>>" in text:
              raise SystemExit("failed to resolve the expected CLI merge conflict exactly")
          path.write_text(text, encoding="utf-8")
          PY
            git add codex-rs/Cargo.toml codex-rs/cli/src/main.rs
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved files remain after the exact conflict resolution."
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 2
            fi
          fi

          git commit -m "Merge upstream ${TARGET_TAG} for Termux"
          CODEX_SRC_DIR="$GITHUB_WORKSPACE" \
            bash scripts/termux/maintainer-update-alpha --lock-only
          if ! git diff --quiet -- codex-rs/Cargo.lock MODULE.bazel.lock; then
            subject="termux: refresh lockfile after ${TARGET_TAG#rust-v} merge"
            if ! awk -F '\t' -v subject="$subject" '$1 == "subject" && $2 == subject { found=1 } END { exit !found }' \
                scripts/termux/patch_audit.tsv; then
              printf 'subject\t%s\tbuild-only\tRefreshes the complete workspace and target-specific dependency graph after merging the maintained Termux patch stack with the upstream alpha.\n' \
                "$subject" >> scripts/termux/patch_audit.tsv
            fi
            git add codex-rs/Cargo.lock MODULE.bazel.lock scripts/termux/patch_audit.tsv
            git commit -m "$subject"
          fi

      - name: Validate merged control plane
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/termux/install-codex-termux
          bash -n scripts/termux/codex-update-alpha
          bash -n scripts/termux/maintainer-update-alpha
          bash -n scripts/termux/smoke-test-artifact
          bash -n scripts/termux/termux-mobile-lib.sh
          bash scripts/termux/tests/run-tests
          (cd codex-rs && cargo metadata --locked --format-version=1 >/dev/null)
          git diff --check

      - name: Publish and dispatch hosted validation
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          new_sha="$(git rev-parse HEAD)"
          printf 'Merged candidate: %s\n' "$new_sha"
          gh workflow run termux-mobile-artifact.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$new_sha"
          gh workflow run termux-linux-sandbox.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$new_sha"
