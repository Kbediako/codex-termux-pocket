name: termux-alpha-sync
run-name: Sync Termux patch stack to ${{ inputs.alpha_tag || 'rust-v0.148.0-alpha.20' }}

on:
  push:
    branches:
      - agent/termux-hardening-alpha-20
    paths:
      - ".github/workflows/termux-alpha-sync.yml"
  workflow_dispatch:
    inputs:
      alpha_tag:
        description: Exact upstream alpha tag
        required: false
        default: rust-v0.148.0-alpha.20

permissions:
  contents: write
  actions: write

concurrency:
  group: termux-alpha-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_TAG: ${{ inputs.alpha_tag || 'rust-v0.148.0-alpha.20' }}
      TARGET_BRANCH: agent/termux-hardening-alpha-20
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the candidate branch with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase the audited Termux patch stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B main "$GITHUB_SHA"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/openai/codex.git
          git fetch --prune upstream main 'refs/tags/rust-v*:refs/tags/rust-v*'
          CODEX_SRC_DIR="$GITHUB_WORKSPACE" \
            bash scripts/termux/maintainer-update-alpha --tag "$TARGET_TAG"

          if ! git diff --quiet -- codex-rs/Cargo.lock MODULE.bazel.lock; then
            subject="termux: refresh lockfile after ${TARGET_TAG#rust-v} rebase"
            if ! awk -F '\t' -v subject="$subject" '$1 == "subject" && $2 == subject { found=1 } END { exit !found }' \
                scripts/termux/patch_audit.tsv; then
              printf 'subject\t%s\tbuild-only\tRefreshes the complete workspace and target-specific dependency graph after rebasing the maintained Termux patch stack.\n' \
                "$subject" >> scripts/termux/patch_audit.tsv
            fi
            git add codex-rs/Cargo.lock MODULE.bazel.lock scripts/termux/patch_audit.tsv
            git commit -m "$subject"
          fi

      - name: Validate rebased control plane
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/termux/install-codex-termux
          bash -n scripts/termux/codex-update-alpha
          bash -n scripts/termux/maintainer-update-alpha
          bash -n scripts/termux/smoke-test-artifact
          bash -n scripts/termux/termux-mobile-lib.sh
          bash scripts/termux/tests/run-tests
          (cd codex-rs && cargo metadata --locked --format-version=1 >/dev/null)
          git diff --check

      - name: Publish the rebased candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
          new_sha="$(git rev-parse HEAD)"
          printf 'Rebased candidate: %s\n' "$new_sha"
          gh workflow run termux-mobile-artifact.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$new_sha"
          gh workflow run termux-linux-sandbox.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$new_sha"
