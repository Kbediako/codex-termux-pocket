name: termux-alpha-sync
run-name: Merge upstream ${{ inputs.alpha_tag || 'rust-v0.148.0-alpha.20' }} into the Termux candidate

on:
  push:
    branches:
      - agent/termux-hardening-alpha-20
    paths:
      - ".github/workflows/termux-alpha-sync.yml"
  workflow_dispatch:
    inputs:
      alpha_tag:
        description: Exact upstream alpha tag
        required: false
        default: rust-v0.148.0-alpha.20

permissions:
  contents: write
  actions: write

concurrency:
  group: termux-alpha-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TARGET_TAG: ${{ inputs.alpha_tag || 'rust-v0.148.0-alpha.20' }}
      TARGET_BRANCH: agent/termux-hardening-alpha-20
      GH_TOKEN: ${{ github.token }}
      PREFIX: /data/data/com.termux/files/usr
      TERMUX_APK_RELEASE: F_DROID
    steps:
      - name: Checkout the candidate branch with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Simulate the Termux bash path
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$PREFIX/bin"
          sudo ln -sfn /usr/bin/bash "$PREFIX/bin/bash"

      - name: Merge the exact upstream alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          base_sha="$(git rev-parse HEAD)"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/openai/codex.git
          git fetch --no-tags upstream "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}"
          target_sha="$(git rev-parse "${TARGET_TAG}^{commit}")"
          target_version="${TARGET_TAG#rust-v}"
          export TARGET_VERSION="$target_version"

          set +e
          git merge --no-ff --no-commit "$TARGET_TAG"
          merge_status=$?
          set -e
          if (( merge_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
            expected=(codex-rs/Cargo.toml codex-rs/cli/src/main.rs)
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              echo "::error::Unexpected alpha merge conflicts; refusing an automatic resolution."
              printf 'Conflicted files (%d):\n' "${#conflicts[@]}"
              printf '  %s\n' "${conflicts[@]}"
              for path in "${conflicts[@]}"; do
                echo "::group::Conflict: $path"
                git diff --cc -- "$path" | sed -n '1,500p'
                echo "::endgroup::"
              done
              git merge --abort
              exit 2
            fi

            python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          target_version = os.environ["TARGET_VERSION"]

          cargo = Path("codex-rs/Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          cargo_pattern = re.compile(
              r'<<<<<<< HEAD\n'
              r'version = "[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+"\n'
              r'=======\n'
              r'version = "' + re.escape(target_version) + r'"\n'
              r'>>>>>>> [^\n]+\n'
          )
          cargo_text, cargo_replacements = cargo_pattern.subn(
              lambda _match: f'version = "{target_version}"\n',
              cargo_text,
              count=1,
          )
          if cargo_replacements != 1 or "<<<<<<<" in cargo_text or ">>>>>>>" in cargo_text:
              raise SystemExit("failed to resolve the exact workspace-version conflict")
          cargo.write_text(cargo_text, encoding="utf-8")

          cli = Path("codex-rs/cli/src/main.rs")
          cli_text = cli.read_text(encoding="utf-8")
          psp_line = "        psp,\n"
          if cli_text.count(psp_line) != 1:
              raise SystemExit("expected one root PSP destructuring line")
          cli_text = cli_text.replace(psp_line, "", 1)
          cli_pattern = re.compile(
              r"<<<<<<< HEAD\n"
              r"    \} = MultitoolCli::from_arg_matches\(&matches\)\.unwrap_or_else\(\|err\| err\.exit\(\)\);\n"
              r"    interactive\.psp = psp;\n\n"
              r"=======\n"
              r"    \} = MultitoolCli::parse\(\);\n"
              r">>>>>>> [^\n]+\n"
          )
          cli_text, cli_replacements = cli_pattern.subn(
              lambda _match: "    } = MultitoolCli::from_arg_matches(&matches).unwrap_or_else(|err| err.exit());\n",
              cli_text,
              count=1,
          )
          if cli_replacements != 1 or "<<<<<<<" in cli_text or ">>>>>>>" in cli_text:
              raise SystemExit("failed to resolve the exact CLI merge conflict")
          cli.write_text(cli_text, encoding="utf-8")
          PY
            git add codex-rs/Cargo.toml codex-rs/cli/src/main.rs
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved files remain after the exact conflict resolution."
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 2
            fi
          fi

          # The branch's reviewed workflows remain authoritative for the fork.
          # This also keeps GITHUB_TOKEN from attempting a workflow-file write.
          git restore --source="$base_sha" --staged --worktree -- .github/workflows

          cat > scripts/termux/upstream-alpha.env <<EOF
          format_version=1
          tag=${TARGET_TAG}
          commit=${target_sha}
          EOF
          git add scripts/termux/upstream-alpha.env
          git commit -m "Merge upstream ${TARGET_TAG} for Termux"

          CODEX_SRC_DIR="$GITHUB_WORKSPACE" \
            bash scripts/termux/maintainer-update-alpha --lock-only
          if ! git diff --quiet -- codex-rs/Cargo.lock MODULE.bazel.lock; then
            subject="termux: refresh lockfile after ${TARGET_TAG#rust-v} merge"
            if ! awk -F '\t' -v subject="$subject" '$1 == "subject" && $2 == subject { found=1 } END { exit !found }' \
                scripts/termux/patch_audit.tsv; then
              printf 'subject\t%s\tbuild-only\tRefreshes the complete workspace and target-specific dependency graph after merging the maintained Termux patch stack with the upstream alpha.\n' \
                "$subject" >> scripts/termux/patch_audit.tsv
            fi
            git add codex-rs/Cargo.lock MODULE.bazel.lock scripts/termux/patch_audit.tsv
            git commit -m "$subject"
          fi

      - name: Validate merged control plane
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/termux/codex-cargo-check
            scripts/termux/codex-update-alpha
            scripts/termux/install-codex-termux
            scripts/termux/maintainer-update-alpha
            scripts/termux/smoke-test-artifact
            scripts/termux/termux-mobile-lib.sh
            scripts/termux/tests/run-tests
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          bash scripts/termux/tests/run-tests
          (cd codex-rs && cargo metadata --locked --format-version=1 >/dev/null)
          test "$(sed -n 's/^tag=//p' scripts/termux/upstream-alpha.env)" = "$TARGET_TAG"
          test "$(sed -n 's/^commit=//p' scripts/termux/upstream-alpha.env)" = \
            "$(git rev-parse "${TARGET_TAG}^{commit}")"
          git merge-base --is-ancestor "${TARGET_TAG}^{commit}" HEAD
          git diff --check

      - name: Publish and dispatch hosted validation
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          new_sha="$(git rev-parse HEAD)"
          printf 'Merged candidate: %s\n' "$new_sha"
          gh workflow run termux-mobile-artifact.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f source_ref="$new_sha"
          gh workflow run termux-linux-sandbox.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f source_ref="$new_sha"
