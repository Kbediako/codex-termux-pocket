name: termux-android-emulator
run-name: Native Termux validation for ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/termux-android-emulator-check.sh"
      - ".github/scripts/termux-android-emulator-noninteractive.sh"
      - ".github/workflows/termux-android-emulator.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: termux-android-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-termux:
    name: Real Termux app on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: 976d1798cd03427e3ca37a614b236042868a635f
      EXPECTED_PACKAGE_VERSION: 0.148.0-alpha.20
      CONTROL_SHA: ${{ github.sha }}
      FIXTURE_RUN_ID: "31932665977"
      TERMUX_APK_NAME: termux-app_v0.118.3+github-debug_x86_64.apk
      TERMUX_APK_URL: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk
      TERMUX_SUMS_URL: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_sha256sums

    steps:
      - name: Checkout validation controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact verified emulator fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-emulator
          gh run download "$FIXTURE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name codex-termux-android-emulator-fixture \
            --dir dist/android-emulator

      - name: Verify fixture source identity
        shell: bash
        run: |
          set -euo pipefail
          fixture=dist/android-emulator/fixture.env
          test -f "$fixture"
          test "$(sed -n 's/^source_sha=//p' "$fixture")" = "$SOURCE_SHA"
          test "$(sed -n 's/^package_version=//p' "$fixture")" = "$EXPECTED_PACKAGE_VERSION"
          test "$(grep -c '^source_sha=' "$fixture")" -eq 1
          test "$(grep -c '^package_version=' "$fixture")" -eq 1
          for name in previous current broken lowspace; do
            test -f "dist/android-emulator/${name}/release-manifest.env"
            test -f "dist/android-emulator/${name}/codex-termux-aarch64-unknown-linux-musl.tar.gz"
          done

      - name: Download and verify official Termux debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          curl -fsSL "$TERMUX_APK_URL" -o "apk/$TERMUX_APK_NAME"
          curl -fsSL "$TERMUX_SUMS_URL" -o apk/SHA256SUMS
          grep -F "$TERMUX_APK_NAME" apk/SHA256SUMS >/dev/null
          (
            cd apk
            sha256sum --check --strict --ignore-missing SHA256SUMS
          )
          echo "TERMUX_APK=${GITHUB_WORKSPACE}/apk/${TERMUX_APK_NAME}" >>"$GITHUB_ENV"
          echo "EMULATOR_DIST=${GITHUB_WORKSPACE}/dist/android-emulator" >>"$GITHUB_ENV"

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run native Android and Termux validation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/termux-android-emulator-noninteractive.sh

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: termux-android-native-validation-evidence
          path: android-termux-logs/
          if-no-files-found: warn
          retention-days: 30
