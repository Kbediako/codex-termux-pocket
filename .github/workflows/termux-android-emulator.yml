name: termux-android-emulator
run-name: Release/manual native Termux validation for ${{ github.sha }}

# The real Android app is an expensive release/device gate, not routine CI.
# It runs automatically with a release request, self-validates changes to this
# gate, and remains available manually.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/termux/release-request.env"
      - ".github/workflows/termux-android-emulator.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: termux-android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-emulator-fixture:
    name: Build fixture from triggering source
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      package_version: ${{ steps.source.outputs.package_version }}
    defaults:
      run:
        working-directory: codex-rs
    env:
      TARGET: x86_64-unknown-linux-musl
      ZIG_VERSION: "0.14.0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      RUSTY_V8_VERSION: "150.4.0"
      RUSTY_V8_ARCHIVE_SHA256: "694faa7c6136d3218862df62c29f3785cbcce241977da3183ddadabf09040ddf"
      RUSTY_V8_BINDING_SHA256: "7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506"

    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve source identity and package version
        id: source
        env:
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$CONTROL_SHA"
          package_version="$(
            awk '
              /^\[workspace\.package\]$/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )"
          test -n "$package_version"
          cargo metadata --locked --format-version=1 >/dev/null
          echo "source_sha=${source_sha}" >>"$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >>"$GITHUB_OUTPUT"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends libubsan1 python3

      - name: Install pinned Rust toolchain target
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Use hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home-emulator"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >>"$GITHUB_ENV"
          echo "${cargo_home}/bin" >>"$GITHUB_PATH"
          : >"${cargo_home}/config.toml"

      - name: Restore Cargo dependency cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ${{ github.workspace }}/.cargo-home-emulator/registry/index/
            ${{ github.workspace }}/.cargo-home-emulator/registry/cache/
            ${{ github.workspace }}/.cargo-home-emulator/git/db/
          key: termux-emulator-cargo-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            termux-emulator-cargo-${{ runner.os }}-${{ env.TARGET }}-

      - name: Install Zig and musl build tools
        env:
          APT_INSTALL_ARGS: --no-install-recommends
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-zig.sh"
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure host runtime and clear sanitizer flags
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper="${RUNNER_TEMP}/rustc-ubsan-wrapper"
          cat >"$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod 0755 "$wrapper"
          {
            echo "RUSTC_WRAPPER=${wrapper}"
            echo "RUSTC_WORKSPACE_WRAPPER="
            echo "RUSTFLAGS="
            echo "CARGO_ENCODED_RUSTFLAGS="
            echo "RUSTDOCFLAGS="
            echo "CARGO_BUILD_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="
          } >>"$GITHUB_ENV"
          sanitize() {
            local value="$1"
            value="${value//-fsanitize=undefined/}"
            value="${value//-fno-sanitize-recover=undefined/}"
            value="${value//-fno-sanitize-trap=undefined/}"
            printf '%s' "$value"
          }
          echo "CFLAGS=$(sanitize "${CFLAGS-}")" >>"$GITHUB_ENV"
          echo "CXXFLAGS=$(sanitize "${CXXFLAGS-}")" >>"$GITHUB_ENV"

      - name: Download and verify x86_64 Rusty V8 inputs
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(
            python3 "${GITHUB_WORKSPACE}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version
          )"
          test "$resolved" = "$RUSTY_V8_VERSION"
          base="https://github.com/openai/codex/releases/download/rusty-v8-v${resolved}"
          input_dir="${RUNNER_TEMP}/rusty-v8-x86_64"
          archive="${input_dir}/librusty_v8_release_${TARGET}.a.gz"
          binding="${input_dir}/src_binding_release_${TARGET}.rs"
          mkdir -p "$input_dir"
          curl -fsSL "${base}/librusty_v8_release_${TARGET}.a.gz" -o "$archive"
          curl -fsSL "${base}/src_binding_release_${TARGET}.rs" -o "$binding"
          printf '%s  %s\n' "$RUSTY_V8_ARCHIVE_SHA256" "$archive" |
            sha256sum --check --strict
          printf '%s  %s\n' "$RUSTY_V8_BINDING_SHA256" "$binding" |
            sha256sum --check --strict
          echo "RUSTY_V8_ARCHIVE=${archive}" >>"$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding}" >>"$GITHUB_ENV"

      - name: Restore compiled target cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            codex-rs/target/.rustc_info.json
            codex-rs/target/release/.fingerprint/
            codex-rs/target/release/build/
            codex-rs/target/release/deps/
            codex-rs/target/x86_64-unknown-linux-musl/.rustc_info.json
            codex-rs/target/x86_64-unknown-linux-musl/release/.fingerprint/
            codex-rs/target/x86_64-unknown-linux-musl/release/build/
            codex-rs/target/x86_64-unknown-linux-musl/release/deps/
            codex-rs/target/x86_64-unknown-linux-musl/release/gn_out/obj/
          key: termux-emulator-target-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ steps.source.outputs.source_sha }}
          restore-keys: |
            termux-emulator-target-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-

      - name: Build deterministic emulator fixture
        env:
          SOURCE_DIR: ${{ github.workspace }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.source.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-termux-android-emulator-fixture.sh"

      - name: Verify staged fixture identity
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.source.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="${GITHUB_WORKSPACE}/dist/android-emulator/fixture.env"
          test -f "$fixture"
          test "$(sed -n 's/^source_sha=//p' "$fixture")" = "$SOURCE_SHA"
          test "$(sed -n 's/^package_version=//p' "$fixture")" = "$EXPECTED_PACKAGE_VERSION"

      - name: Upload Android emulator fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-termux-android-emulator-fixture
          path: dist/android-emulator/
          if-no-files-found: error
          retention-days: 7

      - name: Save Cargo dependency cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ${{ github.workspace }}/.cargo-home-emulator/registry/index/
            ${{ github.workspace }}/.cargo-home-emulator/registry/cache/
            ${{ github.workspace }}/.cargo-home-emulator/git/db/
          key: termux-emulator-cargo-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}

      - name: Save compiled target cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            codex-rs/target/.rustc_info.json
            codex-rs/target/release/.fingerprint/
            codex-rs/target/release/build/
            codex-rs/target/release/deps/
            codex-rs/target/x86_64-unknown-linux-musl/.rustc_info.json
            codex-rs/target/x86_64-unknown-linux-musl/release/.fingerprint/
            codex-rs/target/x86_64-unknown-linux-musl/release/build/
            codex-rs/target/x86_64-unknown-linux-musl/release/deps/
            codex-rs/target/x86_64-unknown-linux-musl/release/gn_out/obj/
          key: termux-emulator-target-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ steps.source.outputs.source_sha }}

  native-termux:
    name: Real Termux app on Android emulator
    needs: build-emulator-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ needs.build-emulator-fixture.outputs.source_sha }}
      EXPECTED_PACKAGE_VERSION: ${{ needs.build-emulator-fixture.outputs.package_version }}
      CONTROL_SHA: ${{ github.sha }}
      TERMUX_APK_NAME: termux-app_v0.118.3+github-debug_x86_64.apk
      TERMUX_APK_URL: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk
      TERMUX_SUMS_URL: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_sha256sums

    steps:
      - name: Checkout validation controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The fixture must come from this workflow run. Reusing a historical
      # artifact can make a green native job validate an older runtime.
      - name: Download exact fixture built by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-termux-android-emulator-fixture
          path: dist/android-emulator

      - name: Verify fixture source identity
        shell: bash
        run: |
          set -euo pipefail
          fixture=dist/android-emulator/fixture.env
          test -f "$fixture"
          test "$(sed -n 's/^source_sha=//p' "$fixture")" = "$SOURCE_SHA"
          test "$(sed -n 's/^package_version=//p' "$fixture")" = "$EXPECTED_PACKAGE_VERSION"
          test "$(grep -c '^source_sha=' "$fixture")" -eq 1
          test "$(grep -c '^package_version=' "$fixture")" -eq 1
          for name in previous current broken lowspace; do
            test -f "dist/android-emulator/${name}/release-manifest.env"
            test -f "dist/android-emulator/${name}/codex-termux-aarch64-unknown-linux-musl.tar.gz"
          done

      - name: Download and verify official Termux debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          curl -fsSL "$TERMUX_APK_URL" -o "apk/$TERMUX_APK_NAME"
          curl -fsSL "$TERMUX_SUMS_URL" -o apk/SHA256SUMS
          grep -F "$TERMUX_APK_NAME" apk/SHA256SUMS >/dev/null
          (
            cd apk
            sha256sum --check --strict --ignore-missing SHA256SUMS
          )
          echo "TERMUX_APK=${GITHUB_WORKSPACE}/apk/${TERMUX_APK_NAME}" >>"$GITHUB_ENV"
          echo "EMULATOR_DIST=${GITHUB_WORKSPACE}/dist/android-emulator" >>"$GITHUB_ENV"

      - name: Prepare KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-termux-logs
          {
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'virtualization_flags=%s\n' "$(grep -m1 -oE 'vmx|svm' /proc/cpuinfo | tr '\n' ',' || true)"

            if [[ ! -e /dev/kvm ]]; then
              sudo modprobe kvm 2>/dev/null || true
              if grep -qw vmx /proc/cpuinfo; then
                sudo modprobe kvm_intel 2>/dev/null || true
              elif grep -qw svm /proc/cpuinfo; then
                sudo modprobe kvm_amd 2>/dev/null || true
              fi
            fi

            if [[ -e /dev/kvm ]]; then
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
                sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm || true
              sudo chmod 0666 /dev/kvm
              ls -l /dev/kvm
              test -r /dev/kvm
              test -w /dev/kvm
              echo 'kvm=available'
            else
              echo 'kvm=unavailable'
              echo '::warning::/dev/kvm is unavailable on this hosted runner; the Android emulator will use software acceleration.'
            fi
          } 2>&1 | tee android-termux-logs/kvm-preflight.log

      - name: Run native Android and Termux validation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          emulator-boot-timeout: 1800
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/termux-android-emulator-noninteractive.sh

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: termux-android-native-validation-evidence
          path: android-termux-logs/
          if-no-files-found: warn
          retention-days: 30
