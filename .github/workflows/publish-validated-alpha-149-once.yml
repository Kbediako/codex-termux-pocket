name: publish-validated-alpha-149-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-validated-alpha-149-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: publish-validated-alpha-149-once
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact validated 0.149.0-alpha.1 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 329147e2fab2ddf5f9e8e607efc2a3ba1f5f712c
      PACKAGE_VERSION: 0.149.0-alpha.1
      RELEASE_TAG: termux-v2026.08.19-alpha.1-329147e2fa
      EXPECTED_CODEX_VERSION: codex-cli 329147e
      CONTROL_RUN_ID: "32209449072"
      ARTIFACT_RUN_ID: "32209918341"
      ANDROID_RUN_ID: "32209449113"
      SELF_PATH: .github/workflows/publish-validated-alpha-149-once.yml

    steps:
      - name: Checkout protected main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Record publication start
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body \
            "Validated 0.149.0-alpha.1 publication started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Make the permanent release flow durable and remove stale orchestration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

          python3 - <<'PY'
          from pathlib import Path

          release_path = Path('.github/workflows/termux-release-request.yml')
          text = release_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '      - "scripts/termux/release-request.env"\n'
              '      - ".github/workflows/termux-release-request.yml"\n',
              '      - "scripts/termux/release-request.env"\n',
              'release self-trigger',
          )
          replace_once(
              '''          main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced to ${main_sha}; refusing to publish stale workflow head ${GITHUB_SHA}"
            exit 1
          }
''',
              '''          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha" || {
            echo "::error::Validated source ${GITHUB_SHA} is not an ancestor of current main ${main_sha}"
            exit 1
          }
''',
              'main ancestry gate',
          )
          replace_once(
              '              --latest=false \\\n',
              '              --latest \\\n',
              'Latest creation flag',
          )
          replace_once(
              '''          fi

      - name: Verify anonymous public release downloads
''',
              '''          fi

          latest_tag="$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          )"
          [[ "$latest_tag" == "$RELEASE_TAG" ]] || {
            echo "::error::GitHub Latest resolved to ${latest_tag}, expected ${RELEASE_TAG}"
            exit 1
          }

      - name: Verify anonymous public release downloads
''',
              'Latest verification gate',
          )
          release_path.write_text(text, encoding='utf-8')

          channel_path = Path('.github/workflows/termux-release-channel.yml')
          channel_path.write_text('''name: termux-release-channel
run-name: Verify validated Termux release channel

# The release publisher marks a validated release as Latest in the same create
# operation. This workflow only verifies that the immutable release, promoted
# manifest, and GitHub Latest pointer agree, then launches the governance audit.
on:
  workflow_run:
    workflows:
      - termux-release-request
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: termux-release-channel
  cancel-in-progress: true

jobs:
  verify-latest:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify promoted runtime is Latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout promoted main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify the promoted release is Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="scripts/termux/release-manifest.env"

          read_value() {
            local key="$1"
            local value
            value="$(sed -n "s/^${key}=//p" "$manifest")"
            if [[ -z "$value" || "$(grep -c "^${key}=" "$manifest")" -ne 1 ]]; then
              echo "::error file=${manifest}::Expected exactly one non-empty ${key}= entry"
              exit 1
            fi
            printf '%s' "$value"
          }

          repository="$(read_value repository)"
          release_tag="$(read_value release_tag)"
          head_sha="$(read_value head_sha)"
          [[ "$repository" == "$GITHUB_REPOSITORY" ]]
          [[ "$release_tag" =~ ^termux-v[0-9A-Za-z._-]+$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          release_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}"
          )"
          release_target="$(jq -r .target_commitish <<<"$release_json")"
          draft="$(jq -r .draft <<<"$release_json")"
          [[ "$release_target" == "$head_sha" ]]
          [[ "$draft" == "false" ]]

          latest_tag="$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          )"
          [[ "$latest_tag" == "$release_tag" ]] || {
            echo "::error::GitHub Latest resolved to ${latest_tag}, expected ${release_tag}"
            exit 1
          }

          {
            echo "### Termux release channel"
            echo
            echo "- Latest release: \\`${release_tag}\\`"
            echo "- Runtime commit: \\`${head_sha}\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run post-promotion governance audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run termux-governance-audit.yml \\
            --repo "$GITHUB_REPOSITORY" \\
            --ref main
''', encoding='utf-8')
          PY

          rm -f \
            .github/workflows/finish-repository-cleanup-and-alpha-release-once.yml \
            .github/workflows/repair-release-and-clean-repo-once.yml \
            .github/workflows/trigger-finish-repository-cleanup-once.yml \
            .github/workflows/update-latest-alpha-once.yml \
            .github/scripts/repair-release-and-clean-repo-once.sh \
            .github/repair-release-go

          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/termux-release-request.yml", aliases: true); YAML.load_file(".github/workflows/termux-release-channel.yml", aliases: true)'
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(termux): make validated alpha publication durable"
            git push origin HEAD:main
          fi

      - name: Verify prior exact-source gates and publish immutable release
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          verify_run() {
            local run_id="$1"
            local label="$2"
            local run_json
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r .head_sha <<<"$run_json")" == "$SOURCE_SHA" ]] || {
              echo "::error::${label} run ${run_id} validated a different source"
              exit 1
            }
            [[ "$(jq -r .status <<<"$run_json")" == "completed" ]]
            [[ "$(jq -r .conclusion <<<"$run_json")" == "success" ]] || {
              echo "::error::${label} run ${run_id} was not successful"
              exit 1
            }
          }

          verify_run "$CONTROL_RUN_ID" "Termux control-plane"
          verify_run "$ARTIFACT_RUN_ID" "ARM64 artifact"
          verify_run "$ANDROID_RUN_ID" "Android/Termux"

          rm -rf dist
          mkdir -p dist
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name codex-termux-aarch64-unknown-linux-musl \
            --dir dist

          cd dist
          for file in \
            codex-termux-aarch64-unknown-linux-musl.tar.gz \
            metadata.env \
            SHA256SUMS \
            codex-termux-sbom.spdx.json; do
            [[ -f "$file" ]] || { echo "::error::Missing ${file}"; exit 1; }
          done
          sha256sum --check --strict SHA256SUMS
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' codex-termux-sbom.spdx.json

          metadata_value() {
            local key="$1"
            local value
            value="$(sed -n "s/^${key}=//p" metadata.env)"
            [[ -n "$value" && "$(grep -c "^${key}=" metadata.env)" -eq 1 ]]
            printf '%s' "$value"
          }

          head_sha="$(metadata_value head_sha)"
          codex_version="$(metadata_value codex_version)"
          target="$(metadata_value target)"
          archive_size_bytes="$(metadata_value archive_size_bytes)"
          runtime_size_bytes="$(metadata_value runtime_size_bytes)"
          [[ "$head_sha" == "$SOURCE_SHA" ]]
          [[ "$codex_version" == "$EXPECTED_CODEX_VERSION" ]]
          [[ "$target" == "aarch64-unknown-linux-musl" ]]
          [[ "$archive_size_bytes" == "$(stat -c '%s' codex-termux-aarch64-unknown-linux-musl.tar.gz)" ]]

          archive_sha256="$(sha256sum codex-termux-aarch64-unknown-linux-musl.tar.gz | awk '{print $1}')"
          printf '%s\n' \
            'format_version=2' \
            "repository=${GITHUB_REPOSITORY}" \
            "release_tag=${RELEASE_TAG}" \
            "head_sha=${SOURCE_SHA}" \
            "codex_version=${EXPECTED_CODEX_VERSION}" \
            "archive_sha256=${archive_sha256}" \
            "archive_size_bytes=${archive_size_bytes}" \
            "runtime_size_bytes=${runtime_size_bytes}" \
            > release-manifest.env

          release_files=(
            codex-termux-aarch64-unknown-linux-musl.tar.gz
            metadata.env
            SHA256SUMS
            codex-termux-sbom.spdx.json
            release-manifest.env
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$existing_dir"
            for file in "${release_files[@]}"; do
              cmp --silent "$file" "$existing_dir/$file" || {
                echo "::error::Existing immutable release asset differs: ${file}"
                exit 1
              }
            done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Codex Termux ${PACKAGE_VERSION} (${EXPECTED_CODEX_VERSION})" \
              --notes "Verified complete Termux runtime for OpenAI Codex CLI ${PACKAGE_VERSION}. Exact-source ARM64 artifact, Termux control-plane, and official Android/Termux emulator validation passed before publication." \
              --latest \
              "${release_files[@]}"
          fi

          latest_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" == "$RELEASE_TAG" ]] || {
            echo "::error::GitHub Latest resolved to ${latest_tag}, expected ${RELEASE_TAG}"
            exit 1
          }

          public_dir="$(mktemp -d)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          for file in "${release_files[@]}"; do
            curl --fail --location --silent --show-error --retry 8 \
              "${base}/${file}" -o "${public_dir}/${file}"
            cmp --silent "$file" "${public_dir}/${file}"
          done
          (cd "$public_dir" && sha256sum --check --strict SHA256SUMS)

          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main
          cp dist/release-manifest.env scripts/termux/release-manifest.env
          git add scripts/termux/release-manifest.env
          if ! git diff --cached --quiet; then
            git commit -m "termux: promote ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
          promotion_sha="$(git rev-parse HEAD)"

          echo "archive_sha256=${archive_sha256}" >> "$GITHUB_OUTPUT"
          echo "promotion_sha=${promotion_sha}" >> "$GITHUB_OUTPUT"

      - name: Require post-promotion control-plane and governance success
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          promotion_sha="${{ steps.publish.outputs.promotion_sha }}"

          wait_for_workflow() {
            local workflow="$1"
            local label="$2"
            local run_id="" status="" conclusion=""
            for _ in $(seq 1 160); do
              state="$(
                gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=100" \
                  --jq ".workflow_runs
                    | map(select(.head_sha == \"${promotion_sha}\"))
                    | first // {}
                    | [(.id // \"\"), (.status // \"\"), (.conclusion // \"\")]
                    | @tsv"
              )"
              IFS=$'\t' read -r run_id status conclusion <<<"$state"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "::error::${label} run ${run_id} concluded ${conclusion}"
                  exit 1
                }
                printf '%s' "$run_id"
                return 0
              fi
              sleep 15
            done
            echo "::error::${label} did not complete successfully" >&2
            return 1
          }

          control_run="$(wait_for_workflow termux-control-plane.yml 'Termux control-plane')"
          governance_run="$(wait_for_workflow termux-governance-audit.yml 'Termux governance audit')"
          echo "control_run=${control_run}" >> "$GITHUB_OUTPUT"
          echo "governance_run=${governance_run}" >> "$GITHUB_OUTPUT"

          manifest_tag="$(sed -n 's/^release_tag=//p' scripts/termux/release-manifest.env)"
          latest_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "$manifest_tag" == "$RELEASE_TAG" && "$latest_tag" == "$RELEASE_TAG" ]]

      - name: Remove this one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm "$SELF_PATH"
          git commit -m "chore: remove one-time validated alpha publisher"
          git push origin HEAD:main

      - name: Record publication success
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body \
            "## Latest alpha publication completed\n\n- Release: [${RELEASE_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})\n- Package: \`${PACKAGE_VERSION}\`\n- Runtime source: \`${SOURCE_SHA}\`\n- Binary: \`${EXPECTED_CODEX_VERSION}\`\n- Archive SHA-256: \`${{ steps.publish.outputs.archive_sha256 }}\`\n- Control-plane run: [${{ steps.audit.outputs.control_run }}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ steps.audit.outputs.control_run }})\n- Governance run: [${{ steps.audit.outputs.governance_run }}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ steps.audit.outputs.governance_run }})\n\nThe promoted manifest and GitHub Latest endpoint both resolve to this immutable release."

      - name: Record publication failure
        if: failure()
        shell: bash
        run: |
          set +e
          gh issue comment 44 --repo "$GITHUB_REPOSITORY" --body \
            "## Latest alpha publication failed\n\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nThe existing promoted runtime was left unchanged unless an earlier completed step is explicitly recorded in this run."
