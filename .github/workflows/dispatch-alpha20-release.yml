name: dispatch-alpha20-release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-alpha20-release.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch publisher at validated control branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run termux-release-request.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-control-alpha20
          echo 'Dispatched termux-release-request.yml at release-control-alpha20.' >> "$GITHUB_STEP_SUMMARY"
