name: trigger-publish-validated-alpha-149-once
# Follow-up push triggers this workflow after it exists on protected main.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-publish-validated-alpha-149-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SELF_PATH: .github/workflows/trigger-publish-validated-alpha-149-once.yml
    steps:
      - name: Dispatch validated alpha publisher
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-validated-alpha-149-once.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Remove this trigger
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${SELF_PATH}?ref=main")"
          sha="$(jq -r .sha <<<"$metadata")"
          gh api --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/contents/${SELF_PATH}" \
            -f message="chore: remove one-time alpha publisher trigger" \
            -f sha="$sha" \
            -f branch=main >/dev/null
