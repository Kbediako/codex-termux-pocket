name: patch-termux-run-as-poll

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-termux-run-as-poll.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Replace remote-shell readiness check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/termux-android-emulator-check.sh')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          starts = [
              index
              for index, line in enumerate(lines)
              if 'if adb shell run-as com.termux sh -c' in line
              and index + 4 < len(lines)
              and 'test -x files/usr/bin/bash' in lines[index + 1]
          ]
          if len(starts) != 1:
              raise SystemExit(f'expected one quoted readiness probe, found {len(starts)}')
          index = starts[0]
          replacement = [
              '    if adb shell run-as com.termux ls files/usr/bin/bash >/dev/null 2>&1; then\n',
              '      adb shell run-as com.termux files/usr/bin/bash --version >/dev/null 2>&1\n',
              '      return 0\n',
              '    fi\n',
          ]
          lines[index:index + 5] = replacement
          path.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Validate and push script-only change
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/termux-android-emulator-check.sh
          grep -F 'run-as com.termux ls files/usr/bin/bash' .github/scripts/termux-android-emulator-check.sh >/dev/null
          if grep -F 'test -x files/usr/bin/bash' .github/scripts/termux-android-emulator-check.sh; then
            exit 1
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/termux-android-emulator-check.sh
          git commit -m 'ci: use a quote-safe Termux readiness probe'
          git push origin HEAD:main
