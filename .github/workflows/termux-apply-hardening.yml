name: termux-apply-hardening

on:
  push:
    branches:
      - agent/termux-hardening-alpha-20
    paths:
      - ".github/workflows/termux-apply-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termux-apply-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      PREFIX: /data/data/com.termux/files/usr
      TERMUX_APK_RELEASE: F_DROID
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Simulate the Termux bash path
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$PREFIX/bin"
          sudo ln -sfn /usr/bin/bash "$PREFIX/bin/bash"

      - name: Apply exact hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/termux/apply-hardening-patch.py
          python3 scripts/termux/apply-hardening-patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/termux/termux-mobile-lib.sh")
          text = path.read_text(encoding="utf-8")
          old = '  (cd "$root" && sha256sum --check --strict "$CODEX_TERMUX_RUNTIME_CHECKSUMS") || {\n'
          new = '  (cd "$root" && sha256sum --check --strict "$CODEX_TERMUX_RUNTIME_CHECKSUMS" >/dev/null) || {\n'
          if text.count(old) != 1:
              raise SystemExit("expected one runtime checksum verification command")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate patched control plane
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/termux/codex-cargo-check
            scripts/termux/codex-update-alpha
            scripts/termux/install-codex-termux
            scripts/termux/maintainer-update-alpha
            scripts/termux/smoke-test-artifact
            scripts/termux/termux-mobile-lib.sh
            scripts/termux/tests/run-tests
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          bash scripts/termux/tests/run-tests
          (cd codex-rs && cargo metadata --locked --format-version=1 >/dev/null)
          ruby -e 'require "yaml"; Dir[".github/workflows/termux-*.yml"].sort.each { |path| YAML.load_file(path, aliases: true) }'
          git diff --check

      - name: Publish validated hardening commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/termux-mobile-artifact.yml \
            scripts/termux/codex-update-alpha \
            scripts/termux/smoke-test-artifact \
            scripts/termux/termux-mobile-lib.sh \
            scripts/termux/tests/run-tests
          git diff --cached --quiet && { echo 'No hardening changes were produced.' >&2; exit 1; }
          git commit -m 'termux: harden artifact integrity and update locking'
          git push origin HEAD:agent/termux-hardening-alpha-20
