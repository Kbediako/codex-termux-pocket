name: dispatch-finalize-alpha149-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/finalize-alpha149.trigger"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: finalize-alpha149-release-once.yml
      SELF_PATH: .github/workflows/dispatch-finalize-alpha149-once.yml
      TRIGGER_PATH: .github/finalize-alpha149.trigger
    steps:
      - name: Dispatch or adopt the finalizer run
        id: target
        shell: bash
        run: |
          set -euo pipefail
          runs="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=main&per_page=20" 2>/dev/null || printf '{"workflow_runs":[]}'
          )"
          run_id="$(
            jq -r '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | first | .id // empty' <<<"$runs"
          )"
          if [[ -z "$run_id" ]]; then
            output="$(gh workflow run "$TARGET_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main)"
            echo "$output"
            run_id="${output##*/}"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=${run_id}" >>"$GITHUB_OUTPUT"

      - name: Wait for successful finalization
        env:
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          for _ in $(seq 1 1200); do
            run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [[ "$status" == completed ]]; then
              break
            fi
            sleep 15
          done
          test "$status" = completed
          test "$conclusion" = success

      - name: Remove dispatcher and marker
        shell: bash
        run: |
          set -euo pipefail
          for path in "$SELF_PATH" "$TRIGGER_PATH"; do
            response="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" 2>/dev/null || true)"
            sha="$(jq -r '.sha // empty' <<<"${response:-{}}")"
            if [[ -n "$sha" ]]; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="chore: remove final alpha publication dispatcher" \
                -f sha="$sha" \
                -f branch=main >/dev/null
            fi
          done
