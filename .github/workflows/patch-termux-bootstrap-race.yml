name: patch-termux-bootstrap-race

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-termux-bootstrap-race.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch bootstrap harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('.github/scripts/termux-android-emulator-check.sh')
          text = path.read_text(encoding='utf-8')
          start_marker = 'adb install -r "$TERMUX_APK"\n'
          end_marker = '\nfixture_archive="${RUNNER_TEMP}/termux-emulator-fixtures.tar.gz"'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('expected unique bootstrap replacement markers')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = base64.b64decode(
              ''
          ).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate and push script-only change
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/termux-android-emulator-check.sh
          grep -F 'wait_for_android_settle' .github/scripts/termux-android-emulator-check.sh >/dev/null
          grep -F 'bootstrap_termux()' .github/scripts/termux-android-emulator-check.sh >/dev/null
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/termux-android-emulator-check.sh
          git commit -m 'ci: stabilize official Termux first-run bootstrap'
          git push origin HEAD:main
